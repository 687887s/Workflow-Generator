            renderDiagram();
            updateRelationsPanel();
            showToast(`已快速交換「${labelA}」與「${labelB}」的順序與位置 (快速鍵: X)`);

            });
        }

        function addEdge() {

        // --- Typography System ---
        const FONT_FAMILIES = {
            'sans': "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif",
            'mono': "'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Monaco, monospace",

        function renderNodeShape(shape, w, h, fill, border) {
            if (shape === 'pill') {
                const rx = h / 2;
                return `<rect x="0" y="0" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${border}" stroke-width="2" />`;
            } else if (shape === 'rounded') {
                return `<rect x="0" y="0" width="${w}" height="${h}" rx="14" fill="${fill}" stroke="${border}" stroke-width="2" />`;
            } else if (shape === 'diamond') {
                return `<polygon points="${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}" fill="${fill}" stroke="${border}" stroke-width="2" />`;
            } else if (shape === 'database') {
                return `
                    <g>
                        <path d="M 0 12 C 0 0, ${w} 0, ${w} 12 L ${w} ${h-12} C ${w} ${h}, 0 ${h}, 0 ${h-12} Z" fill="${fill}" stroke="${border}" stroke-width="2" />
                        <ellipse cx="${w/2}" cy="12" rx="${w/2}" ry="8" fill="${fill}" stroke="${border}" stroke-width="2" />
                        <path d="M 0 26 C 0 34, ${w} 34, ${w} 26" fill="none" stroke="${border}" stroke-width="1.5" stroke-dasharray="3 2" />
                    </g>
                `;
            } else if (shape === 'cloud') {
                return `<rect x="0" y="0" width="${w}" height="${h}" rx="22" fill="${fill}" stroke="${border}" stroke-width="2" stroke-dasharray="6 3" />`;
            } else if (shape === 'hexagon') {
                const p = 22;
                return `<polygon points="${p},0 ${w-p},0 ${w},${h/2} ${w-p},${h} ${p},${h} 0,${h/2}" fill="${fill}" stroke="${border}" stroke-width="2" />`;
            } else {
                return `<rect x="0" y="0" width="${w}" height="${h}" rx="4" fill="${fill}" stroke="${border}" stroke-width="2" />`;
            }
        }

        // --- Node Adaptive Dimension Helpers ---
        function getNodeDimensions(n) {
            if (!n) return { w: 200, h: 72 };
            
            const label = n.label || '';
            const sub = n.sub || '';
            
            // Asian / Chinese characters ~14px, ASCII ~8.5px
            let labelW = 0;
            for (let i = 0; i < label.length; i++) {
                labelW += label.charCodeAt(i) > 255 ? 14 : 8.5;
            }
            
            let subW = 0;
            for (let i = 0; i < sub.length; i++) {
                subW += sub.charCodeAt(i) > 255 ? 11 : 7;
            }
            
            const showIcon = n.showIcon !== false;
            const paddingLeft = showIcon ? 72 : 32;
            const paddingRight = 32;
            const contentW = Math.max(labelW, subW) + paddingLeft + paddingRight;
            
            let baseW = Math.max(180, Math.ceil(contentW / 10) * 10);
            let baseH = 72;
            
            // Shape geometry compensation (inscribed safe zones)
            if (n.shape === 'diamond') {
                const maxTextW = Math.max(labelW, subW);
                if (showIcon) {
                    // With icon: vertical stacked layout, width strictly constrained by text
                    baseW = Math.max(170, Math.ceil((maxTextW + 36) / 0.75 / 10) * 10);
                    baseH = n.sub ? 88 : 80;
                } else {
                    // Without icon: text centered horizontally at y = H/2 (widest area)
                    baseW = Math.max(150, Math.ceil((maxTextW + 48) / 10) * 10);
                    baseH = n.sub ? 72 : 64;
                }
            } else if (n.shape === 'hexagon') {
                baseW = Math.max(210, baseW + 48);
            } else if (n.shape === 'pill') {
                baseW = Math.max(190, baseW + 24);
            } else if (n.shape === 'cloud') {
                baseW = Math.max(200, baseW + 24);
            } else if (n.shape === 'database') {
                baseH = 76;
            }
            
            return { w: baseW, h: baseH };
        }

        // --- Border Intersection & Geometry Calculation Helpers ---
        function rayCircleIntersection(ox, oy, dx, dy, ccx, ccy, r) {
            const fx = ox - ccx;
            const fy = oy - ccy;
            const a = dx * dx + dy * dy;
            const b = 2 * (fx * dx + fy * dy);
            const c = fx * fx + fy * fy - r * r;
            const disc = b * b - 4 * a * c;
            if (disc < 0) return null;
            const t1 = (-b - Math.sqrt(disc)) / (2 * a);
            const t2 = (-b + Math.sqrt(disc)) / (2 * a);
            let t = t1 > 0 ? t1 : (t2 > 0 ? t2 : null);
            if (t === null) return null;
            return { x: ox + t * dx, y: oy + t * dy };
        }

        function raySegmentIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
            const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
            if (Math.abs(denom) < 0.0001) return null;
            const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
            const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
            if (ua >= 0 && ub >= 0 && ub <= 1) {
                return { x: x1 + ua * (x2 - x1), y: y1 + ua * (y2 - y1) };
            }
            return null;
        }

        function getBorderIntersection(pCenter, pTarget, box, shape = 'rect', port = 'auto', offset = 0) {
            const cx = box.cx !== undefined ? box.cx : (box.x + box.w / 2);
            const cy = box.cy !== undefined ? box.cy : (box.y + box.h / 2);
            const w = box.w || 100;
            const h = box.h || 50;
            const halfW = w / 2;
            const halfH = h / 2;
            const ox = (offset && typeof offset === 'number') ? offset : 0;

            // 1. Explicit Anchor Port Tuning with Shape Geometry Awareness
            if (port && port !== 'auto') {
                if (shape === 'diamond') {
                    if (port === 'top') return { x: cx + ox, y: box.y + Math.abs(ox) * (h / (w || 1)), nx: 0, ny: -1, side: 'top' };
                    if (port === 'bottom') return { x: cx + ox, y: box.y + h - Math.abs(ox) * (h / (w || 1)), nx: 0, ny: 1, side: 'bottom' };
                    if (port === 'left') return { x: box.x + Math.abs(ox) * (w / (h || 1)), y: cy + ox, nx: -1, ny: 0, side: 'left' };
                    if (port === 'right') return { x: box.x + w - Math.abs(ox) * (w / (h || 1)), y: cy + ox, nx: 1, ny: 0, side: 'right' };
                } else if (shape === 'hexagon') {
                    const p = 22;
                    if (port === 'top') return { x: Math.max(box.x + p, Math.min(box.x + w - p, cx + ox)), y: box.y, nx: 0, ny: -1, side: 'top' };
                    if (port === 'bottom') return { x: Math.max(box.x + p, Math.min(box.x + w - p, cx + ox)), y: box.y + h, nx: 0, ny: 1, side: 'bottom' };
                    if (port === 'left') return { x: box.x, y: cy + ox, nx: -1, ny: 0, side: 'left' };
                    if (port === 'right') return { x: box.x + w, y: cy + ox, nx: 1, ny: 0, side: 'right' };
                } else if (shape === 'pill') {
                    const r = halfH;
                    const straightHalfW = Math.max(0, halfW - r);
                    if (port === 'top') return { x: Math.max(cx - straightHalfW, Math.min(cx + straightHalfW, cx + ox)), y: box.y, nx: 0, ny: -1, side: 'top' };
                    if (port === 'bottom') return { x: Math.max(cx - straightHalfW, Math.min(cx + straightHalfW, cx + ox)), y: box.y + h, nx: 0, ny: 1, side: 'bottom' };
                    if (port === 'left') return { x: box.x, y: cy, nx: -1, ny: 0, side: 'left' };
                    if (port === 'right') return { x: box.x + w, y: cy, nx: 1, ny: 0, side: 'right' };
                } else {
                    if (port === 'top') return { x: Math.max(box.x, Math.min(box.x + w, cx + ox)), y: box.y, nx: 0, ny: -1, side: 'top' };
                    if (port === 'bottom') return { x: Math.max(box.x, Math.min(box.x + w, cx + ox)), y: box.y + h, nx: 0, ny: 1, side: 'bottom' };
                    if (port === 'left') return { x: box.x, y: Math.max(box.y, Math.min(box.y + h, cy + ox)), nx: -1, ny: 0, side: 'left' };
                    if (port === 'right') return { x: box.x + w, y: Math.max(box.y, Math.min(box.y + h, cy + ox)), nx: 1, ny: 0, side: 'right' };
                }
            }

            const dx = pTarget.x - cx;
            const dy = pTarget.y - cy;
            if (Math.abs(dx) < 0.0001 && Math.abs(dy) < 0.0001) {
                return { x: cx, y: cy - halfH, nx: 0, ny: -1, side: 'top' };
            }

            // 2. Shape-Specific True Boundary Intersection

            // Shape: Diamond
            if (shape === 'diamond') {
                const denom = Math.abs(dx) / (halfW || 1) + Math.abs(dy) / (halfH || 1);
                const t = denom > 0 ? 1 / denom : 0;
                const px = cx + dx * t;
                const py = cy + dy * t;
                const snx = dx > 0 ? 1 : -1;
                const sny = dy > 0 ? 1 : -1;
                return { 
                    x: px, y: py, 
                    nx: snx * 0.707, ny: sny * 0.707, 
                    side: Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'bottom' : 'top') 
                };
            }

            // Shape: Hexagon (6 polygon boundary segments, inset p = 22)
            if (shape === 'hexagon') {
                const p = 22;
                const vertices = [
                    { x: box.x + p, y: box.y },
                    { x: box.x + w - p, y: box.y },
                    { x: box.x + w, y: cy },
                    { x: box.x + w - p, y: box.y + h },
                    { x: box.x + p, y: box.y + h },
                    { x: box.x, y: cy }
                ];
                for (let i = 0; i < 6; i++) {
                    const v1 = vertices[i];
                    const v2 = vertices[(i + 1) % 6];
                    const hit = raySegmentIntersection(cx, cy, cx + dx, cy + dy, v1.x, v1.y, v2.x, v2.y);
                    if (hit) {
                        const edx = v2.x - v1.x, edy = v2.y - v1.y;
                        const elen = Math.hypot(edx, edy) || 1;
                        let nx = edy / elen, ny = -edx / elen;
                        if (nx * dx + ny * dy < 0) { nx = -nx; ny = -ny; }
                        return { x: hit.x, y: hit.y, nx, ny, side: Math.abs(nx) > Math.abs(ny) ? (nx > 0 ? 'right' : 'left') : (ny > 0 ? 'bottom' : 'top') };
                    }
                }
            }

            // Shape: Pill (Capsule)
            if (shape === 'pill') {
                const r = halfH;
                const straightHalfW = Math.max(0, halfW - r);
                
                if (Math.abs(dy) > 0.001) {
                    const tTop = -halfH / dy;
                    if (tTop > 0 && Math.abs(tTop * dx) <= straightHalfW) {
                        return { x: cx + tTop * dx, y: box.y, nx: 0, ny: -1, side: 'top' };
                    }
                    const tBottom = halfH / dy;
                    if (tBottom > 0 && Math.abs(tBottom * dx) <= straightHalfW) {
                        return { x: cx + tBottom * dx, y: box.y + h, nx: 0, ny: 1, side: 'bottom' };
                    }
                }

                if (dx > 0) {
                    const arcCx = cx + straightHalfW;
                    const hit = rayCircleIntersection(cx, cy, dx, dy, arcCx, cy, r);
                    if (hit && hit.x >= arcCx) {
                        const nx = (hit.x - arcCx) / r;
                        const ny = (hit.y - cy) / r;
                        return { x: hit.x, y: hit.y, nx, ny, side: 'right' };
                    }
                } else if (dx < 0) {
                    const arcCx = cx - straightHalfW;
                    const hit = rayCircleIntersection(cx, cy, dx, dy, arcCx, cy, r);
                    if (hit && hit.x <= arcCx) {
                        const nx = (hit.x - arcCx) / r;
                        const ny = (hit.y - cy) / r;
                        return { x: hit.x, y: hit.y, nx, ny, side: 'left' };
                    }
                }
            }

            // Shape: Database (Cylinder with top ellipse rx=halfW, ry=14)
            if (shape === 'database') {
                const ry = 14;
                if (dy < 0) {
                    // Top ellipse ray intersection: (dx*t/halfW)^2 + ((dy*t + (halfH - ry))/ry)^2 = 1
                    const scaleX = halfW / Math.abs(dx || 0.0001);
                    const scaleY = halfH / Math.abs(dy || 0.0001);
                    if (scaleY <= scaleX) {
                        return { x: cx + dx * scaleY, y: box.y, nx: 0, ny: -1, side: 'top' };
                    }
                } else {
                    const scaleY = halfH / Math.abs(dy || 0.0001);
                    const scaleX = halfW / Math.abs(dx || 0.0001);
                    if (scaleY <= scaleX) {
                        return { x: cx + dx * scaleY, y: box.y + h, nx: 0, ny: 1, side: 'bottom' };
                    }
                }
            }

            // Default Box (Rectangle, Rounded Rect, Group Container)
            const scaleX = halfW / Math.abs(dx || 0.0001);
            const scaleY = halfH / Math.abs(dy || 0.0001);
            if (scaleX < scaleY) {
                const nx = dx > 0 ? 1 : -1;
                return { x: cx + dx * scaleX, y: cy + dy * scaleX, nx, ny: 0, side: dx > 0 ? 'right' : 'left' };
            } else {
                const ny = dy > 0 ? 1 : -1;
                return { x: cx + dx * scaleY, y: cy + dy * scaleY, nx: 0, ny, side: dy > 0 ? 'bottom' : 'top' };
            }
        }

        // --- Collapse Hierarchy & Filtering Helpers ---
        function isGroupCollapsed(gid, visited = new Set()) {
            if (!gid || visited.has(gid)) return false;
            visited.add(gid);
            const g = state.subgraphs.find(x => x.id === gid);
            if (!g) return false;
            if (g.collapsed) return true;
            if (g.parent) return isGroupCollapsed(g.parent, visited);
            return false;
        }

        function getTopmostCollapsedAncestor(gid, visited = new Set()) {
            if (!gid || visited.has(gid)) return null;
            visited.add(gid);
            const g = state.subgraphs.find(x => x.id === gid);
            if (!g) return null;
            
            if (g.parent) {
                const parentCollapsed = getTopmostCollapsedAncestor(g.parent, visited);
                if (parentCollapsed) return parentCollapsed;
            }
            if (g.collapsed) return g.id;
            return null;
        }

        function isNodeHidden(node) {
            if (!node || !node.group) return false;
            return isGroupCollapsed(node.group);
        }

        function resolveEffectiveEndpointId(endpointId) {
            if (!endpointId) return null;
            const node = state.nodes.find(n => n.id === endpointId);
            if (node) {
                if (node.group) {
                    const collapsedAncestor = getTopmostCollapsedAncestor(node.group);
                    if (collapsedAncestor) return collapsedAncestor;
                }
                return node.id;
            }
            const group = state.subgraphs.find(g => g.id === endpointId);
            if (group) {
                const collapsedAncestor = getTopmostCollapsedAncestor(group.id);
                if (collapsedAncestor) return collapsedAncestor;
                return group.id;
            }
            return endpointId;
        }

        // --- Multi-edge & Multi-type Adaptive Routing Helpers ---
        function getEdgePairKey(id1, id2) {
            return id1 < id2 ? `${id1}___${id2}` : `${id2}___${id1}`;
        }

        function buildEdgePairIndexMap() {
            const pairMap = new Map();
            state.edges.forEach((e, idx) => {
                const effFrom = resolveEffectiveEndpointId(e.from);
                const effTo = resolveEffectiveEndpointId(e.to);
                if (!effFrom || !effTo || effFrom === effTo) return;

                const key = getEdgePairKey(effFrom, effTo);
                if (!pairMap.has(key)) pairMap.set(key, []);
                pairMap.get(key).push({ edgeIndex: idx, from: effFrom, to: effTo });
            });
            
            const edgeInfoMap = new Map();
            pairMap.forEach((list, key) => {
                const total = list.length;
                list.forEach((item, i) => {
                    edgeInfoMap.set(item.edgeIndex, {
                        indexInPair: i,
                        totalInPair: total,
                        from: item.from,
                        to: item.to
                    });
                });
            });
            return edgeInfoMap;
        }

        // --- Unified Endpoint Bounds Resolver (Supports Node, Subgraph & Collapsed Container) ---
        function getEndpointBounds(endpoint) {
            if (!endpoint) return { cx: 0, cy: 0, w: 100, h: 50, x: 0, y: 0, label: '', isGroup: false, shape: 'rect' };
            
            const id = typeof endpoint === 'string' ? endpoint : endpoint.id;
            const effectiveId = resolveEffectiveEndpointId(id);
            
            // 1. Check if endpoint is a Node
            const node = state.nodes.find(n => n.id === effectiveId);
            if (node) {
                const dim = getNodeDimensions(node);
                return {
                    id: node.id,
                    x: node.x,
                    y: node.y,
                    w: dim.w,
                    h: dim.h,
                    cx: node.x + dim.w / 2,
                    cy: node.y + dim.h / 2,
                    label: node.label,
                    isGroup: false,
                    shape: node.shape || 'rect'
                };
            }
            
            // 2. Check if endpoint is a Group / Subgraph (or Collapsed container)
            const group = state.subgraphs.find(g => g.id === effectiveId);
            if (group) {
                const box = getGroupBoundingBox(group.id);
                return {
                    id: group.id,
                    x: box.gx,
                    y: box.gy,
                    w: box.gw,
                    h: box.gh,
                    cx: box.gx + box.gw / 2,
                    cy: box.gy + box.gh / 2,
                    label: group.label,
                    isGroup: true,
                    shape: 'rect'
                };
            }
            
            if (endpoint.x !== undefined && endpoint.y !== undefined) {
                const w = endpoint.w || 100, h = endpoint.h || 50;
                return {
                    id: endpoint.id || (typeof endpoint === 'string' ? endpoint : ''),
                    x: endpoint.x,
                    y: endpoint.y,
                    w, h,
                    cx: endpoint.cx !== undefined ? endpoint.cx : (endpoint.x + w / 2),
                    cy: endpoint.cy !== undefined ? endpoint.cy : (endpoint.y + h / 2),
                    label: endpoint.label || '',
                    isGroup: !!endpoint.isGroup,
                    shape: endpoint.shape || 'rect'
                };
            }
            
            return { id: '', cx: 0, cy: 0, w: 100, h: 50, x: 0, y: 0, label: '', isGroup: false, shape: 'rect' };
        }

        function computeEdgePath(ep1, ep2, pairIndex = 0, totalInPair = 1, edgeType = 'bezier', labelPos = 0.5, fromPort = 'auto', toPort = 'auto', fromOffset = 0, toOffset = 0) {
            const b1 = getEndpointBounds(ep1);
            const b2 = getEndpointBounds(ep2);
            
            const center1 = { x: b1.cx, y: b1.cy };
            const center2 = { x: b2.cx, y: b2.cy };
            
            // Two-Pass Geometric Convergence for True Shape Boundary Intersection
            const p1_est = getBorderIntersection(center1, center2, b1, b1.shape, fromPort, fromOffset);
            const p2_est = getBorderIntersection(center2, center1, b2, b2.shape, toPort, toOffset);
            const p1 = getBorderIntersection(center1, p2_est, b1, b1.shape, fromPort, fromOffset);
            const p2 = getBorderIntersection(center2, p1, b2, b2.shape, toPort, toOffset);
            
            const x1 = p1.x, y1 = p1.y;
            const x2 = p2.x, y2 = p2.y;
            
            const dx = x2 - x1;
            const dy = y2 - y1;
            const dist = Math.hypot(dx, dy) || 1;

            // Canonical Base Normal Orientation: ensure X->Y and Y->X offset symmetrically in absolute world space
            const id1 = String(b1.id || (typeof ep1 === 'string' ? ep1 : (ep1 && ep1.id ? ep1.id : '')));
            const id2 = String(b2.id || (typeof ep2 === 'string' ? ep2 : (ep2 && ep2.id ? ep2.id : '')));
            const isForward = id1 <= id2;
            const baseSign = isForward ? 1 : -1;

            const perpX = (-dy / dist) * baseSign;
            const perpY = (dx / dist) * baseSign;
            const offsetMultiplier = (pairIndex - (totalInPair - 1) / 2);

            // Dynamic Tag-Aware Route Separation:
            // Standard height of label tag is 24px. To guarantee tag boxes do not overlap, minimum perpendicular distance is 32px
            const tagSeparation = 32;
            const routeOffset = totalInPair > 1 ? offsetMultiplier * tagSeparation : 0;

            // Dynamic Tag Tangent Staggering:
            // When multiple edges exist between the same pair and labelPos is at default (0.5),
            // stagger along the curve so tags are placed before/after each other
            let t = labelPos !== undefined ? labelPos : 0.5;
            if (totalInPair > 1 && (labelPos === undefined || Math.abs(labelPos - 0.5) < 0.01)) {
                const staggerStep = Math.min(0.22, Math.max(0.14, 55 / dist));
                t = 0.5 + offsetMultiplier * staggerStep;
            }
            t = Math.max(0.12, Math.min(0.88, t));

            // 1. Straight Line with Adaptive Parallel Route Separation
            if (edgeType === 'straight') {
                const sx1 = x1 + perpX * routeOffset;
                const sy1 = y1 + perpY * routeOffset;
                const sx2 = x2 + perpX * routeOffset;
                const sy2 = y2 + perpY * routeOffset;
                const d = `M ${sx1} ${sy1} L ${sx2} ${sy2}`;
                const midX = sx1 + (sx2 - sx1) * t;
                const midY = sy1 + (sy2 - sy1) * t;
                return { d, midX, midY };
            }

            // 2. Orthogonal Step Line with Strict Collinear Handling & Layered Routing
            if (edgeType === 'orthogonal') {
                const isNearlyHorizontal = Math.abs(dy) <= 6;
                const isNearlyVertical = Math.abs(dx) <= 6;

                // A. Completely Horizontal Collinear straight line
                if (isNearlyHorizontal && dx > 0 && (p1.side === 'right' || !p1.side) && (p2.side === 'left' || !p2.side)) {
                    const sy = y1 + routeOffset;
                    const d = `M ${x1} ${sy} L ${x2} ${sy}`;
                    const midX = x1 + dx * t;
                    const midY = sy;
                    return { d, midX, midY };
                }

                // B. Completely Vertical Collinear straight line
                if (isNearlyVertical && dy > 0 && (p1.side === 'bottom' || !p1.side) && (p2.side === 'top' || !p2.side)) {
                    const sx = x1 + routeOffset;
                    const d = `M ${sx} ${y1} L ${sx} ${y2}`;
                    const midX = sx;
                    const midY = y1 + dy * t;
                    return { d, midX, midY };
                }

                // C. General Orthogonal Step
                let d = '';
                let midX, midY;
                const side1 = p1.side || (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'bottom' : 'top'));

                if (side1 === 'top' || side1 === 'bottom') {
                    const stepY = (y1 + y2) / 2 + routeOffset;
                    d = `M ${x1} ${y1} L ${x1} ${stepY} L ${x2} ${stepY} L ${x2} ${y2}`;
                    midX = x1 + (x2 - x1) * t;
                    midY = stepY;
                } else {
                    const stepX = (x1 + x2) / 2 + routeOffset;
                    d = `M ${x1} ${y1} L ${stepX} ${y1} L ${stepX} ${y2} L ${x2} ${y2}`;
                    midX = stepX;
                    midY = y1 + (y2 - y1) * t;
                }
                return { d, midX, midY };
            }

            // 3. Smooth Bezier Curve with Normal-Oriented Tangents & Tag Offset
            const curvature = Math.max(30, Math.min(180, dist * 0.45));
            const n1x = p1.nx !== undefined ? p1.nx : (dx > 0 ? 1 : -1);
            const n1y = p1.ny !== undefined ? p1.ny : 0;
            const n2x = p2.nx !== undefined ? p2.nx : (dx > 0 ? -1 : 1);
            const n2y = p2.ny !== undefined ? p2.ny : 0;

            let cp1x, cp1y, cp2x, cp2y;

            if (totalInPair <= 1) {
                cp1x = x1 + n1x * curvature;
                cp1y = y1 + n1y * curvature;
                cp2x = x2 + n2x * curvature;
                cp2y = y2 + n2y * curvature;
            } else {
                const curveOffset = offsetMultiplier * 55;
                cp1x = x1 + n1x * curvature + perpX * curveOffset;
                cp1y = y1 + n1y * curvature + perpY * curveOffset;
                cp2x = x2 + n2x * curvature + perpX * curveOffset;
                cp2y = y2 + n2y * curvature + perpY * curveOffset;
            }

            const d = `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`;

            const it = 1 - t;
            const midX = it*it*it*x1 + 3*it*it*t*cp1x + 3*it*t*t*cp2x + t*t*t*x2;
            const midY = it*it*it*y1 + 3*it*it*t*cp1y + 3*it*t*t*cp2y + t*t*t*y2;

            return { d, midX, midY };
        }

        // --- Hierarchy and Bounding Box Calculations for Groups ---
        function getGroupDepth(gid, visited = new Set()) {
            if (visited.has(gid)) return 0;
            visited.add(gid);
            const g = state.subgraphs.find(x => x.id === gid);
            if (!g || !g.parent) return 0;
            return 1 + getGroupDepth(g.parent, visited);
        }

        function getGroupBoundingBox(gid, visited = new Set()) {
            if (visited.has(gid)) return { gx: 100, gy: 100, gw: 220, gh: 48, minX: 100, minY: 100, maxX: 320, maxY: 148, isEmpty: true, isCollapsed: false };
            visited.add(gid);
            const g = state.subgraphs.find(x => x.id === gid);
            if (!g) return { gx: 100, gy: 100, gw: 220, gh: 48, minX: 100, minY: 100, maxX: 320, maxY: 148, isEmpty: true, isCollapsed: false };

            // If Group is Collapsed: fixed compact capsule/card size
            if (g.collapsed) {
                const gx = g.x !== undefined ? g.x : 100;
                const gy = g.y !== undefined ? g.y : 100;
                const gw = 220;
                const gh = 48;
                return {
                    gx, gy, gw, gh,
                    minX: gx, minY: gy, maxX: gx + gw, maxY: gy + gh,
                    isEmpty: false,
                    isCollapsed: true
                };
            }

            const directNodes = state.nodes.filter(n => n.group === gid && !isNodeHidden(n));
            const childGroups = state.subgraphs.filter(cg => cg.parent === gid);

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            directNodes.forEach(n => {
                const dim = getNodeDimensions(n);
                minX = Math.min(minX, n.x);
                minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x + dim.w);
                maxY = Math.max(maxY, n.y + dim.h);
            });

            childGroups.forEach(cg => {
                const cBox = getGroupBoundingBox(cg.id, new Set(visited));
                minX = Math.min(minX, cBox.minX);
                minY = Math.min(minY, cBox.minY);
                maxX = Math.max(maxX, cBox.maxX);
                maxY = Math.max(maxY, cBox.maxY);
            });

            const pad = 24; const topPad = 40;
            if (minX === Infinity) {
                const gx = (g.x !== undefined ? g.x : 100) - pad;
                const gy = (g.y !== undefined ? g.y : 100) - topPad;
                return {
                    gx, gy, gw: 300, gh: 200,
                    minX: gx, minY: gy, maxX: gx + 300, maxY: gy + 200,
                    isEmpty: true,
                    isCollapsed: false
                };
            }

            const gx = minX - pad;
            const gy = minY - topPad;
            const gw = (maxX - minX) + pad * 2;
            const gh = (maxY - minY) + pad + topPad;
            g.x = gx + pad;
            g.y = gy + topPad;
            return { gx, gy, gw, gh, minX: gx, minY: gy, maxX: gx + gw, maxY: gy + gh, isEmpty: false, isCollapsed: false };
        }

        function renderDiagram() {
            const theme = THEMES[state.theme] || THEMES.academic;
            const typo = state.typography || {
                fontFamily: 'sans',
                nodeTitleSize: 14,
                nodeSubSize: 11,
                edgeLabelSize: 11,
                edgeWidth: 2.5
            };
            const activeFont = FONT_FAMILIES[typo.fontFamily] || FONT_FAMILIES.sans;

            // Dynamic Level of Detail (LOD) based on zoom scale
            const isFarZoom = canvasZoom < 0.65;
            const isNearZoom = canvasZoom > 1.4;
            
            let shadowDy = 4, shadowStdDev = 6, shadowOpacity = 0.35;
            if (isFarZoom) {
                shadowDy = 2; shadowStdDev = 3; shadowOpacity = 0.25;
            } else if (isNearZoom) {
                shadowDy = 6; shadowStdDev = 9; shadowOpacity = 0.45;
            }

            const baseEdgeWidth = typo.edgeWidth || 2.5;
            const effectiveEdgeWidth = isFarZoom ? (baseEdgeWidth + 0.8) : baseEdgeWidth;
            
            // Build lookup maps for O(1) queries
            const nodeMap = new Map();
            state.nodes.forEach(n => nodeMap.set(n.id, n));

            let svgHtml = `
                <svg id="workflowSvg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="overflow: visible; display:block; font-family: ${activeFont};" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
                    <defs>
                        <!-- End Arrowhead (refX=10 puts apex exactly on boundary point) -->
                        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="${theme.edgeColor}" />
                        </marker>
                        <!-- Start Arrowhead (refX=10 + auto-start-reverse puts apex on start boundary pointing outward) -->
                        <marker id="arrow-start" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="${theme.edgeColor}" />
                        </marker>
                        <!-- Selected End Arrowhead -->
                        <marker id="arrow-selected" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#60a5fa" />
                        </marker>
                        <!-- Selected Start Arrowhead -->
                        <marker id="arrow-selected-start" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#60a5fa" />
                        </marker>
                        <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
                            <feDropShadow dx="0" dy="${shadowDy}" stdDeviation="${shadowStdDev}" flood-color="${theme.shadow}" flood-opacity="${shadowOpacity}" />
                        </filter>
                    </defs>
                    <rect width="100%" height="100%" fill="transparent" id="exportBg" />
                    <!-- Native SVG Vector Viewport Transform Container (Zero Blur Scaling) -->
                    <g id="viewportTransform" transform="translate(${panX}, ${panY}) scale(${canvasZoom})">
                        <g id="groupsLayer">
            `;

            // Sort subgraphs by hierarchy depth: root groups first (background), nested groups after (foreground)
            const sortedGroups = [...state.subgraphs].sort((a, b) => getGroupDepth(a.id) - getGroupDepth(b.id));

            sortedGroups.forEach(g => {
                // If this group is a descendant of a collapsed ancestor, do not render this inner group
                if (g.parent && isGroupCollapsed(g.parent)) return;

                const box = getGroupBoundingBox(g.id);
                const gColor = g.color || theme.groupBorder;
                const childNodeCount = state.nodes.filter(n => n.group === g.id).length;
                const isGroupSelected = selectedGroupId === g.id;
                
                if (g.collapsed) {
                    // Collapsed Capsule / Card State
                    svgHtml += `
                        <g data-group-id="${g.id}" class="group-container group-collapsed ${isGroupSelected ? 'group-selected' : ''}" transform="translate(${box.gx}, ${box.gy})" style="cursor: pointer;" ondblclick="toggleGroupCollapse('${g.id}'); event.stopPropagation();">
                            <rect class="group-rect" width="${box.gw}" height="${box.gh}" rx="24" fill="${theme.nodeBg}" stroke="${gColor}" stroke-width="2" filter="url(#dropShadow)" />
                            <!-- Collapse / Expand Icon Button -->
                            <g data-action="toggle-collapse" data-group-id="${g.id}" onclick="toggleGroupCollapse('${g.id}'); event.stopPropagation();" style="cursor: pointer;" title="點擊展開容器">
                                <circle cx="24" cy="24" r="14" fill="${gColor}25" />
                                <path d="M 21 18 L 28 24 L 21 30" fill="none" stroke="${gColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                            </g>
                            <text class="group-title" x="46" y="25" dominant-baseline="central" fill="${gColor}" font-size="12" font-weight="700" style="user-select: none;">${g.label}</text>
                            <!-- Node Count Badge -->
                            <rect x="${box.gw - 66}" y="14" width="54" height="20" rx="10" fill="${gColor}20" stroke="${gColor}50" stroke-width="1" />
                            <text x="${box.gw - 39}" y="25" dominant-baseline="central" text-anchor="middle" fill="${gColor}" font-size="10" font-weight="700">${childNodeCount} 節點</text>
                        </g>
                    `;
                } else {
                    // Expanded Bounding Box State
                    svgHtml += `
                        <g data-group-id="${g.id}" class="group-container ${isGroupSelected ? 'group-selected' : ''}" transform="translate(${box.gx}, ${box.gy})" ondblclick="toggleGroupCollapse('${g.id}'); event.stopPropagation();">
                            <rect class="group-rect" width="${box.gw}" height="${box.gh}" rx="16" fill="${theme.groupBg}" stroke="${gColor}" stroke-width="1.5" stroke-dasharray="5 4" />
                            <!-- Group Draggable Header Bar -->
                            <rect class="group-header" x="0" y="0" width="${box.gw}" height="32" rx="16" fill="${gColor}" fill-opacity="0.12" style="cursor: move;" />
                            <text class="group-title" x="16" y="21" fill="${gColor}" font-size="12" font-weight="700" letter-spacing="0.5" style="cursor: move; user-select: none;">${g.label}</text>
                            <!-- Collapse Toggle Button in Header -->
                            <g data-action="toggle-collapse" data-group-id="${g.id}" class="group-collapse-btn" onclick="toggleGroupCollapse('${g.id}'); event.stopPropagation();" style="cursor: pointer;" title="點擊收折容器 (或雙擊標題)">
                                <rect x="${box.gw - 32}" y="4" width="24" height="24" rx="6" fill="${gColor}25" stroke="${gColor}60" stroke-width="1" />
                                <path d="M ${box.gw - 25} 16 L ${box.gw - 15} 16" stroke="${gColor}" stroke-width="2.5" stroke-linecap="round" />
                            </g>
                            ${box.isEmpty ? `<text class="group-empty-hint" x="${box.gw/2}" y="${box.gh/2}" fill="${theme.textSub}" font-size="12" font-weight="500" text-anchor="middle" opacity="0.6">空群組：可拖曳移動或指派節點/子群組</text>` : ''}
                        </g>
                    `;
                }
            });

            svgHtml += `</g><g id="edgesLayer">`;

            // Multi-edge pair index map for adaptive routing
            const edgePairInfoMap = buildEdgePairIndexMap();

            state.edges.forEach((e, idx) => {
                const effFrom = resolveEffectiveEndpointId(e.from);
                const effTo = resolveEffectiveEndpointId(e.to);
                
                // If both endpoints route to the exact same collapsed group, skip rendering internal connection
                if (!effFrom || !effTo || effFrom === effTo) return;

                const epA = getEndpointBounds(effFrom);
                const epB = getEndpointBounds(effTo);
                
                if (epA && epB) {
                    const edgeInfo = edgePairInfoMap.get(idx) || { indexInPair: 0, totalInPair: 1 };
                    const pathData = computeEdgePath(epA, epB, edgeInfo.indexInPair, edgeInfo.totalInPair, e.type, e.labelPos, e.fromPort, e.toPort, e.fromOffset, e.toOffset);
                    const strokeDash = e.style === 'dashed' ? 'stroke-dasharray="6 6"' : '';
                    const isEdgeSelected = selectedEdgeIdx === idx;
                    const strokeColor = isEdgeSelected ? '#60a5fa' : theme.edgeColor;
                    const strokeWidth = e.width ? parseFloat(e.width) : effectiveEdgeWidth;

                    const markerEndId = isEdgeSelected ? 'url(#arrow-selected)' : 'url(#arrow)';
                    const markerStartId = isEdgeSelected ? 'url(#arrow-selected-start)' : 'url(#arrow-start)';
                    const arrowMode = e.arrow || 'end';

                    let markerAttrs = '';
                    if (arrowMode === 'both') {
                        markerAttrs = `marker-start="${markerStartId}" marker-end="${markerEndId}"`;
                    } else if (arrowMode === 'start') {
                        markerAttrs = `marker-start="${markerStartId}"`;
                    } else if (arrowMode === 'none') {
                        markerAttrs = '';
                    } else {
                        markerAttrs = `marker-end="${markerEndId}"`;
                    }

                    svgHtml += `
                        <g data-edge-idx="${idx}" data-from="${e.from}" data-to="${e.to}" class="edge-group ${isEdgeSelected ? 'edge-selected' : ''}">
                            ${isEdgeSelected ? `<path d="${pathData.d}" fill="none" stroke="#3b82f6" stroke-width="${strokeWidth + 4}" opacity="0.4" stroke-linecap="round" />` : ''}
                            <path class="edge-path" d="${pathData.d}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${strokeDash} ${markerAttrs} />
                            <!-- Hit area for easy clicking & selection -->
                            <path class="edge-hitbox" onclick="selectEdge(${idx}); event.stopPropagation();" d="${pathData.d}" fill="none" stroke="transparent" stroke-width="18" style="cursor: pointer;" />
                    `;

                    if (e.label) {
                        const labelLen = e.label.length;
                        const boxW = Math.max(50, labelLen * 9 + 16);
                        svgHtml += `
                            <rect class="edge-label-bg" onclick="selectEdge(${idx}); event.stopPropagation();" x="${pathData.midX - boxW/2}" y="${pathData.midY - 12}" width="${boxW}" height="24" rx="6" fill="${theme.bg}" stroke="${isEdgeSelected ? '#3b82f6' : theme.nodeBorder}" stroke-width="${isEdgeSelected ? 1.5 : 1}" opacity="0.95" style="cursor: pointer;" />
                            <text class="edge-label-text" onclick="selectEdge(${idx}); event.stopPropagation();" x="${pathData.midX}" y="${pathData.midY + 4}" fill="${isEdgeSelected ? '#60a5fa' : theme.edgeText}" font-size="${typo.edgeLabelSize || 11}" font-weight="600" text-anchor="middle" style="cursor: pointer; user-select: none;">${e.label}</text>
                        `;
                    }
                    svgHtml += `</g>`;
                }
            });

            svgHtml += `</g><g id="nodesLayer">`;

            state.nodes.forEach(n => {
                // Filter out hidden nodes belonging to collapsed groups
                if (isNodeHidden(n)) return;

                const dim = getNodeDimensions(n);
                const w = dim.w;
                const h = dim.h;
                const nodeBorder = n.color || theme.nodeBorder;
                const isSelected = selectedNodeIds.has(n.id) || selectedNodeId === n.id;
                const selectedClass = isSelected ? 'node-selected' : '';
                const iconColor = n.color || '#3b82f6';
                
                const normIcon = n.icon ? (n.icon.startsWith('fa-') ? n.icon.replace('fa-', '') : n.icon) : 'box';
                const iconInner = OFFICIAL_LUCIDE_ICONS[normIcon] || OFFICIAL_LUCIDE_ICONS['fa-' + normIcon] || OFFICIAL_LUCIDE_ICONS[n.icon] || OFFICIAL_LUCIDE_ICONS['default'];

                const nodeShowIcon = n.showIcon !== false;
                let textStartX = 24;
                let textAnchor = 'start';
                let iconHtml = '';
                let mainTextY = n.sub ? Math.round(h / 2 - 2) : Math.round(h / 2 + 5);
                let subTextY = Math.round(h / 2 + 15);

                // Specific placement based on shape to ensure 100% containment
                if (n.shape === 'diamond') {
                    if (nodeShowIcon) {
                        const iconX = Math.round(w / 2 - 16);
                        const iconY = 12;
                        iconHtml = `
                            <rect x="${iconX}" y="${iconY}" width="32" height="32" rx="8" fill="${iconColor}20" />
                            <svg x="${iconX + 5}" y="${iconY + 5}" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                ${iconInner}
                            </svg>
                        `;
                        textStartX = Math.round(w / 2);
                        textAnchor = 'middle';
                        mainTextY = 56;
                        subTextY = 70;
                    } else {
                        textStartX = Math.round(w / 2);
                        textAnchor = 'middle';
                        mainTextY = n.sub ? Math.round(h / 2 - 3) : Math.round(h / 2 + 5);
                        subTextY = Math.round(h / 2 + 14);
                    }
                } else if (n.shape === 'hexagon') {
                    const iconY = Math.round(h / 2 - 18);
                    iconHtml = nodeShowIcon ? `
                        <rect x="24" y="${iconY}" width="36" height="36" rx="8" fill="${iconColor}20" />
                        <svg x="30" y="${iconY + 6}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            ${iconInner}
                        </svg>
                    ` : '';
                    textStartX = nodeShowIcon ? 72 : 32;
                } else if (n.shape === 'database') {
                    const iconY = Math.round(h / 2 - 13);
                    iconHtml = nodeShowIcon ? `
                        <rect x="16" y="${iconY}" width="36" height="36" rx="8" fill="${iconColor}20" />
                        <svg x="22" y="${iconY + 6}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            ${iconInner}
                        </svg>
                    ` : '';
                    textStartX = nodeShowIcon ? 66 : 24;
                    mainTextY = n.sub ? Math.round(h / 2 + 3) : Math.round(h / 2 + 8);
                    subTextY = Math.round(h / 2 + 18);
                } else if (n.shape === 'pill') {
                    const iconY = Math.round(h / 2 - 18);
                    iconHtml = nodeShowIcon ? `
                        <rect x="20" y="${iconY}" width="36" height="36" rx="8" fill="${iconColor}20" />
                        <svg x="26" y="${iconY + 6}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            ${iconInner}
                        </svg>
                    ` : '';
                    textStartX = nodeShowIcon ? 68 : 28;
                } else {
                    const iconY = Math.round(h / 2 - 18);
                    iconHtml = nodeShowIcon ? `
                        <rect x="16" y="${iconY}" width="36" height="36" rx="8" fill="${iconColor}20" />
                        <svg x="22" y="${iconY + 6}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            ${iconInner}
                        </svg>
                    ` : '';
                    textStartX = nodeShowIcon ? 66 : 24;
                }

                svgHtml += `
                    <g transform="translate(${n.x}, ${n.y})" class="node-group ${selectedClass}" data-id="${n.id}" filter="url(#dropShadow)" style="cursor: move;">
                        ${renderNodeShape(n.shape, w, h, theme.nodeBg, nodeBorder)}
                        ${iconHtml}
                        <text x="${textStartX}" y="${mainTextY}" text-anchor="${textAnchor}" font-size="${typo.nodeTitleSize || 14}" font-weight="bold" fill="${theme.text}">${n.label}</text>
                        ${n.sub ? `<text x="${textStartX}" y="${subTextY}" text-anchor="${textAnchor}" font-size="${typo.nodeSubSize || 11}" font-weight="normal" fill="${theme.textSub}">${n.sub}</text>` : ''}
                    </g>
                `;
            });

            svgHtml += `</g></g></svg>`;

            const container = document.getElementById('svgContainer');
            container.innerHTML = svgHtml;
        }

        function loadPreset(key) {
            if (PRESETS[key]) {
                state = JSON.parse(JSON.stringify(PRESETS[key]));
                document.getElementById('themeSelect').value = state.theme;
                selectNode(null);
                selectedEdgeIdx = null;
                saveHistory();
                renderDiagram();
                updateRelationsPanel();
                centerView();
                showToast('已載入範本');
            }
        }

        function changeTheme(themeKey) {
            state.theme = themeKey;
            saveHistory();
            renderDiagram();
            showToast('主題切換成功');
        }

        function applyJsonCode() {
            try {
                state = JSON.parse(document.getElementById('jsonEditor').value);
                selectNode(null);
                selectedEdgeIdx = null;
                saveHistory();
                renderDiagram();
                updateRelationsPanel();
                showToast('JSON 規格更新成功！');
            } catch (err) {
                showToast('JSON 格式錯誤：' + err.message, 'error');
            }
        }

        function copySVGCode() {
            const svgEl = document.getElementById('workflowSvg');
            if (!svgEl) return;
            const svgCode = svgEl.outerHTML.replace('<rect width="100%" height="100%" fill="transparent" id="exportBg" />', '');
            
            navigator.clipboard.writeText(svgCode).then(() => {
                showToast('SVG 碼已複製到剪貼簿！');
            }).catch(() => {
                const temp = document.createElement('textarea');
                temp.value = svgCode;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                showToast('SVG 碼已複製到剪貼簿！');
            });
        }

        function setMode(mode) {
            appMode = mode;
            const btnDrag = document.getElementById('modeDrag');
            const btnSelect = document.getElementById('modeSelect');
            const vp = document.getElementById('canvasViewport');
            const guideBar = document.getElementById('selectionModeGuide');
            const dimLabel = document.getElementById('selectionBoxDimension');
            
            if (mode === 'select') {
                if (btnSelect) btnSelect.className = "px-3 py-1.5 rounded-md bg-blue-600 text-white text-xs font-bold transition shadow-sm";
                if (btnDrag) btnDrag.className = "px-3 py-1.5 rounded-md text-slate-400 hover:text-white text-xs font-bold transition";
                if (vp) {
                    vp.classList.remove('cursor-grab', 'cursor-move');
                    vp.classList.add('cursor-crosshair');
                }
                if (guideBar) {
                    guideBar.classList.remove('hidden');
                    guideBar.classList.add('flex');
                }
                if (dimLabel) {
                    dimLabel.innerText = "請在畫布上拖曳圈選區域";
                }
                showToast('已進入「框選匯出」模式：請在畫布上拖曳拉出選取矩形');
            } else {
                if (btnDrag) btnDrag.className = "px-3 py-1.5 rounded-md bg-blue-600 text-white text-xs font-bold transition shadow-sm";
                if (btnSelect) btnSelect.className = "px-3 py-1.5 rounded-md text-slate-400 hover:text-white text-xs font-bold transition";
                if (vp) {
                    vp.classList.remove('cursor-crosshair');
                    vp.classList.add('cursor-grab');
                }
                if (guideBar) {
                    guideBar.classList.add('hidden');
                    guideBar.classList.remove('flex');
                }
                const sb = document.getElementById('selectionBox');
                if (sb) sb.classList.add('hidden');
                customExportBox = null;
            }
        }

        function openExportModal() {
            const modal = document.getElementById('exportModal');
            const content = document.getElementById('exportModalContent');
            
            // If customExportBox exists, automatically select 'custom' radio and activate options
            if (customExportBox) {
                const radioCustom = document.getElementById('radioCustomArea');
                const labelCustom = document.getElementById('labelCustomArea');
                const customDesc = document.getElementById('customAreaDesc');
                if (radioCustom) {
                    radioCustom.disabled = false;
                    radioCustom.checked = true;
                }
                if (labelCustom) labelCustom.classList.remove('opacity-50');
                if (customDesc) {
                    customDesc.innerText = `已鎖定框選：${Math.round(customExportBox.w)} × ${Math.round(customExportBox.h)} px (X: ${Math.round(customExportBox.x)}, Y: ${Math.round(customExportBox.y)})`;
                }
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeExportModal() {
            const modal = document.getElementById('exportModal');
            const content = document.getElementById('exportModalContent');
            // Keep selection box on canvas for easy user verification!
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function setExportFmt(fmt) {
            selectedExportFormat = fmt;
            const btnPng = document.getElementById('expFmtPng');
            const btnSvg = document.getElementById('expFmtSvg');
            const scaleSec = document.getElementById('pngScaleSection');
            
            if (fmt === 'png') {
                btnPng.className = "flex-1 py-2 rounded border border-blue-500 bg-blue-500/10 text-blue-400 text-xs font-bold transition";
                btnSvg.className = "flex-1 py-2 rounded border border-slate-600 bg-slate-900 text-slate-300 hover:bg-slate-700 text-xs font-bold transition";
                if (scaleSec) scaleSec.style.display = 'block';
            } else {
                btnSvg.className = "flex-1 py-2 rounded border border-blue-500 bg-blue-500/10 text-blue-400 text-xs font-bold transition";
                btnPng.className = "flex-1 py-2 rounded border border-slate-600 bg-slate-900 text-slate-300 hover:bg-slate-700 text-xs font-bold transition";
                if (scaleSec) scaleSec.style.display = 'none';
            }
        }

        function executeQuickExport(format) {
            if (!customExportBox) {
                showToast('請先在畫布上拖曳拉出框選範圍', 'warning');
                return;
            }
            const bg = document.getElementById('expBg')?.value || 'transparent';
            executeExport(format, 'custom', bg);
        }

        function confirmExport() {
            const checkedRadio = document.querySelector('input[name="expArea"]:checked');
            let area = checkedRadio ? checkedRadio.value : 'autofit';
            if (customExportBox && (!checkedRadio || checkedRadio.value === 'custom')) {
                area = 'custom';
            }
            const bg = document.getElementById('expBg').value;
            closeExportModal();
            executeExport(selectedExportFormat, area, bg);
        }

        function executeExport(format, area, bgSetting) {
            const originalSvg = document.getElementById('workflowSvg');
            if (!originalSvg) return;

            const oldSelectedId = selectedNodeId;
            const oldSelectedEdge = selectedEdgeIdx;
            if (oldSelectedId || oldSelectedEdge !== null) {
                selectedNodeId = null;
                selectedEdgeIdx = null;
                renderDiagram(); 
            }

            setTimeout(() => {
                const svgToExport = document.getElementById('workflowSvg').cloneNode(true);
                const theme = THEMES[state.theme] || THEMES.academic;
                const bgColor = bgSetting === 'theme' ? theme.bg : 'transparent';
                
                const bgRect = svgToExport.querySelector('#exportBg');
                if (bgRect) bgRect.setAttribute('fill', bgColor);

                let exportW, exportH, viewBoxStr;
                if (area === 'custom' && customExportBox) {
                    exportW = Math.max(20, Math.round(customExportBox.w));
                    exportH = Math.max(20, Math.round(customExportBox.h));
                    viewBoxStr = `${Math.round(customExportBox.x)} ${Math.round(customExportBox.y)} ${exportW} ${exportH}`;
                    if (bgRect) {
                        bgRect.setAttribute('x', Math.round(customExportBox.x));
                        bgRect.setAttribute('y', Math.round(customExportBox.y));
                        bgRect.setAttribute('width', exportW);
                        bgRect.setAttribute('height', exportH);
                    }
                } else if (area === 'autofit') {
                    const bbox = getNodesBoundingBox();
                    const pad = 50;
                    exportW = bbox.w + pad * 2;
                    exportH = bbox.h + pad * 2;
                    viewBoxStr = `${bbox.x - pad} ${bbox.y - pad} ${exportW} ${exportH}`;
                } else {
                    const vp = document.getElementById('canvasViewport');
                    exportW = vp.clientWidth / canvasZoom;
                    exportH = vp.clientHeight / canvasZoom;
                    viewBoxStr = `${-panX/canvasZoom} ${-panY/canvasZoom} ${exportW} ${exportH}`;
                }

                const vpGroup = svgToExport.querySelector('#viewportTransform');
                if (vpGroup) vpGroup.removeAttribute('transform');

                svgToExport.setAttribute('viewBox', viewBoxStr);
                svgToExport.setAttribute('width', exportW);
                svgToExport.setAttribute('height', exportH);
                svgToExport.setAttribute('xmlns', "http://www.w3.org/2000/svg");

                const svgData = new XMLSerializer().serializeToString(svgToExport);

                if (format === 'svg') {
                    const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `workflow-${Date.now()}.svg`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('向量 SVG 下載完成！');
                    restoreSelection();
                } 
                else if (format === 'png') {
                    const scaleFactor = parseInt(document.getElementById('expScale')?.value || '3');
                    showToast(`正在生成 ${scaleFactor}x 超高解析度 PNG...`, 'success');
                    
                    const canvas = document.getElementById('exportCanvas');
                    canvas.width = exportW * scaleFactor; 
                    canvas.height = exportH * scaleFactor;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    
                    if (bgColor !== 'transparent') {
                        ctx.fillStyle = bgColor;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(svgBlob);
                    
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = function() {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        URL.revokeObjectURL(url);
                        try {
                            const pngDataUrl = canvas.toDataURL('image/png');
                            const a = document.createElement('a');
                            a.href = pngDataUrl;
                            a.download = `workflow-${scaleFactor}x-${Date.now()}.png`;
                            a.click();
                            showToast(`${scaleFactor}x 高解析度 PNG 匯出完成！`);
                        } catch (err) {
                            showToast('PNG 轉換發生問題，請嘗試下載 SVG', 'error');
                        }
                        restoreSelection();
                    };
                    img.onerror = function() {
                        showToast('圖像渲染失敗，請改用 SVG 格式下載', 'error');
                        restoreSelection();
                    };
                    img.src = url;
                }
            }, 50);

            function restoreSelection() {
                if (oldSelectedId || oldSelectedEdge !== null) {
                    selectedNodeId = oldSelectedId;
                    selectedEdgeIdx = oldSelectedEdge;
                    renderDiagram();
                }
            }
        }

        function getNodesBoundingBox() {
            if (state.nodes.length === 0 && state.subgraphs.length === 0) return { x: 0, y: 0, w: 800, h: 600 };
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            state.nodes.forEach(n => {
                const dim = getNodeDimensions(n);
                minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x + dim.w); maxY = Math.max(maxY, n.y + dim.h);
            });
            state.subgraphs.forEach(g => {
                const box = getGroupBoundingBox(g.id);
                minX = Math.min(minX, box.minX);
                minY = Math.min(minY, box.minY);
                maxX = Math.max(maxX, box.maxX);
                maxY = Math.max(maxY, box.maxY);
            });
            if (minX === Infinity) { minX = 0; minY = 0; maxX = 800; maxY = 600; }
            return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            toastIcon.className = type === 'error' ? 'fa-solid fa-circle-xmark text-red-400' : 
                                  type === 'warning' ? 'fa-solid fa-triangle-exclamation text-amber-400' : 
                                  'fa-solid fa-circle-check text-emerald-400';

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
