                    const rect = viewport.getBoundingClientRect();
                    selectStartX = e.clientX - rect.left;
                    selectStartY = e.clientY - rect.top;
                    const sb = document.getElementById('selectionBox');
                    sb.style.left = selectStartX + 'px';
                    sb.style.top = selectStartY + 'px';
                    sb.style.width = '0px';
                    sb.style.height = '0px';
                    sb.classList.remove('hidden');
                    return;
                }

                const nodeGroup = e.target.closest('.node-group');
                const groupEl = e.target.closest('.group-container');
                
                if (nodeGroup) {
                    isDraggingNode = true;
                    const nodeId = nodeGroup.getAttribute('data-id');
                    selectNode(nodeId);

                    const node = state.nodes.find(n => n.id === nodeId);
                    const pt = getMousePositionInSVG(e);
                    
                    nodeDragOffsetX = pt.x - node.x;
                    nodeDragOffsetY = pt.y - node.y;
                    
                    viewport.classList.remove('cursor-grab');
                    viewport.classList.add('cursor-move');
                    e.stopPropagation(); 
                } else if (groupEl && (e.target.classList.contains('group-header') || e.target.classList.contains('group-title') || e.target.classList.contains('group-rect'))) {
                    // Start Group Drag
                    isDraggingGroup = true;
                    selectedGroupId = groupEl.getAttribute('data-group-id');
                    groupDragStartPt = getMousePositionInSVG(e);

                    const desc = getAllGroupDescendants(selectedGroupId);
                    groupDragInitialNodes = desc.nodes.map(n => ({ node: n, startX: n.x, startY: n.y }));
                    groupDragInitialGroups = desc.subgraphs.map(g => ({ group: g, startX: g.x !== undefined ? g.x : 100, startY: g.y !== undefined ? g.y : 100 }));

                    viewport.classList.remove('cursor-grab');
                    viewport.classList.add('cursor-move');
                    selectNode(null);
                    e.stopPropagation();
                } else {
                    isDraggingCanvas = true;
                    dragStartX = e.clientX - panX;
                    dragStartY = e.clientY - panY;
                    viewport.classList.remove('cursor-grab');
                    viewport.classList.add('cursor-grabbing');
                    selectNode(null);
                    if (selectedEdgeIdx !== null) {
                        selectedEdgeIdx = null;
                        updateRelationsPanel();
                    }
                }
            });

            // Fast local DOM updates during node drag (avoids re-building entire SVG)
            function updateDraggedNodeDOM(nodeId, nx, ny) {
                const nodeEl = document.querySelector(`.node-group[data-id="${nodeId}"]`);
                if (nodeEl) {
                    nodeEl.setAttribute('transform', `translate(${nx}, ${ny})`);
                }

                const nodeMap = new Map();
                state.nodes.forEach(n => nodeMap.set(n.id, n));
                const draggedNode = nodeMap.get(nodeId);
                const edgePairInfoMap = buildEdgePairIndexMap();

                // Update affected edges (either connected directly to the node or to affected groups)
                state.edges.forEach((e, idx) => {
                    const isDirectlyConnected = (e.from === nodeId || e.to === nodeId);
                    const isGroupConnected = (draggedNode && draggedNode.group && (e.from === draggedNode.group || e.to === draggedNode.group));
                    if (isDirectlyConnected || isGroupConnected) {
                        const edgeEl = document.querySelector(`[data-edge-idx="${idx}"]`);
                        if (edgeEl) {
                            const epA = getEndpointBounds(e.from);
                            const epB = getEndpointBounds(e.to);
                            if (epA && epB) {
                                const edgeInfo = edgePairInfoMap.get(idx) || { indexInPair: 0, totalInPair: 1 };
                                const pathData = computeEdgePath(epA, epB, edgeInfo.indexInPair, edgeInfo.totalInPair, e.type, e.labelPos);
                                const pathEl = edgeEl.querySelector('.edge-path');
                                if (pathEl) pathEl.setAttribute('d', pathData.d);
                                const hitboxEl = edgeEl.querySelector('.edge-hitbox');
                                if (hitboxEl) hitboxEl.setAttribute('d', pathData.d);
                                
                                const labelBg = edgeEl.querySelector('.edge-label-bg');
                                const labelText = edgeEl.querySelector('.edge-label-text');
                                if (labelBg && labelText) {
                                    const labelLen = (e.label || '').length;
                                    const boxW = Math.max(50, labelLen * 9 + 16);
                                    labelBg.setAttribute('x', pathData.midX - boxW/2);
                                    labelBg.setAttribute('y', pathData.midY - 12);
                                    labelText.setAttribute('x', pathData.midX);
                                    labelText.setAttribute('y', pathData.midY + 4);
                                }
                            }
                        }
                    }
                });

                // Update affected group bounds
                if (draggedNode && draggedNode.group) {
                    let currGid = draggedNode.group;
                    while (currGid) {
                        const groupEl = document.querySelector(`[data-group-id="${currGid}"]`);
                        if (groupEl) {
                            const box = getGroupBoundingBox(currGid);
                            groupEl.setAttribute('transform', `translate(${box.gx}, ${box.gy})`);
                            const rectEl = groupEl.querySelector('.group-rect');
                            const headerEl = groupEl.querySelector('.group-header');
                            if (rectEl) {
                                rectEl.setAttribute('width', box.gw);
                                rectEl.setAttribute('height', box.gh);
                            }
                            if (headerEl) {
                                headerEl.setAttribute('width', box.gw);
                            }
                        }
                        const gObj = state.subgraphs.find(x => x.id === currGid);
                        currGid = gObj ? gObj.parent : null;
                    }
                }
            }

            let dragRafId = null;
            let panRafId = null;

            window.addEventListener('mousemove', (e) => {
                if (isSelectingArea) {
                    const rect = viewport.getBoundingClientRect();
                    const currX = e.clientX - rect.left;
                    const currY = e.clientY - rect.top;
                    const sb = document.getElementById('selectionBox');
                    sb.style.left = Math.min(selectStartX, currX) + 'px';
                    sb.style.top = Math.min(selectStartY, currY) + 'px';
                    sb.style.width = Math.abs(currX - selectStartX) + 'px';
                    sb.style.height = Math.abs(currY - selectStartY) + 'px';
                    return;
                }

                if (isDraggingNode && selectedNodeId) {
                    const node = state.nodes.find(n => n.id === selectedNodeId);
                    if (node) {
                        const pt = getMousePositionInSVG(e);
                        // Grid snapping (10px)
                        node.x = Math.round((pt.x - nodeDragOffsetX) / 10) * 10;
                        node.y = Math.round((pt.y - nodeDragOffsetY) / 10) * 10;
                        
                        if (!dragRafId) {
                            dragRafId = requestAnimationFrame(() => {
                                updateDraggedNodeDOM(selectedNodeId, node.x, node.y);
                                dragRafId = null;
                            });
                        }
                    }
                } else if (isDraggingGroup && selectedGroupId) {
                    const pt = getMousePositionInSVG(e);
                    const deltaX = Math.round((pt.x - groupDragStartPt.x) / 10) * 10;
                    const deltaY = Math.round((pt.y - groupDragStartPt.y) / 10) * 10;

                    groupDragInitialNodes.forEach(item => {
                        item.node.x = item.startX + deltaX;
                        item.node.y = item.startY + deltaY;
                    });
                    groupDragInitialGroups.forEach(item => {
                        item.group.x = item.startX + deltaX;
                        item.group.y = item.startY + deltaY;
                    });

                    if (!dragRafId) {
                        dragRafId = requestAnimationFrame(() => {
                            renderDiagram();
                            dragRafId = null;
                        });
                    }
                } else if (isDraggingCanvas) {
                    panX = e.clientX - dragStartX;
                    panY = e.clientY - dragStartY;
                    if (!panRafId) {
                        panRafId = requestAnimationFrame(() => {
                            updateCanvasTransform();
                            panRafId = null;
                        });
                    }
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (dragRafId) { cancelAnimationFrame(dragRafId); dragRafId = null; }
                if (panRafId) { cancelAnimationFrame(panRafId); panRafId = null; }

                if (isSelectingArea) {
                    isSelectingArea = false;
                    const sb = document.getElementById('selectionBox');
                    sb.classList.add('hidden');
                    
                    const rect = viewport.getBoundingClientRect();
                    const endX = e.clientX - rect.left;
                    const endY = e.clientY - rect.top;
                    const minX = Math.min(selectStartX, endX);
                    const minY = Math.min(selectStartY, endY);
                    const w = Math.abs(endX - selectStartX);
                    const h = Math.abs(endY - selectStartY);

                    if (w > 20 && h > 20) {
                        const pt1 = { x: (minX - panX)/canvasZoom, y: (minY - panY)/canvasZoom };
                        const pt2 = { x: (minX + w - panX)/canvasZoom, y: (minY + h - panY)/canvasZoom };
                        customExportBox = { x: pt1.x, y: pt1.y, w: pt2.x - pt1.x, h: pt2.y - pt1.y };
                        
                        document.getElementById('radioCustomArea').disabled = false;
                        document.getElementById('radioCustomArea').checked = true;
                        document.getElementById('labelCustomArea').classList.remove('opacity-50');
                        openExportModal();
                        setMode('drag');
                    }
                    return;
                }

                if (isDraggingNode && selectedNodeId) {
                    const node = state.nodes.find(n => n.id === selectedNodeId);
                    if (node) {
                        const dropZones = getGroupDropZones(selectedNodeId);
                        const dim = getNodeDimensions(node);
                        const nodeCX = node.x + dim.w / 2;
                        const nodeCY = node.y + dim.h / 2;
                        
                        // Collect all matched candidate groups
                        const matchedGroups = [];
                        state.subgraphs.forEach(g => {
                            const z = dropZones[g.id];
                            if (z && nodeCX >= z.minX && nodeCX <= z.maxX && nodeCY >= z.minY && nodeCY <= z.maxY) {
                                matchedGroups.push({
                                    id: g.id,
                                    depth: getGroupDepth(g.id),
                                    area: (z.maxX - z.minX) * (z.maxY - z.minY)
                                });
                            }
                        });
                        
                        // Deepest-Child-First sorting (highest depth first, then smallest bounding box)
                        matchedGroups.sort((a, b) => b.depth - a.depth || a.area - b.area);
                        const targetGroupId = matchedGroups.length > 0 ? matchedGroups[0].id : '';
                        
                        if (node.group !== targetGroupId) {
                            node.group = targetGroupId;
                            if (targetGroupId) {
                                const targetGroup = state.subgraphs.find(g => g.id === targetGroupId);
                                showToast(`已自動吸附至「${targetGroup ? targetGroup.label : '群組'}」`);
                            } else {
                                showToast('已移出群組');
                            }
                            if (activeTab === 'properties') refreshPropertiesPanel();
                            renderDiagram();
                        } else {
                            renderDiagram();
                        }
                    }
                    saveHistory();
                } else if (isDraggingGroup) {
                    renderDiagram();
                    saveHistory();
                }

                isDraggingNode = false;
                isDraggingGroup = false;
                isDraggingCanvas = false;
                selectedGroupId = null;
                const viewport = document.getElementById('canvasViewport');
                viewport.classList.remove('cursor-grabbing', 'cursor-move');
                viewport.classList.add('cursor-grab');
                
                if (activeTab === 'code') {
                    document.getElementById('jsonEditor').value = JSON.stringify(state, null, 2);
                }
            });

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) {
                    zoomCanvas(1.1);
                } else {
                    zoomCanvas(0.9);
                }
            }, { passive: false });
        }

        function updateCanvasTransform() {
            const vpTransform = document.getElementById('viewportTransform');
            if (vpTransform) {
                vpTransform.setAttribute('transform', `translate(${panX}, ${panY}) scale(${canvasZoom})`);
            } else {
                renderDiagram();
            }
            document.getElementById('zoomLevelDisplay').innerText = Math.round(canvasZoom * 100) + '%';
        }

        let lastZoomLOD = 1.0;
        function zoomCanvas(factor) {
            const viewport = document.getElementById('canvasViewport');
            const rect = viewport.getBoundingClientRect();
            const cx = (rect.width / 2 - panX) / canvasZoom;
            const cy = (rect.height / 2 - panY) / canvasZoom;

            canvasZoom *= factor;
            if(canvasZoom < 0.2) canvasZoom = 0.2;
            if(canvasZoom > 3.0) canvasZoom = 3.0;

            panX = rect.width / 2 - cx * canvasZoom;
            panY = rect.height / 2 - cy * canvasZoom;
            
            // Check LOD threshold transition (e.g. crossing 0.65 or 1.4) to re-render fine details
            const currentLOD = canvasZoom < 0.65 ? 0.5 : (canvasZoom > 1.4 ? 2.0 : 1.0);
            if (currentLOD !== lastZoomLOD) {
                lastZoomLOD = currentLOD;
                renderDiagram();
            } else {
                updateCanvasTransform();
            }
        }

        function centerView() {
            if (state.nodes.length === 0 && state.subgraphs.length === 0) {
                canvasZoom = 1.0;
                panX = 0; panY = 0;
                updateCanvasTransform();
                return;
            }
            
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            state.nodes.forEach(n => {
                const dim = getNodeDimensions(n);
                minX = Math.min(minX, n.x);
                minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x + dim.w);
                maxY = Math.max(maxY, n.y + dim.h);
            });
            state.subgraphs.forEach(g => {
                const box = getGroupBoundingBox(g.id);
                minX = Math.min(minX, box.minX);
                minY = Math.min(minY, box.minY);
                maxX = Math.max(maxX, box.maxX);
                maxY = Math.max(maxY, box.maxY);
            });
            
            if (minX === Infinity) {
                minX = 0; minY = 0; maxX = 800; maxY = 600;
            }

            const contentW = maxX - minX;
            const contentH = maxY - minY;
            const cx = minX + contentW / 2;
            const cy = minY + contentH / 2;
            
            const viewport = document.getElementById('canvasViewport');
            const viewW = viewport.clientWidth;
            const viewH = viewport.clientHeight;
            
            canvasZoom = 1.0;
            if (contentW > viewW * 0.8 || contentH > viewH * 0.8) {
                canvasZoom = Math.min((viewW * 0.8) / contentW, (viewH * 0.8) / contentH);
            }
            
            panX = viewW / 2 - cx * canvasZoom;
            panY = viewH / 2 - cy * canvasZoom;
            updateCanvasTransform();
        }

        function getGroupDropZones(draggedNodeId) {
            const zones = {};
            state.subgraphs.forEach(g => {
                const box = getGroupBoundingBox(g.id);
                zones[g.id] = {
                    minX: box.gx,
                    minY: box.gy,
                    maxX: box.gx + box.gw,
                    maxY: box.gy + box.gh
                };
            });
            return zones;
        }

        function toggleGridBackground() {
            const vp = document.getElementById('canvasViewport');
            const btn = document.getElementById('gridToggleBtn');
            isShowGrid = !isShowGrid;
            if (isShowGrid) {
                vp.classList.add('bg-grid-pattern');
                btn.classList.add('text-blue-400');
                btn.classList.remove('text-slate-300');
            } else {
                vp.classList.remove('bg-grid-pattern');
                btn.classList.remove('text-blue-400');
                btn.classList.add('text-slate-300');
            }
        }

        function selectNode(id) {
            selectedNodeId = id;
            renderDiagram(); 
            
            if (id && activeTab !== 'properties') {
                switchSidebarTab('properties');
            } else if (id && activeTab === 'properties') {
                refreshPropertiesPanel();
            } else if (!id && activeTab === 'properties') {
                refreshPropertiesPanel();
            }
        }

        function addNodeToCenter(shape) {
            const vp = document.getElementById('canvasViewport');
            const centerPt = {
                x: (vp.clientWidth/2 - panX) / canvasZoom - NODE_W/2,
                y: (vp.clientHeight/2 - panY) / canvasZoom - NODE_H/2
            };
            
            const newId = 'n_' + Date.now().toString().slice(-4);
            const newNode = {
                id: newId,
                label: '新節點',
                sub: '',
                shape: shape,
                icon: shape === 'database' ? 'fa-database' : (shape === 'cloud' ? 'fa-cloud' : 'fa-cube'),
                group: '',
                color: '#3b82f6',
                x: Math.round(centerPt.x / 10) * 10,
                y: Math.round(centerPt.y / 10) * 10,
                showIcon: true
            };
            
            state.nodes.push(newNode);
            saveHistory();
            selectNode(newId);
            showToast('已新增組件');
        }

        function deleteSelectedNode() {
            if(!selectedNodeId) return;
            state.nodes = state.nodes.filter(n => n.id !== selectedNodeId);
            state.edges = state.edges.filter(e => e.from !== selectedNodeId && e.to !== selectedNodeId);
            selectedNodeId = null;
            
            saveHistory();
            renderDiagram();
            refreshPropertiesPanel();
            updateRelationsPanel();
            showToast('已刪除節點');
        }

        function refreshPropertiesPanel() {
            const msg = document.getElementById('noSelectionMsg');
            const editor = document.getElementById('nodePropertiesEditor');
            
            if (!selectedNodeId) {
                msg.classList.remove('hidden');
                editor.classList.add('hidden');
                return;
            }
            
            const node = state.nodes.find(n => n.id === selectedNodeId);
            if(!node) return;
            
            msg.classList.add('hidden');
            editor.classList.remove('hidden');
            
            document.getElementById('propLabel').value = node.label;
            document.getElementById('propSub').value = node.sub;
            document.getElementById('propIcon').value = node.icon;
            document.getElementById('propShowIcon').checked = node.showIcon !== false;
            document.getElementById('propColor').value = node.color;
            
            const groupSelect = document.getElementById('propGroup');
            groupSelect.innerHTML = `<option value="">(無群組 / 畫布頂層)</option>`;
            
            // Sort groups by hierarchy depth and render with tree indentation
            const sortedGroups = [...state.subgraphs].sort((a, b) => getGroupDepth(a.id) - getGroupDepth(b.id));
            sortedGroups.forEach(g => {
                const depth = getGroupDepth(g.id);
                const indent = depth > 0 ? '　'.repeat(depth) + '↳ ' : '';
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = indent + g.label;
                opt.selected = (node.group === g.id);
                groupSelect.appendChild(opt);
            });
        }

        function updateSelectedNode(key, val) {
            if(!selectedNodeId) return;
            const node = state.nodes.find(n => n.id === selectedNodeId);
            if(node) {
                node[key] = val;
                renderDiagram();
            }
        }

        // Selected Edge Index
        let selectedEdgeIdx = null;

        function selectEdge(idx) {
            selectedEdgeIdx = idx;
            selectedNodeId = null;
            if (activeTab !== 'relations') {
                switchSidebarTab('relations');
            } else {
                updateRelationsPanel();
            }
            renderDiagram();
            setTimeout(() => {
                const card = document.querySelector(`[data-relation-edge-idx="${idx}"]`);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 60);
        }

        function updateRelationsPanel() {
            const edgesContainer = document.getElementById('edgesList');
            edgesContainer.innerHTML = '';
            
            if (state.edges.length === 0) {
                edgesContainer.innerHTML = `<div class="text-xs text-slate-500 py-2">目前沒有連線。</div>`;
            }
            
            state.edges.forEach((e, idx) => {
                const isSelected = selectedEdgeIdx === idx;
                const item = document.createElement('div');
                item.setAttribute('data-relation-edge-idx', idx);
                item.className = `p-2.5 rounded-lg border transition-all space-y-2 text-xs cursor-pointer ${
                    isSelected 
                        ? 'bg-blue-950/40 border-blue-500 shadow-md ring-1 ring-blue-500/50' 
                        : 'bg-slate-900/50 border-slate-700/60 hover:border-slate-600'
                }`;
                item.onclick = (evt) => {
                    if (evt.target.tagName !== 'SELECT' && evt.target.tagName !== 'INPUT' && evt.target.tagName !== 'BUTTON' && !evt.target.closest('button')) {
                        selectEdge(idx);
                    }
                };

                let nodeOptionsFrom = '<optgroup label="節點">';
                let nodeOptionsTo = '<optgroup label="節點">';
                state.nodes.forEach(n => {
                    nodeOptionsFrom += `<option value="${n.id}" ${e.from === n.id ? 'selected' : ''}>${n.label}</option>`;
                    nodeOptionsTo += `<option value="${n.id}" ${e.to === n.id ? 'selected' : ''}>${n.label}</option>`;
                });
                nodeOptionsFrom += '</optgroup>';
                nodeOptionsTo += '</optgroup>';

                if (state.subgraphs.length > 0) {
                    nodeOptionsFrom += '<optgroup label="群組 (Group)">';
                    nodeOptionsTo += '<optgroup label="群組 (Group)">';
                    state.subgraphs.forEach(g => {
                        nodeOptionsFrom += `<option value="${g.id}" ${e.from === g.id ? 'selected' : ''}>[群組] ${g.label}</option>`;
                        nodeOptionsTo += `<option value="${g.id}" ${e.to === g.id ? 'selected' : ''}>[群組] ${g.label}</option>`;
                    });
                    nodeOptionsFrom += '</optgroup>';
                    nodeOptionsTo += '</optgroup>';
                }

                const curPos = Math.round((e.labelPos !== undefined ? e.labelPos : 0.5) * 100);
                const curType = e.type || 'bezier';
                const curArrow = e.arrow || 'end';
                const curWidth = e.width || '';

                item.innerHTML = `
                    <div class="grid grid-cols-[1fr_auto_1fr_auto] items-center gap-1.5 min-w-0">
                        <select onchange="updateEdge(${idx}, 'from', this.value); saveHistory();" class="min-w-0 w-full bg-slate-950 px-1.5 py-1.5 rounded border border-slate-700 text-slate-200 focus:outline-none truncate text-[11px]">
                            ${nodeOptionsFrom}
                        </select>
                        <i class="fa-solid fa-arrow-right text-slate-500 text-[10px] shrink-0"></i>
                        <select onchange="updateEdge(${idx}, 'to', this.value); saveHistory();" class="min-w-0 w-full bg-slate-950 px-1.5 py-1.5 rounded border border-slate-700 text-slate-200 focus:outline-none truncate text-[11px]">
                            ${nodeOptionsTo}
                        </select>
                        <button onclick="removeEdge(${idx}); event.stopPropagation();" title="刪除連線" class="text-slate-500 hover:text-red-400 p-1.5 rounded hover:bg-slate-800 shrink-0"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="grid grid-cols-[1fr_80px_65px] gap-1.5">
                        <input type="text" value="${e.label || ''}" placeholder="連線標籤 (選填)" onchange="updateEdge(${idx}, 'label', this.value); saveHistory();" class="bg-slate-950 px-2 py-1 rounded border border-slate-700 text-slate-300 min-w-0 text-[11px] focus:border-blue-500 focus:outline-none">
                        <select onchange="updateEdge(${idx}, 'type', this.value); saveHistory();" class="bg-slate-950 px-1 py-1 rounded border border-slate-700 text-slate-300 text-[11px] focus:border-blue-500 focus:outline-none">
                            <option value="bezier" ${curType === 'bezier' ? 'selected' : ''}>平滑曲線</option>
                            <option value="orthogonal" ${curType === 'orthogonal' ? 'selected' : ''}>直角折線</option>
                            <option value="straight" ${curType === 'straight' ? 'selected' : ''}>直線</option>
                        </select>
                        <select onchange="updateEdge(${idx}, 'style', this.value); saveHistory();" class="bg-slate-950 px-1 py-1 rounded border border-slate-700 text-slate-300 text-[11px] focus:border-blue-500 focus:outline-none">
                            <option value="solid" ${e.style === 'solid' ? 'selected' : ''}>實線</option>
                            <option value="dashed" ${e.style === 'dashed' ? 'selected' : ''}>虛線</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5 pt-0.5">
                        <div class="flex items-center space-x-1 bg-slate-950 px-2 py-1 rounded border border-slate-800">
                            <span class="text-[10px] text-slate-400 shrink-0"><i class="fa-solid fa-location-arrow mr-0.5"></i>箭頭:</span>
                            <select onchange="updateEdge(${idx}, 'arrow', this.value); saveHistory();" class="w-full bg-transparent text-slate-200 text-[10px] focus:outline-none cursor-pointer">
                                <option value="end" ${curArrow === 'end' ? 'selected' : ''}>單向 (→)</option>
                                <option value="both" ${curArrow === 'both' ? 'selected' : ''}>雙向 (↔)</option>
                                <option value="start" ${curArrow === 'start' ? 'selected' : ''}>反向 (←)</option>
                                <option value="none" ${curArrow === 'none' ? 'selected' : ''}>無箭頭 (-)</option>
                            </select>
                        </div>
                        <div class="flex items-center space-x-1 bg-slate-950 px-2 py-1 rounded border border-slate-800">
                            <span class="text-[10px] text-slate-400 shrink-0"><i class="fa-solid fa-ruler-horizontal mr-0.5"></i>線寬:</span>
                            <select onchange="updateEdge(${idx}, 'width', this.value); saveHistory();" class="w-full bg-transparent text-slate-200 text-[10px] focus:outline-none cursor-pointer">
                                <option value="" ${!curWidth ? 'selected' : ''}>預設</option>
                                <option value="1.5" ${curWidth === '1.5' ? 'selected' : ''}>1.5px (細)</option>
                                <option value="2.5" ${curWidth === '2.5' ? 'selected' : ''}>2.5px (標準)</option>
                                <option value="4" ${curWidth === '4' ? 'selected' : ''}>4.0px (粗)</option>
                                <option value="6" ${curWidth === '6' ? 'selected' : ''}>6.0px (特粗)</option>
                            </select>
                        </div>
                    </div>
                    ${e.label ? `
                    <div class="flex items-center space-x-2 pt-1 border-t border-slate-800/80">
                        <span class="text-[10px] text-slate-400 shrink-0"><i class="fa-solid fa-arrows-left-right mr-1"></i>標籤位置: <b id="edgePosVal_${idx}" class="text-blue-400 font-mono">${curPos}%</b></span>
                        <input type="range" min="10" max="90" value="${curPos}" oninput="updateEdge(${idx}, 'labelPos', parseInt(this.value)/100); document.getElementById('edgePosVal_${idx}').innerText=this.value+'%';" onchange="saveHistory();" class="flex-1 accent-blue-500 h-1 bg-slate-800 rounded cursor-pointer">
                    </div>
                    ` : ''}
                `;
                edgesContainer.appendChild(item);
            });

            const groupsContainer = document.getElementById('groupsList');
            groupsContainer.innerHTML = '';
            
            if(state.subgraphs.length === 0) {
                groupsContainer.innerHTML = `<div class="text-xs text-slate-500 py-2">目前沒有群組。</div>`;
            }
            
            state.subgraphs.forEach((g, idx) => {
                const item = document.createElement('div');
                item.className = 'bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/60 space-y-2 text-xs';
                
                // Parent group options (exclude self and own descendants to avoid cyclic references)
                const validParentOptions = state.subgraphs
                    .filter(other => other.id !== g.id && !isGroupDescendantOf(other.id, g.id))
                    .map(other => `<option value="${other.id}" ${g.parent === other.id ? 'selected' : ''}>↳ ${other.label}</option>`)
                    .join('');

                item.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <input type="color" value="${g.color}" onchange="updateGroup(${idx}, 'color', this.value); saveHistory();" class="w-6 h-6 rounded cursor-pointer border-0 bg-transparent p-0">
                        <input type="text" value="${g.label}" onchange="updateGroup(${idx}, 'label', this.value); saveHistory();" class="flex-1 bg-slate-950 px-2 py-1.5 rounded border border-slate-700 text-slate-200" placeholder="群組名稱">
                        <button onclick="removeGroup(${idx})" class="text-slate-500 hover:text-red-400 p-1.5"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-[11px] text-slate-400 shrink-0"><i class="fa-solid fa-folder-tree mr-1"></i>上層群組:</span>
                        <select onchange="updateGroup(${idx}, 'parent', this.value); saveHistory();" class="flex-1 bg-slate-950 px-2 py-1 rounded border border-slate-700 text-slate-300 text-[11px] focus:outline-none">
                            <option value="">(無 / 最上層群組)</option>
                            ${validParentOptions}
                        </select>
                    </div>
                `;
                groupsContainer.appendChild(item);
            });
        }

        function addEdge() {
            if (state.nodes.length < 2) {
                showToast('需要至少 2 個節點才能建立連線', 'warning');
                return;
            }
            state.edges.push({ from: state.nodes[0].id, to: state.nodes[1].id, label: '', style: 'solid', type: 'bezier', labelPos: 0.5 });
            saveHistory();
            updateRelationsPanel();
            renderDiagram();
        }

        function updateEdge(idx, key, val) {
            state.edges[idx][key] = val;
            renderDiagram();
        }
        function removeEdge(idx) {
            state.edges.splice(idx, 1);
            saveHistory();
            updateRelationsPanel();
            renderDiagram();
        }
        
        function addGroup() {
            const vp = document.getElementById('canvasViewport');
            const centerPt = {
                x: (vp.clientWidth/2 - panX) / canvasZoom,
                y: (vp.clientHeight/2 - panY) / canvasZoom
            };
            
            const newId = 'sg_' + Date.now().toString().slice(-4);
            state.subgraphs.push({ 
                id: newId, 
                label: '新群組區域', 
                color: '#10b981',
                parent: '',
                x: centerPt.x - 150,
                y: centerPt.y - 100
            });
            saveHistory();
            updateRelationsPanel();
            if(selectedNodeId) refreshPropertiesPanel();
            renderDiagram();
            showToast('已新增群組！可設定「上層群組」以進行嵌套');
        }
        function updateGroup(idx, key, val) {
            state.subgraphs[idx][key] = val;
            renderDiagram();
            updateRelationsPanel();
        }
        function removeGroup(idx) {
            const id = state.subgraphs[idx].id;
            const parentId = state.subgraphs[idx].parent || '';
            state.subgraphs.splice(idx, 1);
            state.nodes.forEach(n => { if (n.group === id) n.group = ''; });
            state.subgraphs.forEach(g => { if (g.parent === id) g.parent = parentId; });
            saveHistory();
            updateRelationsPanel();
            if(selectedNodeId) refreshPropertiesPanel();
            renderDiagram();
        }

        // --- Typography System ---
        const FONT_FAMILIES = {
            'sans': "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif",
            'mono': "'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Monaco, monospace",
            'serif': "'Times New Roman', Georgia, 'Songti TC', serif",
            'tc': "'Microsoft JhengHei', 'Noto Sans TC', PingFang, sans-serif"
        };

        function toggleTypographyAccordion() {
            const content = document.getElementById('typoAccordionContent');
            const icon = document.getElementById('typoAccordionIcon');
            const isHidden = content.classList.contains('hidden');
            if (isHidden) {
                content.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        function updateTypography(key, val) {
            if (!state.typography) {
                state.typography = {
                    fontFamily: 'sans',
                    nodeTitleSize: 14,
                    nodeSubSize: 11,
                    edgeLabelSize: 11,
                    edgeWidth: 2.5
                };
            }
            state.typography[key] = val;
            saveHistory();
            renderDiagram();
        }

        function renderNodeShape(shape, w, h, fill, border) {
            if (shape === 'pill') {
                const rx = h / 2;
                return `<rect x="0" y="0" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${border}" stroke-width="2" />`;
            } else if (shape === 'diamond') {
                return `<polygon points="${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}" fill="${fill}" stroke="${border}" stroke-width="2" />`;
            } else if (shape === 'database') {
                return `
                    <g>
                        <path d="M 0 12 C 0 0, ${w} 0, ${w} 12 L ${w} ${h-12} C ${w} ${h}, 0 ${h}, 0 ${h-12} Z" fill="${fill}" stroke="${border}" stroke-width="2" />
                        <ellipse cx="${w/2}" cy="12" rx="${w/2}" ry="8" fill="${fill}" stroke="${border}" stroke-width="2" />
                        <path d="M 0 26 C 0 34, ${w} 34, ${w} 26" fill="none" stroke="${border}" stroke-width="1.5" stroke-dasharray="3 2" />
                    </g>
                `;
            } else if (shape === 'cloud') {
                return `<rect x="0" y="0" width="${w}" height="${h}" rx="22" fill="${fill}" stroke="${border}" stroke-width="2" stroke-dasharray="6 3" />`;
            } else if (shape === 'hexagon') {
                const p = 22;
                return `<polygon points="${p},0 ${w-p},0 ${w},${h/2} ${w-p},${h} ${p},${h} 0,${h/2}" fill="${fill}" stroke="${border}" stroke-width="2" />`;
            } else {
                return `<rect x="0" y="0" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${border}" stroke-width="2" />`;
            }
        }

        // --- Node Adaptive Dimension Helpers ---
        function getNodeDimensions(n) {
            if (!n) return { w: 200, h: 72 };
            
            const label = n.label || '';
            const sub = n.sub || '';
            
            // Asian / Chinese characters ~14px, ASCII ~8.5px
            let labelW = 0;
            for (let i = 0; i < label.length; i++) {
                labelW += label.charCodeAt(i) > 255 ? 14 : 8.5;
            }
            
            let subW = 0;
            for (let i = 0; i < sub.length; i++) {
                subW += sub.charCodeAt(i) > 255 ? 11 : 7;
            }
            
            const showIcon = n.showIcon !== false;
            const paddingLeft = showIcon ? 72 : 32;
            const paddingRight = 32;
            const contentW = Math.max(labelW, subW) + paddingLeft + paddingRight;
            
            let baseW = Math.max(180, Math.ceil(contentW / 10) * 10);
            let baseH = 72;
            
            // Shape geometry compensation (inscribed safe zones)
            if (n.shape === 'diamond') {
                const maxTextW = Math.max(labelW, subW);
                if (showIcon) {
                    // With icon: vertical stacked layout, width strictly constrained by text
                    baseW = Math.max(170, Math.ceil((maxTextW + 36) / 0.75 / 10) * 10);
                    baseH = n.sub ? 88 : 80;
                } else {
                    // Without icon: text centered horizontally at y = H/2 (widest area)
                    baseW = Math.max(150, Math.ceil((maxTextW + 48) / 10) * 10);
                    baseH = n.sub ? 72 : 64;
                }
            } else if (n.shape === 'hexagon') {
                baseW = Math.max(210, baseW + 48);
            } else if (n.shape === 'pill') {
                baseW = Math.max(190, baseW + 24);
            } else if (n.shape === 'cloud') {
                baseW = Math.max(200, baseW + 24);
            } else if (n.shape === 'database') {
                baseH = 76;
            }
            
            return { w: baseW, h: baseH };
        }

        // --- Multi-edge & Multi-type Adaptive Routing Helpers ---
        function getEdgePairKey(id1, id2) {
            return id1 < id2 ? `${id1}___${id2}` : `${id2}___${id1}`;
        }

        function buildEdgePairIndexMap() {
            const pairMap = new Map();
            state.edges.forEach((e, idx) => {
                const key = getEdgePairKey(e.from, e.to);
                if (!pairMap.has(key)) pairMap.set(key, []);
                pairMap.get(key).push({ edgeIndex: idx, from: e.from, to: e.to });
            });
            
            const edgeInfoMap = new Map();
            pairMap.forEach((list, key) => {
                const total = list.length;
                list.forEach((item, i) => {
                    edgeInfoMap.set(item.edgeIndex, {
                        indexInPair: i,
                        totalInPair: total,
                        from: item.from,
                        to: item.to
                    });
                });
            });
            return edgeInfoMap;
        }

        // --- Unified Endpoint Bounds Resolver (Supports Node & Subgraph Group) ---
        function getEndpointBounds(endpoint) {
            if (!endpoint) return { cx: 0, cy: 0, w: 100, h: 50, x: 0, y: 0, label: '', isGroup: false };
            
            const id = typeof endpoint === 'string' ? endpoint : endpoint.id;
            
            // 1. Check if endpoint is a Node
            const node = state.nodes.find(n => n.id === id);
            if (node) {
                const dim = getNodeDimensions(node);
                return {
                    x: node.x,
                    y: node.y,
                    w: dim.w,
                    h: dim.h,
                    cx: node.x + dim.w / 2,
                    cy: node.y + dim.h / 2,
                    label: node.label,
                    isGroup: false
                };
            }
            
            // 2. Check if endpoint is a Group / Subgraph
            const group = state.subgraphs.find(g => g.id === id);
            if (group) {
                const box = getGroupBoundingBox(group.id);
                return {
                    x: box.gx,
                    y: box.gy,
                    w: box.gw,
                    h: box.gh,
                    cx: box.gx + box.gw / 2,
                    cy: box.gy + box.gh / 2,
                    label: group.label,
                    isGroup: true
                };
            }
            
            if (endpoint.x !== undefined && endpoint.y !== undefined) {
                const w = endpoint.w || 100, h = endpoint.h || 50;
                return {
                    x: endpoint.x,
                    y: endpoint.y,
                    w, h,
                    cx: endpoint.x + w / 2,
                    cy: endpoint.y + h / 2,
                    label: endpoint.label || '',
                    isGroup: false
                };
            }
            
            return { cx: 0, cy: 0, w: 100, h: 50, x: 0, y: 0, label: '', isGroup: false };
        }

        function computeEdgePath(ep1, ep2, pairIndex = 0, totalInPair = 1, edgeType = 'bezier', labelPos = 0.5) {
            const b1 = getEndpointBounds(ep1);
            const b2 = getEndpointBounds(ep2);
            const cx1 = b1.cx;
            const cy1 = b1.cy;
            const cx2 = b2.cx;
            const cy2 = b2.cy;
            
            const dx = cx2 - cx1;
            const dy = cy2 - cy1;
            const dist = Math.hypot(dx, dy) || 1;
            const t = Math.max(0.08, Math.min(0.92, labelPos !== undefined ? labelPos : 0.5));

            // 1. Straight Line
            if (edgeType === 'straight') {
                const d = `M ${cx1} ${cy1} L ${cx2} ${cy2}`;
                const midX = cx1 + dx * t;
                const midY = cy1 + dy * t;
                return { d, midX, midY };
            }

            // 2. Orthogonal Step Line (Right-Angle)
            if (edgeType === 'orthogonal') {
                const absDx = Math.abs(dx);
                const absDy = Math.abs(dy);
                let d = '';
                let midX = 0, midY = 0;

                if (absDx >= absDy) {
                    const midX1 = cx1 + dx / 2;
                    d = `M ${cx1} ${cy1} L ${midX1} ${cy1} L ${midX1} ${cy2} L ${cx2} ${cy2}`;
                    
                    const len1 = Math.abs(dx / 2);
                    const len2 = absDy;
                    const len3 = Math.abs(dx / 2);
                    const totalLen = len1 + len2 + len3 || 1;
                    const targetLen = totalLen * t;

                    if (targetLen <= len1) {
                        const segT = targetLen / (len1 || 1);
                        midX = cx1 + (dx / 2) * segT;
                        midY = cy1;
                    } else if (targetLen <= len1 + len2) {
                        const segT = (targetLen - len1) / (len2 || 1);
                        midX = midX1;
                        midY = cy1 + dy * segT;
                    } else {
                        const segT = (targetLen - len1 - len2) / (len3 || 1);
                        midX = midX1 + (dx / 2) * segT;
                        midY = cy2;
                    }
                } else {
                    const midY1 = cy1 + dy / 2;
                    d = `M ${cx1} ${cy1} L ${cx1} ${midY1} L ${cx2} ${midY1} L ${cx2} ${cy2}`;

                    const len1 = Math.abs(dy / 2);
                    const len2 = absDx;
                    const len3 = Math.abs(dy / 2);
                    const totalLen = len1 + len2 + len3 || 1;
                    const targetLen = totalLen * t;

                    if (targetLen <= len1) {
                        const segT = targetLen / (len1 || 1);
                        midX = cx1;
                        midY = cy1 + (dy / 2) * segT;
                    } else if (targetLen <= len1 + len2) {
                        const segT = (targetLen - len1) / (len2 || 1);
                        midX = cx1 + dx * segT;
                        midY = midY1;
                    } else {
                        const segT = (targetLen - len1 - len2) / (len3 || 1);
                        midX = cx2;
                        midY = midY1 + (dy / 2) * segT;
                    }
                }
                return { d, midX, midY };
            }

            // 3. Smooth Bezier Curve (Default)
            let cp1x, cp1y, cp2x, cp2y;

            if (totalInPair <= 1) {
                const absDx = Math.abs(dx);
                const absDy = Math.abs(dy);
                if (absDx > absDy) {
                    const controlOffset = absDx * 0.45;
                    cp1x = cx1 + (dx > 0 ? controlOffset : -controlOffset);
                    cp1y = cy1;
                    cp2x = cx2 - (dx > 0 ? controlOffset : -controlOffset);
                    cp2y = cy2;
                } else {
                    const controlOffset = absDy * 0.45;
                    cp1x = cx1;
                    cp1y = cy1 + (dy > 0 ? controlOffset : -controlOffset);
                    cp2x = cx2;
                    cp2y = cy2 - (dy > 0 ? controlOffset : -controlOffset);
                }
            } else {
                const nx = -dy / dist;
                const ny = dx / dist;
                const offsetMultiplier = (pairIndex - (totalInPair - 1) / 2);
                const curveOffset = offsetMultiplier * 50;

                cp1x = cx1 + dx * 0.25 + nx * curveOffset;
                cp1y = cy1 + dy * 0.25 + ny * curveOffset;
                cp2x = cx1 + dx * 0.75 + nx * curveOffset;
                cp2y = cy1 + dy * 0.75 + ny * curveOffset;
            }

            const d = `M ${cx1} ${cy1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${cx2} ${cy2}`;

            // Cubic Bezier parameter evaluation at t
            const omt = 1 - t;
            const omt2 = omt * omt;
            const omt3 = omt2 * omt;
            const t2 = t * t;
            const t3 = t2 * t;

            const midX = omt3 * cx1 + 3 * omt2 * t * cp1x + 3 * omt * t2 * cp2x + t3 * cx2;
            const midY = omt3 * cy1 + 3 * omt2 * t * cp1y + 3 * omt * t2 * cp2y + t3 * cy2;

            return { d, midX, midY };
        }

        // --- Hierarchy and Bounding Box Calculations for Groups ---
        function getGroupDepth(gid, visited = new Set()) {
            if (visited.has(gid)) return 0;
            visited.add(gid);
            const g = state.subgraphs.find(x => x.id === gid);
            if (!g || !g.parent) return 0;
            return 1 + getGroupDepth(g.parent, visited);
        }

        function getGroupBoundingBox(gid, visited = new Set()) {
            if (visited.has(gid)) return { gx: 100, gy: 100, gw: 300, gh: 200, minX: 100, minY: 100, maxX: 400, maxY: 300, isEmpty: true };
            visited.add(gid);
            const g = state.subgraphs.find(x => x.id === gid);
            if (!g) return { gx: 100, gy: 100, gw: 300, gh: 200, minX: 100, minY: 100, maxX: 400, maxY: 300, isEmpty: true };

            const directNodes = state.nodes.filter(n => n.group === gid);
            const childGroups = state.subgraphs.filter(cg => cg.parent === gid);

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            directNodes.forEach(n => {
                const dim = getNodeDimensions(n);
                minX = Math.min(minX, n.x);
                minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x + dim.w);
                maxY = Math.max(maxY, n.y + dim.h);
            });

            childGroups.forEach(cg => {
                const cBox = getGroupBoundingBox(cg.id, new Set(visited));
                minX = Math.min(minX, cBox.minX);
                minY = Math.min(minY, cBox.minY);
                maxX = Math.max(maxX, cBox.maxX);
                maxY = Math.max(maxY, cBox.maxY);
            });

            const pad = 24; const topPad = 40;
            if (minX === Infinity) {
                const gx = (g.x !== undefined ? g.x : 100) - pad;
                const gy = (g.y !== undefined ? g.y : 100) - topPad;
                return {
                    gx, gy, gw: 300, gh: 200,
                    minX: gx, minY: gy, maxX: gx + 300, maxY: gy + 200,
                    isEmpty: true
                };
            }

            const gx = minX - pad;
            const gy = minY - topPad;
            const gw = (maxX - minX) + pad * 2;
            const gh = (maxY - minY) + pad + topPad;
            g.x = gx + pad;
            g.y = gy + topPad;
            return { gx, gy, gw, gh, minX: gx, minY: gy, maxX: gx + gw, maxY: gy + gh, isEmpty: false };
        }

        function renderDiagram() {
            const theme = THEMES[state.theme] || THEMES.academic;
            const typo = state.typography || {
                fontFamily: 'sans',
                nodeTitleSize: 14,
                nodeSubSize: 11,
                edgeLabelSize: 11,
                edgeWidth: 2.5
            };
            const activeFont = FONT_FAMILIES[typo.fontFamily] || FONT_FAMILIES.sans;

            // Dynamic Level of Detail (LOD) based on zoom scale
            const isFarZoom = canvasZoom < 0.65;
            const isNearZoom = canvasZoom > 1.4;
            
            let shadowDy = 4, shadowStdDev = 6, shadowOpacity = 0.35;
            if (isFarZoom) {
                shadowDy = 2; shadowStdDev = 3; shadowOpacity = 0.25;
            } else if (isNearZoom) {
                shadowDy = 6; shadowStdDev = 9; shadowOpacity = 0.45;
            }

            const baseEdgeWidth = typo.edgeWidth || 2.5;
            const effectiveEdgeWidth = isFarZoom ? (baseEdgeWidth + 0.8) : baseEdgeWidth;
            
            // Build lookup maps for O(1) queries
            const nodeMap = new Map();
            state.nodes.forEach(n => nodeMap.set(n.id, n));

            let svgHtml = `
                <svg id="workflowSvg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="overflow: visible; display:block; font-family: ${activeFont};" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
                    <defs>
                        <!-- End Arrowhead -->
                        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1 L 10 5 L 0 9 z" fill="${theme.edgeColor}" />
                        </marker>
                        <!-- Start Arrowhead -->
                        <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 10 1 L 0 5 L 10 9 z" fill="${theme.edgeColor}" />
                        </marker>
                        <!-- Selected End Arrowhead -->
                        <marker id="arrow-selected" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
                        </marker>
                        <!-- Selected Start Arrowhead -->
                        <marker id="arrow-selected-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 10 1 L 0 5 L 10 9 z" fill="#60a5fa" />
                        </marker>
                        <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
                            <feDropShadow dx="0" dy="${shadowDy}" stdDeviation="${shadowStdDev}" flood-color="${theme.shadow}" flood-opacity="${shadowOpacity}" />
                        </filter>
                    </defs>
                    <rect width="100%" height="100%" fill="transparent" id="exportBg" />
                    <!-- Native SVG Vector Viewport Transform Container (Zero Blur Scaling) -->
                    <g id="viewportTransform" transform="translate(${panX}, ${panY}) scale(${canvasZoom})">
                        <g id="groupsLayer">
            `;

            // Sort subgraphs by hierarchy depth: root groups first (background), nested groups after (foreground)
            const sortedGroups = [...state.subgraphs].sort((a, b) => getGroupDepth(a.id) - getGroupDepth(b.id));

            sortedGroups.forEach(g => {
                const box = getGroupBoundingBox(g.id);
                const gColor = g.color || theme.groupBorder;
                
                svgHtml += `
                    <g data-group-id="${g.id}" class="group-container" transform="translate(${box.gx}, ${box.gy})">
                        <rect class="group-rect" width="${box.gw}" height="${box.gh}" rx="16" fill="${theme.groupBg}" stroke="${gColor}" stroke-width="1.5" stroke-dasharray="5 4" />
                        <!-- Group Draggable Header Bar -->
                        <rect class="group-header" x="0" y="0" width="${box.gw}" height="32" rx="16" fill="${gColor}" fill-opacity="0.12" style="cursor: move;" />
                        <text class="group-title" x="16" y="21" fill="${gColor}" font-size="12" font-weight="700" letter-spacing="0.5" style="cursor: move; user-select: none;">${g.label}</text>
                        ${box.isEmpty ? `<text class="group-empty-hint" x="${box.gw/2}" y="${box.gh/2}" fill="${theme.textSub}" font-size="12" font-weight="500" text-anchor="middle" opacity="0.6">空群組：可拖曳移動或指派節點/子群組</text>` : ''}
                    </g>
                `;
            });

            svgHtml += `</g><g id="edgesLayer">`;

            // Multi-edge pair index map for adaptive routing
            const edgePairInfoMap = buildEdgePairIndexMap();

            state.edges.forEach((e, idx) => {
                const epA = getEndpointBounds(e.from);
                const epB = getEndpointBounds(e.to);
                
                if (epA && epB) {
                    const edgeInfo = edgePairInfoMap.get(idx) || { indexInPair: 0, totalInPair: 1 };
                    const pathData = computeEdgePath(epA, epB, edgeInfo.indexInPair, edgeInfo.totalInPair, e.type, e.labelPos);
                    const strokeDash = e.style === 'dashed' ? 'stroke-dasharray="6 6"' : '';
                    const isEdgeSelected = selectedEdgeIdx === idx;
                    const strokeColor = isEdgeSelected ? '#60a5fa' : theme.edgeColor;
                    const strokeWidth = e.width ? parseFloat(e.width) : effectiveEdgeWidth;

                    const markerEndId = isEdgeSelected ? 'url(#arrow-selected)' : 'url(#arrow)';
                    const markerStartId = isEdgeSelected ? 'url(#arrow-selected-start)' : 'url(#arrow-start)';
                    const arrowMode = e.arrow || 'end';

                    let markerAttrs = '';
                    if (arrowMode === 'both') {
                        markerAttrs = `marker-start="${markerStartId}" marker-end="${markerEndId}"`;
                    } else if (arrowMode === 'start') {
                        markerAttrs = `marker-start="${markerStartId}"`;
                    } else if (arrowMode === 'none') {
                        markerAttrs = '';
                    } else {
                        markerAttrs = `marker-end="${markerEndId}"`;
                    }

                    svgHtml += `
                        <g data-edge-idx="${idx}" data-from="${e.from}" data-to="${e.to}" class="edge-group ${isEdgeSelected ? 'edge-selected' : ''}">
                            ${isEdgeSelected ? `<path d="${pathData.d}" fill="none" stroke="#3b82f6" stroke-width="${strokeWidth + 4}" opacity="0.4" stroke-linecap="round" />` : ''}
                            <path class="edge-path" d="${pathData.d}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${strokeDash} ${markerAttrs} />
                            <!-- Hit area for easy clicking & selection -->
                            <path class="edge-hitbox" onclick="selectEdge(${idx}); event.stopPropagation();" d="${pathData.d}" fill="none" stroke="transparent" stroke-width="18" style="cursor: pointer;" />
                    `;

                    if (e.label) {
                        const labelLen = e.label.length;
                        const boxW = Math.max(50, labelLen * 9 + 16);
                        svgHtml += `
                            <rect class="edge-label-bg" onclick="selectEdge(${idx}); event.stopPropagation();" x="${pathData.midX - boxW/2}" y="${pathData.midY - 12}" width="${boxW}" height="24" rx="6" fill="${theme.bg}" stroke="${isEdgeSelected ? '#3b82f6' : theme.nodeBorder}" stroke-width="${isEdgeSelected ? 1.5 : 1}" opacity="0.95" style="cursor: pointer;" />
                            <text class="edge-label-text" onclick="selectEdge(${idx}); event.stopPropagation();" x="${pathData.midX}" y="${pathData.midY + 4}" fill="${isEdgeSelected ? '#60a5fa' : theme.edgeText}" font-size="${typo.edgeLabelSize || 11}" font-weight="600" text-anchor="middle" style="cursor: pointer; user-select: none;">${e.label}</text>
                        `;
                    }
                    svgHtml += `</g>`;
                }
            });

            svgHtml += `</g><g id="nodesLayer">`;

            state.nodes.forEach(n => {
                const dim = getNodeDimensions(n);
                const w = dim.w;
                const h = dim.h;
                const nodeBorder = n.color || theme.nodeBorder;
                const isSelected = selectedNodeId === n.id;
                const selectedClass = isSelected ? 'node-selected' : '';
                const iconColor = n.color || '#3b82f6';
                
                let iconPath = SVG_ICONS['default'];
                if (n.icon) {
                    const iconKey = n.icon.startsWith('fa-') ? n.icon : 'fa-' + n.icon;
                    if (SVG_ICONS[iconKey]) iconPath = SVG_ICONS[iconKey];
                }

                const nodeShowIcon = n.showIcon !== false;
                let textStartX = 24;
                let textAnchor = 'start';
                let iconHtml = '';
                let mainTextY = n.sub ? Math.round(h / 2 - 2) : Math.round(h / 2 + 5);
                let subTextY = Math.round(h / 2 + 15);

                // Specific placement based on shape to ensure 100% containment
                if (n.shape === 'diamond') {
                    if (nodeShowIcon) {
                        const iconX = Math.round(w / 2 - 16);
                        const iconY = 12;
                        iconHtml = `
                            <rect x="${iconX}" y="${iconY}" width="32" height="32" rx="8" fill="${iconColor}20" />
                            <svg x="${iconX + 5}" y="${iconY + 5}" width="22" height="22" viewBox="0 0 24 24" fill="${iconColor}">
                                <path d="${iconPath}" />
                            </svg>
                        `;
                        textStartX = Math.round(w / 2);
                        textAnchor = 'middle';
                        mainTextY = 56;
                        subTextY = 70;
                    } else {
                        textStartX = Math.round(w / 2);
                        textAnchor = 'middle';
                        mainTextY = n.sub ? Math.round(h / 2 - 3) : Math.round(h / 2 + 5);
                        subTextY = Math.round(h / 2 + 14);
                    }
                } else if (n.shape === 'hexagon') {
                    const iconY = Math.round(h / 2 - 18);
                    iconHtml = nodeShowIcon ? `
                        <rect x="24" y="${iconY}" width="36" height="36" rx="8" fill="${iconColor}20" />
                        <svg x="30" y="${iconY + 6}" width="24" height="24" viewBox="0 0 24 24" fill="${iconColor}">
                            <path d="${iconPath}" />
                        </svg>
                    ` : '';
                    textStartX = nodeShowIcon ? 72 : 32;
                } else if (n.shape === 'database') {
                    const iconY = Math.round(h / 2 - 13);
                    iconHtml = nodeShowIcon ? `
                        <rect x="16" y="${iconY}" width="36" height="36" rx="8" fill="${iconColor}20" />
                        <svg x="22" y="${iconY + 6}" width="24" height="24" viewBox="0 0 24 24" fill="${iconColor}">
                            <path d="${iconPath}" />
                        </svg>
                    ` : '';
                    textStartX = nodeShowIcon ? 66 : 24;
                    mainTextY = n.sub ? Math.round(h / 2 + 3) : Math.round(h / 2 + 8);
                    subTextY = Math.round(h / 2 + 18);
                } else if (n.shape === 'pill') {
                    const iconY = Math.round(h / 2 - 18);
                    iconHtml = nodeShowIcon ? `
                        <rect x="20" y="${iconY}" width="36" height="36" rx="8" fill="${iconColor}20" />
                        <svg x="26" y="${iconY + 6}" width="24" height="24" viewBox="0 0 24 24" fill="${iconColor}">
                            <path d="${iconPath}" />
                        </svg>
                    ` : '';
                    textStartX = nodeShowIcon ? 68 : 28;
                } else {
                    const iconY = Math.round(h / 2 - 18);
                    iconHtml = nodeShowIcon ? `
                        <rect x="16" y="${iconY}" width="36" height="36" rx="8" fill="${iconColor}20" />
                        <svg x="22" y="${iconY + 6}" width="24" height="24" viewBox="0 0 24 24" fill="${iconColor}">
                            <path d="${iconPath}" />
                        </svg>
                    ` : '';
                    textStartX = nodeShowIcon ? 66 : 24;
                }

                svgHtml += `
                    <g transform="translate(${n.x}, ${n.y})" class="node-group ${selectedClass}" data-id="${n.id}" filter="url(#dropShadow)" style="cursor: move;">
                        ${renderNodeShape(n.shape, w, h, theme.nodeBg, nodeBorder)}
                        ${iconHtml}
                        <text x="${textStartX}" y="${mainTextY}" text-anchor="${textAnchor}" font-size="${typo.nodeTitleSize || 14}" font-weight="bold" fill="${theme.text}">${n.label}</text>
                        ${n.sub ? `<text x="${textStartX}" y="${subTextY}" text-anchor="${textAnchor}" font-size="${typo.nodeSubSize || 11}" font-weight="normal" fill="${theme.textSub}">${n.sub}</text>` : ''}
                    </g>
                `;
            });

            svgHtml += `</g></g></svg>`;

            const container = document.getElementById('svgContainer');
            container.innerHTML = svgHtml;
        }

        function loadPreset(key) {
            if (PRESETS[key]) {
                state = JSON.parse(JSON.stringify(PRESETS[key]));
                document.getElementById('themeSelect').value = state.theme;
                selectNode(null);
                selectedEdgeIdx = null;
                saveHistory();
                renderDiagram();
                updateRelationsPanel();
                centerView();
                showToast('已載入範本');
            }
        }

        function changeTheme(themeKey) {
            state.theme = themeKey;
            saveHistory();
            renderDiagram();
            showToast('主題切換成功');
        }

        function applyJsonCode() {
            try {
                state = JSON.parse(document.getElementById('jsonEditor').value);
                selectNode(null);
                selectedEdgeIdx = null;
                saveHistory();
                renderDiagram();
                updateRelationsPanel();
                showToast('JSON 規格更新成功！');
            } catch (err) {
                showToast('JSON 格式錯誤：' + err.message, 'error');
            }
        }

        function copySVGCode() {
            const svgEl = document.getElementById('workflowSvg');
            if (!svgEl) return;
            const svgCode = svgEl.outerHTML.replace('<rect width="100%" height="100%" fill="transparent" id="exportBg" />', '');
            
            navigator.clipboard.writeText(svgCode).then(() => {
                showToast('SVG 碼已複製到剪貼簿！');
            }).catch(() => {
                const temp = document.createElement('textarea');
                temp.value = svgCode;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                showToast('SVG 碼已複製到剪貼簿！');
            });
        }

        function openExportModal() {
            const modal = document.getElementById('exportModal');
            const content = document.getElementById('exportModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeExportModal() {
            const modal = document.getElementById('exportModal');
            const content = document.getElementById('exportModalContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function setExportFmt(fmt) {
            selectedExportFormat = fmt;
            const btnPng = document.getElementById('expFmtPng');
            const btnSvg = document.getElementById('expFmtSvg');
            const scaleSec = document.getElementById('pngScaleSection');
            
            if (fmt === 'png') {
                btnPng.className = "flex-1 py-2 rounded border border-blue-500 bg-blue-500/10 text-blue-400 text-xs font-bold transition";
                btnSvg.className = "flex-1 py-2 rounded border border-slate-600 bg-slate-900 text-slate-300 hover:bg-slate-700 text-xs font-bold transition";
                if (scaleSec) scaleSec.style.display = 'block';
            } else {
                btnSvg.className = "flex-1 py-2 rounded border border-blue-500 bg-blue-500/10 text-blue-400 text-xs font-bold transition";
                btnPng.className = "flex-1 py-2 rounded border border-slate-600 bg-slate-900 text-slate-300 hover:bg-slate-700 text-xs font-bold transition";
                if (scaleSec) scaleSec.style.display = 'none';
            }
        }

        function confirmExport() {
            const area = document.querySelector('input[name="expArea"]:checked').value;
            const bg = document.getElementById('expBg').value;
            closeExportModal();
            executeExport(selectedExportFormat, area, bg);
        }

        function executeExport(format, area, bgSetting) {
            const originalSvg = document.getElementById('workflowSvg');
            if (!originalSvg) return;

            const oldSelectedId = selectedNodeId;
            const oldSelectedEdge = selectedEdgeIdx;
            if (oldSelectedId || oldSelectedEdge !== null) {
                selectedNodeId = null;
                selectedEdgeIdx = null;
                renderDiagram(); 
            }

            setTimeout(() => {
                const svgToExport = document.getElementById('workflowSvg').cloneNode(true);
                const theme = THEMES[state.theme] || THEMES.academic;
                const bgColor = bgSetting === 'theme' ? theme.bg : 'transparent';
                
                const bgRect = svgToExport.querySelector('#exportBg');
                if (bgRect) bgRect.setAttribute('fill', bgColor);

                let exportW, exportH, viewBoxStr;
                if (area === 'autofit') {
                    const bbox = getNodesBoundingBox();
                    const pad = 50;
                    exportW = bbox.w + pad * 2;
                    exportH = bbox.h + pad * 2;
                    viewBoxStr = `${bbox.x - pad} ${bbox.y - pad} ${exportW} ${exportH}`;
                } else if (area === 'custom' && customExportBox) {
                    exportW = customExportBox.w;
                    exportH = customExportBox.h;
                    viewBoxStr = `${customExportBox.x} ${customExportBox.y} ${exportW} ${exportH}`;
                } else {
                    const vp = document.getElementById('canvasViewport');
                    exportW = vp.clientWidth / canvasZoom;
                    exportH = vp.clientHeight / canvasZoom;
                    viewBoxStr = `${-panX/canvasZoom} ${-panY/canvasZoom} ${exportW} ${exportH}`;
                }

                const vpGroup = svgToExport.querySelector('#viewportTransform');
                if (vpGroup) vpGroup.removeAttribute('transform');

                svgToExport.setAttribute('viewBox', viewBoxStr);
                svgToExport.setAttribute('width', exportW);
                svgToExport.setAttribute('height', exportH);
                svgToExport.setAttribute('xmlns', "http://www.w3.org/2000/svg");

                const svgData = new XMLSerializer().serializeToString(svgToExport);

                if (format === 'svg') {
                    const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `workflow-${Date.now()}.svg`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('向量 SVG 下載完成！');
                    restoreSelection();
                } 
                else if (format === 'png') {
                    const scaleFactor = parseInt(document.getElementById('expScale')?.value || '3');
                    showToast(`正在生成 ${scaleFactor}x 超高解析度 PNG...`, 'success');
                    
                    const canvas = document.getElementById('exportCanvas');
                    canvas.width = exportW * scaleFactor; 
                    canvas.height = exportH * scaleFactor;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    
                    if (bgColor !== 'transparent') {
                        ctx.fillStyle = bgColor;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(svgBlob);
                    
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = function() {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        URL.revokeObjectURL(url);
                        try {
                            const pngDataUrl = canvas.toDataURL('image/png');
                            const a = document.createElement('a');
                            a.href = pngDataUrl;
                            a.download = `workflow-${scaleFactor}x-${Date.now()}.png`;
                            a.click();
                            showToast(`${scaleFactor}x 高解析度 PNG 匯出完成！`);
                        } catch (err) {
                            showToast('PNG 轉換發生問題，請嘗試下載 SVG', 'error');
                        }
                        restoreSelection();
                    };
                    img.onerror = function() {
                        showToast('圖像渲染失敗，請改用 SVG 格式下載', 'error');
                        restoreSelection();
                    };
                    img.src = url;
                }
            }, 50);

            function restoreSelection() {
                if (oldSelectedId || oldSelectedEdge !== null) {
                    selectedNodeId = oldSelectedId;
                    selectedEdgeIdx = oldSelectedEdge;
                    renderDiagram();
                }
            }
        }

        function getNodesBoundingBox() {
            if (state.nodes.length === 0 && state.subgraphs.length === 0) return { x: 0, y: 0, w: 800, h: 600 };
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            state.nodes.forEach(n => {
                const dim = getNodeDimensions(n);
                minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x + dim.w); maxY = Math.max(maxY, n.y + dim.h);
            });
            state.subgraphs.forEach(g => {
                const box = getGroupBoundingBox(g.id);
                minX = Math.min(minX, box.minX);
                minY = Math.min(minY, box.minY);
                maxX = Math.max(maxX, box.maxX);
                maxY = Math.max(maxY, box.maxY);
            });
            if (minX === Infinity) { minX = 0; minY = 0; maxX = 800; maxY = 600; }
            return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            toastIcon.className = type === 'error' ? 'fa-solid fa-circle-xmark text-red-400' : 
                                  type === 'warning' ? 'fa-solid fa-triangle-exclamation text-amber-400' : 
                                  'fa-solid fa-circle-check text-emerald-400';

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
