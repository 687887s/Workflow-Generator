<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Figure SVG Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI & Node icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: { 50: '#f0f7ff', 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }
        .bg-grid-pattern {
            background-size: 24px 24px;
            background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
        }
        .dark .bg-grid-pattern {
            background-image: radial-gradient(circle, #334155 1px, transparent 1px);
        }
        .canvas-container {
            user-select: none;
            will-change: transform;
            transform-origin: 0 0;
        }
        /* SVG Node transition for smooth selection ring */
        .node-group { transition: filter 0.2s; }
        .node-selected rect, .node-selected polygon, .node-selected path, .node-selected ellipse {
            stroke: #3b82f6 !important;
            stroke-width: 3px !important;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6));
        }
        .group-container { transition: all 0.2s ease-out; }
        .group-selected .group-rect {
            stroke: #3b82f6 !important;
            stroke-width: 2.5px !important;
            filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.5));
        }
        .group-collapsed:hover .group-rect {
            stroke-width: 2.5px;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.4));
        }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col overflow-hidden">

    <!-- Navigation / Header Bar -->
    <header class="h-16 bg-slate-800 border-b border-slate-700/80 px-4 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-blue-600 rounded-lg text-white shadow-lg shadow-blue-500/20 flex items-center justify-center">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 13h-4V9h4v4zm-6-2h-2V7h2v4zm-4 4H5v-4h4v4zm-4-8H1V3h4v4zm14 12h-4v-4h4v4zm-6-2h-2v-4h2v4z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-base font-bold text-white leading-tight">Workflow Figure Builder</h1>
                <p class="text-xs text-slate-400">畫布拖拉式結構編輯器 <span class="hidden md:inline-block ml-2 px-1.5 py-0.5 rounded bg-slate-700/60 text-[10px] text-slate-300"><i class="fa-solid fa-keyboard mr-1 text-blue-400"></i>[Ctrl+C/V] 複製貼上 | [X] 交換順序 | [雙擊/按鈕] 收折容器</span></p>
            </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="flex items-center space-x-3">
            <!-- Undo / Redo Buttons -->
            <div class="flex items-center bg-slate-900/60 rounded-lg border border-slate-700 p-0.5 mr-2">
                <button id="btnUndo" onclick="undo()" class="px-2.5 py-1.5 rounded-md text-slate-500 transition opacity-50 cursor-not-allowed flex items-center justify-center" title="復原 (Ctrl+Z)">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
                    </svg>
                </button>
                <div class="h-4 w-[1px] bg-slate-700 mx-0.5"></div>
                <button id="btnRedo" onclick="redo()" class="px-2.5 py-1.5 rounded-md text-slate-500 transition opacity-50 cursor-not-allowed flex items-center justify-center" title="重做 (Ctrl+Y)">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.4 10.6C16.55 9 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/>
                    </svg>
                </button>
            </div>

            <!-- Mode Switch -->
            <div class="flex items-center bg-slate-900/60 rounded-lg border border-slate-700 p-0.5 mr-2">
                <button id="modeDrag" onclick="setMode('drag')" class="px-3 py-1.5 rounded-md bg-blue-600 text-white text-xs font-bold transition shadow-sm">拖曳編輯</button>
                <button id="modeSelect" onclick="setMode('select')" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white text-xs font-bold transition">框選匯出</button>
            </div>

            <div class="flex items-center space-x-1.5 bg-slate-900/60 p-1 rounded-lg border border-slate-700">
                <span class="text-xs text-slate-400 pl-2 font-medium">範本:</span>
                <select id="presetSelect" onchange="loadPreset(this.value)" class="bg-slate-800 text-xs text-slate-200 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer border border-slate-700">
                    <option value="aiml">AI / ML 管線流程</option>
                    <option value="microservices">微服務架構</option>
                    <option value="blank">空白畫布</option>
                </select>
            </div>

            <div class="flex items-center space-x-1.5 bg-slate-900/60 p-1 rounded-lg border border-slate-700">
                <span class="text-xs text-slate-400 pl-2 font-medium">主題:</span>
                <select id="themeSelect" onchange="changeTheme(this.value)" class="bg-slate-800 text-xs text-slate-200 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer border border-slate-700">
                    <option value="academic">Academic Clean (學術)</option>
                    <option value="tech">Tech Dark (科技)</option>
                    <option value="pastel">Pastel Modern (粉彩)</option>
                    <option value="vibrant">Vibrant Flow (鮮明)</option>
                </select>
            </div>

            <div class="h-6 w-[1px] bg-slate-700 mx-1"></div>

            <div class="flex items-center space-x-2">
                <button onclick="copySVGCode()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 shadow-sm">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                    </svg>
                    <span>複製代碼</span>
                </button>
                <button onclick="openExportModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow-lg shadow-emerald-500/20">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM10 10v4H7l5 5 5-5h-3v-4h-4z"/>
                    </svg>
                    <span>匯出圖表...</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex overflow-hidden relative">
        <!-- Sidebar Controls -->
        <aside class="w-80 bg-slate-800/95 border-r border-slate-700/80 flex flex-col shrink-0 z-20 shadow-xl">
            <!-- Sidebar Tabs -->
            <div class="flex border-b border-slate-700 bg-slate-900/60">
                <button onclick="switchSidebarTab('modules')" id="tab-modules" class="flex-1 py-3 text-xs font-semibold text-blue-400 border-b-2 border-blue-500 transition flex items-center justify-center space-x-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l-5.5 9h11z M17.5 13a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z M3 13.5h8v8H3z"/>
                    </svg>
                    <span>組件庫</span>
                </button>
                <button onclick="switchSidebarTab('properties')" id="tab-properties" class="flex-1 py-3 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition flex items-center justify-center space-x-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
                    </svg>
                    <span>屬性</span>
                </button>
                <button onclick="switchSidebarTab('relations')" id="tab-relations" class="flex-1 py-3 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition flex items-center justify-center space-x-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
                    </svg>
                    <span>關聯</span>
                </button>
                <button onclick="switchSidebarTab('code')" id="tab-code" class="flex-1 py-3 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition flex items-center justify-center space-x-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
                    </svg>
                    <span>數據</span>
                </button>
            </div>

            <!-- Content: Modules (Add Nodes) -->
            <div id="panel-modules" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="text-xs text-slate-400 mb-2">點擊以新增模塊到畫布中央</div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="addNodeToCenter('rect')" class="bg-slate-900 border border-slate-700 hover:border-blue-500 rounded-lg p-3 flex flex-col items-center justify-center space-y-2 transition group">
                        <div class="w-12 h-8 border-2 border-slate-500 rounded group-hover:border-blue-400"></div>
                        <span class="text-xs text-slate-300">一般矩形</span>
                    </button>
                    <button onclick="addNodeToCenter('pill')" class="bg-slate-900 border border-slate-700 hover:border-blue-500 rounded-lg p-3 flex flex-col items-center justify-center space-y-2 transition group">
                        <div class="w-12 h-8 border-2 border-slate-500 rounded-full group-hover:border-blue-400"></div>
                        <span class="text-xs text-slate-300">膠囊節點</span>
                    </button>
                    <button onclick="addNodeToCenter('database')" class="bg-slate-900 border border-slate-700 hover:border-blue-500 rounded-lg p-3 flex flex-col items-center justify-center space-y-2 transition group">
                        <i class="fa-solid fa-database text-2xl text-slate-500 group-hover:text-blue-400"></i>
                        <span class="text-xs text-slate-300">資料庫</span>
                    </button>
                    <button onclick="addNodeToCenter('cloud')" class="bg-slate-900 border border-slate-700 hover:border-blue-500 rounded-lg p-3 flex flex-col items-center justify-center space-y-2 transition group">
                        <i class="fa-solid fa-cloud text-2xl text-slate-500 group-hover:text-blue-400"></i>
                        <span class="text-xs text-slate-300">雲端服務</span>
                    </button>
                    <button onclick="addNodeToCenter('diamond')" class="bg-slate-900 border border-slate-700 hover:border-blue-500 rounded-lg p-3 flex flex-col items-center justify-center space-y-2 transition group">
                        <div class="w-8 h-8 border-2 border-slate-500 rotate-45 group-hover:border-blue-400"></div>
                        <span class="text-xs text-slate-300">決策菱形</span>
                    </button>
                    <button onclick="addNodeToCenter('hexagon')" class="bg-slate-900 border border-slate-700 hover:border-blue-500 rounded-lg p-3 flex flex-col items-center justify-center space-y-2 transition group">
                        <i class="fa-regular fa-circle-stop text-2xl text-slate-500 group-hover:text-blue-400"></i>
                        <span class="text-xs text-slate-300">六角節點</span>
                    </button>
                </div>
                
                <div class="pt-4 border-t border-slate-700 mt-4">
                    <div class="text-xs text-slate-400 mb-2">背景群組 (泳道)</div>
                    <button onclick="addGroup()" class="w-full bg-slate-900 border border-slate-700 hover:border-emerald-500 rounded-lg p-3 flex items-center justify-center space-x-2 transition text-slate-300 group">
                        <i class="fa-solid fa-layer-group text-slate-500 group-hover:text-emerald-400"></i>
                        <span class="text-xs">新增群組包圍盒</span>
                    </button>
                </div>
            </div>

            <!-- Content: Properties (Edit selected node) -->
            <div id="panel-properties" class="flex-1 overflow-y-auto p-4 hidden flex-col">
                <div id="noSelectionMsg" class="flex-1 flex items-center justify-center text-slate-500 text-xs text-center px-4">
                    請在畫布上點選任何節點，<br>即可在此處編輯其屬性。
                </div>
                
                <div id="nodePropertiesEditor" class="hidden space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-blue-400"><i class="fa-solid fa-cube mr-1"></i>編輯節點</span>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="copySelectedNode()" class="text-blue-400 hover:text-blue-300 text-xs flex items-center px-2 py-1 bg-blue-400/10 rounded transition" title="複製此節點 (Ctrl+C)">
                                <i class="fa-regular fa-copy mr-1"></i>複製
                            </button>
                            <button onclick="deleteSelectedNode()" class="text-red-400 hover:text-red-300 text-xs flex items-center px-2 py-1 bg-red-400/10 rounded transition" title="刪除此節點 (Delete)">
                                <i class="fa-solid fa-trash mr-1"></i>刪除
                            </button>
                        </div>
                    </div>

                    <div class="space-y-3 bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">主標題 (Label)</label>
                            <!-- Changed oninput to onchange to avoid undo spam -->
                            <input type="text" id="propLabel" onchange="updateSelectedNode('label', this.value); saveHistory();" class="w-full bg-slate-950 px-2.5 py-1.5 rounded border border-slate-700 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">副標題 (Sub)</label>
                            <input type="text" id="propSub" onchange="updateSelectedNode('sub', this.value); saveHistory();" class="w-full bg-slate-950 px-2.5 py-1.5 rounded border border-slate-700 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <label class="text-[11px] text-slate-400 block">圖示 (Icon)</label>
                                <!-- Icon Toggle Checkbox for individual node -->
                                <label class="text-[10px] text-slate-400 flex items-center cursor-pointer hover:text-white transition">
                                    <input type="checkbox" id="propShowIcon" onchange="updateSelectedNode('showIcon', this.checked); saveHistory();" class="mr-1 cursor-pointer">顯示
                                </label>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button type="button" onclick="openIconPicker()" class="flex-1 bg-slate-950 hover:bg-slate-900 border border-slate-700 hover:border-blue-500 px-3 py-2 rounded-lg flex items-center justify-between text-slate-200 transition group cursor-pointer shadow-sm">
                                    <div class="flex items-center space-x-2">
                                        <div id="propIconPreview" class="w-6 h-6 rounded bg-blue-500/20 text-blue-400 flex items-center justify-center text-xs">
                                            <i class="fa-solid fa-brain"></i>
                                        </div>
                                        <span id="propIconName" class="text-xs font-mono text-slate-300">fa-brain</span>
                                    </div>
                                    <span class="text-[11px] font-medium text-blue-400 group-hover:text-blue-300 flex items-center"><i class="fa-solid fa-shapes mr-1"></i>更換圖示</span>
                                </button>
                                <input type="hidden" id="propIcon" value="fa-brain">
                            </div>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">主題色 (Color)</label>
                            <div class="flex items-center space-x-2">
                                <input type="color" id="propColor" onchange="updateSelectedNode('color', this.value); saveHistory();" class="w-8 h-8 rounded cursor-pointer border border-slate-700 bg-transparent p-0">
                                <button onclick="document.getElementById('propColor').value='#3b82f6'; updateSelectedNode('color', '#3b82f6'); saveHistory();" class="text-[10px] text-slate-400 hover:text-white">重置</button>
                            </div>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">所屬群組 (Group)</label>
                            <select id="propGroup" onchange="updateSelectedNode('group', this.value); saveHistory();" class="w-full bg-slate-950 px-2.5 py-1.5 rounded border border-slate-700 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
                                <!-- Options filled dynamically -->
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content: Relations (Edges & Groups) -->
            <div id="panel-relations" class="flex-1 overflow-y-auto p-4 hidden space-y-6">
                <!-- Edges Manager -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-amber-400"><i class="fa-solid fa-route mr-1"></i>節點連線</span>
                        <button onclick="addEdge()" class="text-amber-400 hover:text-amber-300 text-xs flex items-center px-2 py-1 bg-amber-400/10 rounded">
                            <i class="fa-solid fa-plus mr-1"></i>新增
                        </button>
                    </div>
                    <div id="edgesList" class="space-y-2"></div>
                </div>

                <!-- Groups Manager -->
                <div class="pt-4 border-t border-slate-700">
                    <span class="text-xs font-bold text-emerald-400 mb-2 block"><i class="fa-solid fa-layer-group mr-1"></i>群組管理</span>
                    <div id="groupsList" class="space-y-2"></div>
                </div>
            </div>

            <!-- Content: Code (JSON Data) -->
            <div id="panel-code" class="flex-1 overflow-hidden p-4 hidden flex-col">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs text-slate-400 font-medium">即時數據規範 (JSON)</span>
                    <button onclick="applyJsonCode()" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded text-xs font-medium transition">
                        <i class="fa-solid fa-check mr-1"></i>套用
                    </button>
                </div>
                <textarea id="jsonEditor" class="flex-1 w-full bg-slate-950 font-mono text-xs text-slate-200 p-3 rounded-lg border border-slate-700/80 focus:outline-none focus:ring-1 focus:ring-blue-500 resize-none leading-relaxed"></textarea>
            </div>

            <!-- Collapsible Advanced Styles & Typography Accordion (Footer of Sidebar) -->
            <div class="border-t border-slate-800 bg-slate-950/60 p-3">
                <button onclick="toggleTypographyAccordion()" class="w-full flex items-center justify-between text-xs text-slate-400 hover:text-slate-200 transition py-1 font-medium">
                    <span class="flex items-center"><i class="fa-solid fa-sliders text-blue-400 mr-2"></i>進階字體與線條樣式</span>
                    <i id="typoAccordionIcon" class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200"></i>
                </button>
                <div id="typoAccordionContent" class="hidden space-y-3 pt-3 text-xs">
                    <div>
                        <label class="text-[11px] text-slate-400 block mb-1">全局字型 (Font Family)</label>
                        <select id="typoFontFamily" onchange="updateTypography('fontFamily', this.value)" class="w-full bg-slate-900 px-2 py-1.5 rounded border border-slate-700 text-slate-200 text-xs focus:outline-none focus:border-blue-500">
                            <option value="sans">現代無襯線 (System / Inter)</option>
                            <option value="mono">代碼等寬 (JetBrains Mono / Code)</option>
                            <option value="serif">學術襯線 (Times New Roman / Georgia)</option>
                            <option value="tc">微軟正黑體 / 繁體中文</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">主標題字級: <span id="valNodeTitle">14px</span></label>
                            <input type="range" min="11" max="20" value="14" id="rangeNodeTitle" oninput="updateTypography('nodeTitleSize', parseInt(this.value)); document.getElementById('valNodeTitle').innerText=this.value+'px';" class="w-full accent-blue-500 h-1.5 bg-slate-800 rounded cursor-pointer">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">副標題字級: <span id="valNodeSub">11px</span></label>

                    btn.className = 'icon-cat-btn text-[11px] px-2.5 py-1 rounded bg-blue-600 text-white font-medium transition';

        function renderIconGrid() {
            const container = document.getElementById('iconGridContainer');
            if (!container) return;
            container.innerHTML = '';

            const filtered = ICON_REGISTRY.filter(item => {
                const matchCat = (activeIconCategory === 'all' || item.cat === activeIconCategory);
                const matchSearch = !iconSearchQuery || item.key.toLowerCase().includes(iconSearchQuery) || item.name.toLowerCase().includes(iconSearchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-8 text-center text-slate-500 text-xs">
                        <i class="fa-solid fa-shapes text-2xl mb-2 block opacity-40"></i>
                        找不到符合「${iconSearchQuery}」的圖示
                    </div>
                `;
                return;
            }

            const currIcon = document.getElementById('propIcon') ? document.getElementById('propIcon').value : '';

            filtered.forEach(item => {
                const isSelected = (currIcon === item.key);
                const iconSvgPath = getIconSvgPath(item.key);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `p-2.5 rounded-xl border flex flex-col items-center justify-center text-center space-y-1.5 transition group cursor-pointer ${

                        ? 'bg-blue-600/25 border-blue-500 text-blue-300 shadow-lg ring-1 ring-blue-500/50' 
                        : 'bg-slate-900/70 border-slate-700/80 hover:border-blue-500 hover:bg-slate-900 text-slate-200'
                }`;
                btn.onclick = () => selectIcon(item.key);
                btn.innerHTML = `
                    <div class="w-9 h-9 rounded-lg ${isSelected ? 'bg-blue-500/30 text-blue-300' : 'bg-slate-800 text-blue-400 group-hover:bg-blue-500/20 group-hover:text-blue-300'} flex items-center justify-center transition">

                            <path d="${iconSvgPath}" />
                        </svg>
                    </div>
                    <span class="text-[10px] text-slate-200 font-semibold truncate w-full group-hover:text-white">${item.name}</span>
                    <span class="text-[9px] font-mono text-slate-400 truncate w-full">${item.key.replace('fa-', '')}</span>

            if (selectedNodeId) {

        window.onload = function() {
            setupCanvasInteractions();

            switchSidebarTab('modules');

            renderDiagram();

        function saveHistory() {
            if (currentHistoryIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, currentHistoryIndex + 1);
            }
            historyStack.push(JSON.parse(JSON.stringify(state)));
            currentHistoryIndex++;
            if (historyStack.length > 50) {
                historyStack.shift();
                currentHistoryIndex--;
            }
            updateUndoRedoUI();
        }

        function undo() {
            if (currentHistoryIndex > 0) {
                currentHistoryIndex--;
                state = JSON.parse(JSON.stringify(historyStack[currentHistoryIndex]));
                renderDiagram();
                updateRelationsPanel();
                if (selectedNodeId) refreshPropertiesPanel();
                if (activeTab === 'code') document.getElementById('jsonEditor').value = JSON.stringify(state, null, 2);
                updateUndoRedoUI();
            }
        }

        function redo() {
            if (currentHistoryIndex < historyStack.length - 1) {
                currentHistoryIndex++;
                state = JSON.parse(JSON.stringify(historyStack[currentHistoryIndex]));
                renderDiagram();
                updateRelationsPanel();
                if (selectedNodeId) refreshPropertiesPanel();
                if (activeTab === 'code') document.getElementById('jsonEditor').value = JSON.stringify(state, null, 2);
                updateUndoRedoUI();
            }
        }

        function updateUndoRedoUI() {
            const btnUndo = document.getElementById('btnUndo');
            const btnRedo = document.getElementById('btnRedo');
            
            if (currentHistoryIndex > 0) {
                btnUndo.classList.remove('opacity-50', 'cursor-not-allowed');
                btnUndo.classList.add('hover:bg-slate-700', 'hover:text-white', 'text-slate-200');
            } else {
                btnUndo.classList.add('opacity-50', 'cursor-not-allowed');
                btnUndo.classList.remove('hover:bg-slate-700', 'hover:text-white', 'text-slate-200');
            }
            
            if (currentHistoryIndex < historyStack.length - 1) {
                btnRedo.classList.remove('opacity-50', 'cursor-not-allowed');
                btnRedo.classList.add('hover:bg-slate-700', 'hover:text-white', 'text-slate-200');
            } else {
                btnRedo.classList.add('opacity-50', 'cursor-not-allowed');
                btnRedo.classList.remove('hover:bg-slate-700', 'hover:text-white', 'text-slate-200');
            }
        }

        // Clipboard State (Supports Node & Group Deep Copy)
        let clipboardType = null; // 'node' | 'group'
        let clipboardNode = null;
        let clipboardGroup = null;

        function copySelectedNode() {
            if (!selectedNodeId) {
                showToast('請先在畫布上選取要複製的節點', 'warning');
                return;
            }
            const node = state.nodes.find(n => n.id === selectedNodeId);
            if (!node) return;
            clipboardType = 'node';
            clipboardNode = JSON.parse(JSON.stringify(node));
            showToast(`已複製「${node.label}」組件 (Ctrl+C)`);
        }

        function copySelectedGroup(gid) {
            const targetGid = gid || selectedGroupId;
            if (!targetGid) {
                showToast('請先選取要複製的群組容器', 'warning');
                return;
            }
            const rootGroup = state.subgraphs.find(g => g.id === targetGid);
            if (!rootGroup) return;

            const desc = getAllGroupDescendants(targetGid);
            const subgraphs = [rootGroup, ...desc.subgraphs.filter(g => g.id !== targetGid)];
            const nodes = desc.nodes;
            const allIds = new Set([...subgraphs.map(g => g.id), ...nodes.map(n => n.id)]);
            const internalEdges = state.edges.filter(e => allIds.has(e.from) && allIds.has(e.to));

            clipboardType = 'group';
            clipboardGroup = {
                rootGroupId: targetGid,
                subgraphs: JSON.parse(JSON.stringify(subgraphs)),
                nodes: JSON.parse(JSON.stringify(nodes)),
                edges: JSON.parse(JSON.stringify(internalEdges))
            };
            showToast(`已複製「${rootGroup.label}」群組 (含 ${nodes.length} 個節點與 ${internalEdges.length} 條連線)`);
        }

        function pasteNode() {
            if (!clipboardNode) {
                showToast('剪貼簿中沒有可貼上的組件', 'warning');
                return;
            }
            const newId = 'n_' + Date.now().toString().slice(-4);
            const newNode = JSON.parse(JSON.stringify(clipboardNode));
            newNode.id = newId;
            newNode.label = newNode.label + ' (副本)';
            newNode.x = (newNode.x || 100) + 30;
            newNode.y = (newNode.y || 100) + 30;
            
            state.nodes.push(newNode);
            saveHistory();
            selectNode(newId);
            renderDiagram();
            updateRelationsPanel();
            showToast(`已貼上「${newNode.label}」組件 (Ctrl+V)`);
        }

        function pasteGroup() {
            if (!clipboardGroup) {
                showToast('剪貼簿中沒有可貼上的群組容器', 'warning');
                return;
            }
            const idMap = new Map();
            const newSubgraphs = [];
            const newNodes = [];
            const newEdges = [];
            const offset = 40;

            // Map new IDs for subgraphs
            clipboardGroup.subgraphs.forEach(g => {
                const newId = 'sg_' + Date.now().toString().slice(-4) + '_' + Math.random().toString(36).substr(2, 3);
                idMap.set(g.id, newId);
                const cloneG = JSON.parse(JSON.stringify(g));
                cloneG.id = newId;
                if (g.id === clipboardGroup.rootGroupId) {
                    cloneG.label = cloneG.label + ' (副本)';
                }
                if (cloneG.x !== undefined) cloneG.x += offset;
                if (cloneG.y !== undefined) cloneG.y += offset;
                newSubgraphs.push(cloneG);
            });

            // Update parent references for subgraphs
            newSubgraphs.forEach(g => {
                if (g.parent && idMap.has(g.parent)) {
                    g.parent = idMap.get(g.parent);
                }
            });

            // Map new IDs for nodes
            clipboardGroup.nodes.forEach(n => {
                const newId = 'n_' + Date.now().toString().slice(-4) + '_' + Math.random().toString(36).substr(2, 3);
                idMap.set(n.id, newId);
                const cloneN = JSON.parse(JSON.stringify(n));
                cloneN.id = newId;
                cloneN.x = (cloneN.x || 100) + offset;
                cloneN.y = (cloneN.y || 100) + offset;
                if (cloneN.group && idMap.has(cloneN.group)) {
                    cloneN.group = idMap.get(cloneN.group);
                }
                newNodes.push(cloneN);
            });

            // Map internal edges
            clipboardGroup.edges.forEach(e => {
                if (idMap.has(e.from) && idMap.has(e.to)) {
                    const cloneE = JSON.parse(JSON.stringify(e));
                    cloneE.from = idMap.get(e.from);
                    cloneE.to = idMap.get(e.to);
                    newEdges.push(cloneE);
                }
            });

            state.subgraphs.push(...newSubgraphs);
            state.nodes.push(...newNodes);
            state.edges.push(...newEdges);

            const rootNewId = idMap.get(clipboardGroup.rootGroupId);
            saveHistory();
            selectGroup(rootNewId);
            showToast(`已貼上群組 (含 ${newNodes.length} 個節點與 ${newEdges.length} 條連線)`);
        }

        window.addEventListener('keydown', function(e) {
            const activeEl = document.activeElement;
            const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT');
            
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); undo(); return; }
                else if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); redo(); return; }
                else if ((e.key === 'c' || e.key === 'C') && !isInput) {
                    if (selectedNodeId) {
                        e.preventDefault();
                        copySelectedNode();
                        return;
                    } else if (selectedGroupId) {
                        e.preventDefault();
                        copySelectedGroup(selectedGroupId);
                        return;
                    }
                }
                else if ((e.key === 'v' || e.key === 'V') && !isInput) {
                    e.preventDefault();
                    if (clipboardType === 'group') {
                        pasteGroup();
                    } else {
                        pasteNode();
                    }
                    return;
                }
            }
            
            if (!isInput) {
                if (e.key === 'x' || e.key === 'X' || e.key === 's' || e.key === 'S') {
                    // Quick Swap shortcut for connected nodes / containers
                    if (selectedEdgeIdx !== null) {
                        e.preventDefault();
                        swapConnectedNodes(selectedEdgeIdx);
                    } else if (selectedNodeId) {
                        const connectedEdgeIdx = state.edges.findIndex(ed => ed.from === selectedNodeId || ed.to === selectedNodeId);
                        if (connectedEdgeIdx !== -1) {
                            e.preventDefault();
                            swapConnectedNodes(connectedEdgeIdx);
                        }
                    }
                } else if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (selectedNodeId) {
                        e.preventDefault();
                        deleteSelectedNode();
                    } else if (selectedGroupId) {
                        e.preventDefault();
                        deleteSelectedGroup();
                    } else if (selectedEdgeIdx !== null) {
                        e.preventDefault();
                        removeEdge(selectedEdgeIdx);
                    }
                }
            }
        });

        function setMode(m) {

        function getMousePositionInSVG(e) {
            const viewport = document.getElementById('canvasViewport');
            const rect = viewport.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left - panX) / canvasZoom,
                y: (e.clientY - rect.top - panY) / canvasZoom
            };
        }

        // --- Group Descendants & Dragging Logic ---
        function isGroupDescendantOf(childId, parentId, visited = new Set()) {
            if (visited.has(childId)) return false;
            visited.add(childId);
            const child = state.subgraphs.find(x => x.id === childId);
            if (!child || !child.parent) return false;
            if (child.parent === parentId) return true;
            return isGroupDescendantOf(child.parent, parentId, visited);
        }

        function getAllGroupDescendants(gid) {
            const allGroupIds = new Set([gid]);
            let added = true;
            while (added) {
                added = false;
                state.subgraphs.forEach(g => {
                    if (g.parent && allGroupIds.has(g.parent) && !allGroupIds.has(g.id)) {
                        allGroupIds.add(g.id);
                        added = true;
                    }
                });
            }
            const nodes = state.nodes.filter(n => allGroupIds.has(n.group));
            const subgraphs = state.subgraphs.filter(g => allGroupIds.has(g.id));
            return { nodes, subgraphs, allGroupIds };
        }

        let isDraggingGroup = false;
        let selectedGroupId = null;
        let groupDragStartPt = { x: 0, y: 0 };
        let groupDragInitialNodes = [];
        let groupDragInitialGroups = [];

        function setupCanvasInteractions() {
            const viewport = document.getElementById('canvasViewport');

            viewport.addEventListener('mousedown', (e) => {
                if (e.target.closest('header') || e.target.closest('aside') || e.target.closest('.absolute.top-4')) return;

                // Priority 0: Group Collapse/Expand Button Detection
                const collapseBtn = e.target.closest('[data-action="toggle-collapse"]');
                if (collapseBtn) {
                    const gid = collapseBtn.getAttribute('data-group-id');
                    toggleGroupCollapse(gid);
                    e.stopPropagation();
                    return;
                }

                // Priority 1: Edge Click Detection
                const edgeGroup = e.target.closest('[data-edge-idx]');
                if (edgeGroup) {
                    const edgeIdx = parseInt(edgeGroup.getAttribute('data-edge-idx'));
                    selectEdge(edgeIdx);
                    e.stopPropagation();
                    return;
                }

                if (appMode === 'select') {
                    isSelectingArea = true;
                    const rect = viewport.getBoundingClientRect();
                    selectStartX = e.clientX - rect.left;
                    selectStartY = e.clientY - rect.top;
                    const sb = document.getElementById('selectionBox');
                    sb.style.left = selectStartX + 'px';
                    sb.style.top = selectStartY + 'px';
                    sb.style.width = '0px';
                    sb.style.height = '0px';
                    sb.classList.remove('hidden');
                    return;
                }

                const nodeGroup = e.target.closest('.node-group');
                const groupEl = e.target.closest('.group-container');
                
                if (nodeGroup) {
                    isDraggingNode = true;
                    const nodeId = nodeGroup.getAttribute('data-id');
                    selectNode(nodeId);

                    const node = state.nodes.find(n => n.id === nodeId);
                    const pt = getMousePositionInSVG(e);
                    
                    nodeDragOffsetX = pt.x - node.x;
                    nodeDragOffsetY = pt.y - node.y;
                    
                    viewport.classList.remove('cursor-grab');
                    viewport.classList.add('cursor-move');
                    e.stopPropagation(); 
                } else if (groupEl && !e.target.closest('[data-action="toggle-collapse"]')) {
                    // Start Group Drag & Selection (Robust check for any area inside group container)
                    isDraggingGroup = true;
                    const gid = groupEl.getAttribute('data-group-id');
                    selectGroup(gid);
                    groupDragStartPt = getMousePositionInSVG(e);

                    const desc = getAllGroupDescendants(gid);
                    groupDragInitialNodes = desc.nodes.map(n => ({ node: n, startX: n.x, startY: n.y }));
                    groupDragInitialGroups = desc.subgraphs.map(g => ({ group: g, startX: g.x !== undefined ? g.x : 100, startY: g.y !== undefined ? g.y : 100 }));

                    viewport.classList.remove('cursor-grab');
                    viewport.classList.add('cursor-move');
                    e.stopPropagation();
                } else {
                    isDraggingCanvas = true;
                    dragStartX = e.clientX - panX;
                    dragStartY = e.clientY - panY;
                    viewport.classList.remove('cursor-grab');
                    viewport.classList.add('cursor-grabbing');
                    selectNode(null);
                    selectGroup(null);
                    if (selectedEdgeIdx !== null) {
                        selectedEdgeIdx = null;
                        updateRelationsPanel();
                    }
                }
            });

            // Fast local DOM updates during node drag (avoids re-building entire SVG)
            function updateDraggedNodeDOM(nodeId, nx, ny) {
                const nodeEl = document.querySelector(`.node-group[data-id="${nodeId}"]`);
                if (nodeEl) {
                    nodeEl.setAttribute('transform', `translate(${nx}, ${ny})`);
                }

                const nodeMap = new Map();
                state.nodes.forEach(n => nodeMap.set(n.id, n));
                const draggedNode = nodeMap.get(nodeId);
                const edgePairInfoMap = buildEdgePairIndexMap();

                // Update affected edges (either connected directly to the node or to affected groups)
                state.edges.forEach((e, idx) => {
                    const isDirectlyConnected = (e.from === nodeId || e.to === nodeId);
                    const isGroupConnected = (draggedNode && draggedNode.group && (e.from === draggedNode.group || e.to === draggedNode.group));
                    if (isDirectlyConnected || isGroupConnected) {
                        const edgeEl = document.querySelector(`[data-edge-idx="${idx}"]`);
                        if (edgeEl) {
                            const effFrom = resolveEffectiveEndpointId(e.from);
                            const effTo = resolveEffectiveEndpointId(e.to);
                            if (effFrom && effTo && effFrom !== effTo) {
                                const epA = getEndpointBounds(effFrom);
                                const epB = getEndpointBounds(effTo);
                                if (epA && epB) {
                                    const edgeInfo = edgePairInfoMap.get(idx) || { indexInPair: 0, totalInPair: 1 };
                                    const pathData = computeEdgePath(epA, epB, edgeInfo.indexInPair, edgeInfo.totalInPair, e.type, e.labelPos, e.fromPort, e.toPort, e.fromOffset, e.toOffset);
                                    const pathEl = edgeEl.querySelector('.edge-path');
                                    if (pathEl) pathEl.setAttribute('d', pathData.d);
                                    const hitboxEl = edgeEl.querySelector('.edge-hitbox');
                                    if (hitboxEl) hitboxEl.setAttribute('d', pathData.d);
                                    
                                    const labelBg = edgeEl.querySelector('.edge-label-bg');
                                    const labelText = edgeEl.querySelector('.edge-label-text');
                                    if (labelBg && labelText) {
                                        const labelLen = (e.label || '').length;
                                        const boxW = Math.max(50, labelLen * 9 + 16);
                                        labelBg.setAttribute('x', pathData.midX - boxW/2);
                                        labelBg.setAttribute('y', pathData.midY - 12);
                                        labelText.setAttribute('x', pathData.midX);
                                        labelText.setAttribute('y', pathData.midY + 4);
                                    }
                                }
                            }
                        }
                    }
                });

                // Update affected group bounds
                if (draggedNode && draggedNode.group) {
                    let currGid = draggedNode.group;
                    while (currGid) {
                        const groupEl = document.querySelector(`[data-group-id="${currGid}"]`);
                        if (groupEl) {
                            const box = getGroupBoundingBox(currGid);
                            groupEl.setAttribute('transform', `translate(${box.gx}, ${box.gy})`);
                            const rectEl = groupEl.querySelector('.group-rect');
                            const headerEl = groupEl.querySelector('.group-header');
                            if (rectEl) {
                                rectEl.setAttribute('width', box.gw);
                                rectEl.setAttribute('height', box.gh);
                            }
                            if (headerEl) {
                                headerEl.setAttribute('width', box.gw);
                            }
                        }
                        const gObj = state.subgraphs.find(x => x.id === currGid);
                        currGid = gObj ? gObj.parent : null;
                    }
                }
            }

            let dragRafId = null;
            let panRafId = null;

            window.addEventListener('mousemove', (e) => {
                if (isSelectingArea) {
                    const rect = viewport.getBoundingClientRect();
                    const currX = e.clientX - rect.left;
                    const currY = e.clientY - rect.top;
                    const sb = document.getElementById('selectionBox');
                    sb.style.left = Math.min(selectStartX, currX) + 'px';
                    sb.style.top = Math.min(selectStartY, currY) + 'px';
                    sb.style.width = Math.abs(currX - selectStartX) + 'px';
                    sb.style.height = Math.abs(currY - selectStartY) + 'px';
                    return;
                }

                if (isDraggingNode && selectedNodeId) {
                    const node = state.nodes.find(n => n.id === selectedNodeId);
                    if (node) {
                        const pt = getMousePositionInSVG(e);
                        // Grid snapping (10px)
                        node.x = Math.round((pt.x - nodeDragOffsetX) / 10) * 10;
                        node.y = Math.round((pt.y - nodeDragOffsetY) / 10) * 10;
                        
                        if (!dragRafId) {
                            dragRafId = requestAnimationFrame(() => {
                                updateDraggedNodeDOM(selectedNodeId, node.x, node.y);
                                dragRafId = null;
                            });
                        }
                    }
                } else if (isDraggingGroup && selectedGroupId) {
                    const pt = getMousePositionInSVG(e);
                    const deltaX = Math.round((pt.x - groupDragStartPt.x) / 10) * 10;
                    const deltaY = Math.round((pt.y - groupDragStartPt.y) / 10) * 10;

                    groupDragInitialNodes.forEach(item => {
                        item.node.x = item.startX + deltaX;
                        item.node.y = item.startY + deltaY;
                    });
                    groupDragInitialGroups.forEach(item => {
                        item.group.x = item.startX + deltaX;
                        item.group.y = item.startY + deltaY;
                    });

                    if (!dragRafId) {
                        dragRafId = requestAnimationFrame(() => {
                            renderDiagram();
                            dragRafId = null;
                        });
                    }
                } else if (isDraggingCanvas) {
                    panX = e.clientX - dragStartX;
                    panY = e.clientY - dragStartY;
                    if (!panRafId) {
                        panRafId = requestAnimationFrame(() => {
                            updateCanvasTransform();
                            panRafId = null;
                        });
                    }
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (dragRafId) { cancelAnimationFrame(dragRafId); dragRafId = null; }
                if (panRafId) { cancelAnimationFrame(panRafId); panRafId = null; }

                if (isSelectingArea) {
                    isSelectingArea = false;
                    const sb = document.getElementById('selectionBox');
                    sb.classList.add('hidden');
                    
                    const rect = viewport.getBoundingClientRect();
                    const endX = e.clientX - rect.left;
                    const endY = e.clientY - rect.top;
                    const minX = Math.min(selectStartX, endX);
                    const minY = Math.min(selectStartY, endY);
                    const w = Math.abs(endX - selectStartX);
                    const h = Math.abs(endY - selectStartY);

                    if (w > 20 && h > 20) {
                        const pt1 = { x: (minX - panX)/canvasZoom, y: (minY - panY)/canvasZoom };
                        const pt2 = { x: (minX + w - panX)/canvasZoom, y: (minY + h - panY)/canvasZoom };
                        customExportBox = { x: pt1.x, y: pt1.y, w: pt2.x - pt1.x, h: pt2.y - pt1.y };
                        
                        document.getElementById('radioCustomArea').disabled = false;
                        document.getElementById('radioCustomArea').checked = true;
                        document.getElementById('labelCustomArea').classList.remove('opacity-50');
                        openExportModal();
                        setMode('drag');
                    }
                    return;
                }

                if (isDraggingNode && selectedNodeId) {
                    const node = state.nodes.find(n => n.id === selectedNodeId);
                    if (node) {
                        const dropZones = getGroupDropZones(selectedNodeId);
                        const dim = getNodeDimensions(node);
                        const nodeCX = node.x + dim.w / 2;
                        const nodeCY = node.y + dim.h / 2;
                        
                        // Collect all matched candidate groups
                        const matchedGroups = [];
                        state.subgraphs.forEach(g => {
                            const z = dropZones[g.id];
                            if (z && nodeCX >= z.minX && nodeCX <= z.maxX && nodeCY >= z.minY && nodeCY <= z.maxY) {
                                matchedGroups.push({
                                    id: g.id,
                                    depth: getGroupDepth(g.id),
                                    area: (z.maxX - z.minX) * (z.maxY - z.minY)
                                });
                            }
                        });
                        
                        // Deepest-Child-First sorting (highest depth first, then smallest bounding box)
                        matchedGroups.sort((a, b) => b.depth - a.depth || a.area - b.area);
                        const targetGroupId = matchedGroups.length > 0 ? matchedGroups[0].id : '';
                        
                        if (node.group !== targetGroupId) {
                            node.group = targetGroupId;
                            if (targetGroupId) {
                                const targetGroup = state.subgraphs.find(g => g.id === targetGroupId);
                                showToast(`已自動吸附至「${targetGroup ? targetGroup.label : '群組'}」`);
                            } else {
                                showToast('已移出群組');
                            }
                            if (activeTab === 'properties') refreshPropertiesPanel();
                            renderDiagram();
                        } else {
                            renderDiagram();
                        }
                    }
                    saveHistory();
                } else if (isDraggingGroup) {
                    renderDiagram();
                    saveHistory();
                }

                isDraggingNode = false;
                isDraggingGroup = false;
                isDraggingCanvas = false;
                selectedGroupId = null;
                const viewport = document.getElementById('canvasViewport');
                viewport.classList.remove('cursor-grabbing', 'cursor-move');
                viewport.classList.add('cursor-grab');
                
                if (activeTab === 'code') {
                    document.getElementById('jsonEditor').value = JSON.stringify(state, null, 2);
                }
            });

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) {
                    zoomCanvas(1.1);
                } else {
                    zoomCanvas(0.9);
                }
            }, { passive: false });
        }

        function updateCanvasTransform() {
            const vpTransform = document.getElementById('viewportTransform');
            if (vpTransform) {
                vpTransform.setAttribute('transform', `translate(${panX}, ${panY}) scale(${canvasZoom})`);
            } else {
                renderDiagram();
            }
            document.getElementById('zoomLevelDisplay').innerText = Math.round(canvasZoom * 100) + '%';
        }

        let lastZoomLOD = 1.0;
        function zoomCanvas(factor) {
            const viewport = document.getElementById('canvasViewport');
            const rect = viewport.getBoundingClientRect();
            const cx = (rect.width / 2 - panX) / canvasZoom;
            const cy = (rect.height / 2 - panY) / canvasZoom;

            canvasZoom *= factor;
            if(canvasZoom < 0.2) canvasZoom = 0.2;
            if(canvasZoom > 3.0) canvasZoom = 3.0;

            panX = rect.width / 2 - cx * canvasZoom;
            panY = rect.height / 2 - cy * canvasZoom;
            
            // Check LOD threshold transition (e.g. crossing 0.65 or 1.4) to re-render fine details
            const currentLOD = canvasZoom < 0.65 ? 0.5 : (canvasZoom > 1.4 ? 2.0 : 1.0);
            if (currentLOD !== lastZoomLOD) {
                lastZoomLOD = currentLOD;
                renderDiagram();
            } else {
                updateCanvasTransform();
            }
        }

        function centerView() {
            if (state.nodes.length === 0 && state.subgraphs.length === 0) {
                canvasZoom = 1.0;
                panX = 0; panY = 0;
                updateCanvasTransform();
                return;
            }
            
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            state.nodes.forEach(n => {
                const dim = getNodeDimensions(n);
                minX = Math.min(minX, n.x);
                minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x + dim.w);
                maxY = Math.max(maxY, n.y + dim.h);
            });
            state.subgraphs.forEach(g => {
                const box = getGroupBoundingBox(g.id);
                minX = Math.min(minX, box.minX);
                minY = Math.min(minY, box.minY);
                maxX = Math.max(maxX, box.maxX);
                maxY = Math.max(maxY, box.maxY);
            });
            
            if (minX === Infinity) {
                minX = 0; minY = 0; maxX = 800; maxY = 600;
            }

            const contentW = maxX - minX;
            const contentH = maxY - minY;
            const cx = minX + contentW / 2;
            const cy = minY + contentH / 2;
            
            const viewport = document.getElementById('canvasViewport');
            const viewW = viewport.clientWidth;
            const viewH = viewport.clientHeight;
            
            canvasZoom = 1.0;
            if (contentW > viewW * 0.8 || contentH > viewH * 0.8) {
                canvasZoom = Math.min((viewW * 0.8) / contentW, (viewH * 0.8) / contentH);
            }
            
            panX = viewW / 2 - cx * canvasZoom;
            panY = viewH / 2 - cy * canvasZoom;
            updateCanvasTransform();
        }

        function getGroupDropZones(draggedNodeId) {
            const zones = {};
            state.subgraphs.forEach(g => {
                const box = getGroupBoundingBox(g.id);
                zones[g.id] = {
                    minX: box.gx,
                    minY: box.gy,
                    maxX: box.gx + box.gw,
                    maxY: box.gy + box.gh
                };
            });
            return zones;
        }

        function toggleGridBackground() {
            const vp = document.getElementById('canvasViewport');
            const btn = document.getElementById('gridToggleBtn');
            isShowGrid = !isShowGrid;
            if (isShowGrid) {
                vp.classList.add('bg-grid-pattern');
                btn.classList.add('text-blue-400');
                btn.classList.remove('text-slate-300');
            } else {
                vp.classList.remove('bg-grid-pattern');
                btn.classList.remove('text-blue-400');
                btn.classList.add('text-slate-300');
            }
        }

        function selectNode(id) {
            selectedNodeId = id;
            if (id) {
                selectedGroupId = null;
                selectedEdgeIdx = null;
            }
            renderDiagram(); 
            
            if (id && activeTab !== 'properties') {
                switchSidebarTab('properties');
            } else if (id && activeTab === 'properties') {
                refreshPropertiesPanel();
            } else if (!id && activeTab === 'properties') {
                refreshPropertiesPanel();
            }
        }

        function selectGroup(gid) {
            selectedGroupId = gid;
            if (gid) {
                selectedNodeId = null;
                selectedEdgeIdx = null;
            }
            renderDiagram();
            if (activeTab === 'relations') {
                updateRelationsPanel();
            }
        }

        function deleteSelectedGroup() {
            if (!selectedGroupId) return;
            const idx = state.subgraphs.findIndex(g => g.id === selectedGroupId);
            if (idx !== -1) {
                removeGroup(idx);
                selectedGroupId = null;
                showToast('已刪除群組容器');
            }
        }

        function addNodeToCenter(shape) {
            const vp = document.getElementById('canvasViewport');
            const centerPt = {
                x: (vp.clientWidth/2 - panX) / canvasZoom - NODE_W/2,
                y: (vp.clientHeight/2 - panY) / canvasZoom - NODE_H/2
            };
            
            const newId = 'n_' + Date.now().toString().slice(-4);
            const newNode = {
                id: newId,
                label: '新節點',
                sub: '',
                shape: shape,
                icon: shape === 'database' ? 'fa-database' : (shape === 'cloud' ? 'fa-cloud' : 'fa-cube'),
                group: '',
                color: '#3b82f6',
                x: Math.round(centerPt.x / 10) * 10,
                y: Math.round(centerPt.y / 10) * 10,
                showIcon: true
            };
            
            state.nodes.push(newNode);
            saveHistory();
            selectNode(newId);
            showToast('已新增組件');
        }

        function deleteSelectedNode() {
            if(!selectedNodeId) return;
            state.nodes = state.nodes.filter(n => n.id !== selectedNodeId);
            state.edges = state.edges.filter(e => e.from !== selectedNodeId && e.to !== selectedNodeId);
            selectedNodeId = null;
            
            saveHistory();
            renderDiagram();
            refreshPropertiesPanel();
            updateRelationsPanel();
            showToast('已刪除節點');
        }

        function refreshPropertiesPanel() {
            const msg = document.getElementById('noSelectionMsg');
            const editor = document.getElementById('nodePropertiesEditor');
            
            if (!selectedNodeId) {
                msg.classList.remove('hidden');
                editor.classList.add('hidden');
                return;
            }
            
            const node = state.nodes.find(n => n.id === selectedNodeId);
            if(!node) return;
            
            msg.classList.add('hidden');
            editor.classList.remove('hidden');
            
            document.getElementById('propLabel').value = node.label;
            document.getElementById('propSub').value = node.sub;
            
            const rawIconKey = node.icon || 'fa-cube';
            const normIconKey = rawIconKey.startsWith('fa-') ? rawIconKey : 'fa-' + rawIconKey;
            const iconSvgPath = getIconSvgPath(node.icon);
            
            document.getElementById('propIcon').value = normIconKey;
            const iconNameEl = document.getElementById('propIconName');
            if (iconNameEl) iconNameEl.textContent = normIconKey;
            const iconPreviewEl = document.getElementById('propIconPreview');
            if (iconPreviewEl) {
                iconPreviewEl.innerHTML = `
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="${iconSvgPath}" />
                    </svg>
                `;
                iconPreviewEl.style.color = node.color || '#3b82f6';
            }

            document.getElementById('propShowIcon').checked = node.showIcon !== false;
            document.getElementById('propColor').value = node.color;
            
            const groupSelect = document.getElementById('propGroup');
            groupSelect.innerHTML = `<option value="">(無群組 / 畫布頂層)</option>`;
            
            // Sort groups by hierarchy depth and render with tree indentation
            const sortedGroups = [...state.subgraphs].sort((a, b) => getGroupDepth(a.id) - getGroupDepth(b.id));
            sortedGroups.forEach(g => {
                const depth = getGroupDepth(g.id);
                const indent = depth > 0 ? '　'.repeat(depth) + '↳ ' : '';
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = indent + g.label;
                opt.selected = (node.group === g.id);
                groupSelect.appendChild(opt);
            });
        }

        function updateSelectedNode(key, val) {
            if(!selectedNodeId) return;
            const node = state.nodes.find(n => n.id === selectedNodeId);
            if(node) {
                node[key] = val;
                renderDiagram();
            }
        }

        // Selected Edge Index
        let selectedEdgeIdx = null;

        function selectEdge(idx) {
            selectedEdgeIdx = idx;
            selectedNodeId = null;
            if (activeTab !== 'relations') {
                switchSidebarTab('relations');
            } else {
                updateRelationsPanel();
            }
            renderDiagram();
            setTimeout(() => {
                const card = document.querySelector(`[data-relation-edge-idx="${idx}"]`);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 60);
        }

        function swapConnectedNodes(edgeIdx) {
            if (edgeIdx < 0 || edgeIdx >= state.edges.length) return;
            const edge = state.edges[edgeIdx];
            const nodeA = state.nodes.find(n => n.id === edge.from);
            const nodeB = state.nodes.find(n => n.id === edge.to);
            const groupA = state.subgraphs.find(g => g.id === edge.from);
            const groupB = state.subgraphs.find(g => g.id === edge.to);
            
            const labelA = nodeA ? nodeA.label : (groupA ? groupA.label : edge.from);
            const labelB = nodeB ? nodeB.label : (groupB ? groupB.label : edge.to);
            
            // Swap canvas coordinates
            if (nodeA && nodeB) {
                const tempX = nodeA.x;
                const tempY = nodeA.y;
                nodeA.x = nodeB.x;
                nodeA.y = nodeB.y;
                nodeB.x = tempX;
                nodeB.y = tempY;
            } else if (groupA && groupB) {
                const tempX = groupA.x !== undefined ? groupA.x : 100;
                const tempY = groupA.y !== undefined ? groupA.y : 100;
                groupA.x = groupB.x !== undefined ? groupB.x : 100;
                groupA.y = groupB.y !== undefined ? groupB.y : 100;
                groupB.x = tempX;
                groupB.y = tempY;
            } else if (nodeA && groupB) {
                const tempX = nodeA.x;
                const tempY = nodeA.y;
                nodeA.x = groupB.x !== undefined ? groupB.x : 100;
                nodeA.y = groupB.y !== undefined ? groupB.y : 100;
                groupB.x = tempX;
                groupB.y = tempY;
            } else if (groupA && nodeB) {
                const tempX = groupA.x !== undefined ? groupA.x : 100;
                const tempY = groupA.y !== undefined ? groupA.y : 100;
                groupA.x = nodeB.x;
                groupA.y = nodeB.y;
                nodeB.x = tempX;
                nodeB.y = tempY;
            }

            // Also swap direction of edge
            const tempFrom = edge.from;
            edge.from = edge.to;
            edge.to = tempFrom;
            
            saveHistory();
            renderDiagram();
            updateRelationsPanel();
            showToast(`已快速交換「${labelA}」與「${labelB}」的順序與位置 (快速鍵: X)`);
        }

        function toggleGroupCollapse(gid) {
            const g = state.subgraphs.find(x => x.id === gid);
            if (!g) return;
            g.collapsed = !g.collapsed;
            saveHistory();
            renderDiagram();
            updateRelationsPanel();
            showToast(g.collapsed ? `已收折「${g.label}」容器` : `已展開「${g.label}」容器`);
        }

        function toggleAllGroupsCollapse(collapse) {
            state.subgraphs.forEach(g => {
                g.collapsed = collapse;
            });
            saveHistory();
            renderDiagram();
            updateRelationsPanel();
            showToast(collapse ? '已收折全部群組' : '已展開全部群組');
        }

        // Expanded Edge Details Map
        let expandedEdgeIndices = new Set();

        function toggleEdgeDetails(idx) {
            if (expandedEdgeIndices.has(idx)) {
                expandedEdgeIndices.delete(idx);
            } else {
                expandedEdgeIndices.add(idx);
            }
            updateRelationsPanel();
        }

        function updateRelationsPanel() {
            const edgesContainer = document.getElementById('edgesList');
            edgesContainer.innerHTML = '';
            
            if (state.edges.length === 0) {
                edgesContainer.innerHTML = `<div class="text-xs text-slate-500 py-2">目前沒有連線。</div>`;
            }
            
            state.edges.forEach((e, idx) => {
                const isSelected = selectedEdgeIdx === idx;
                const isDetailsOpen = expandedEdgeIndices.has(idx) || isSelected;
                const item = document.createElement('div');
                item.setAttribute('data-relation-edge-idx', idx);
                item.className = `p-2.5 rounded-lg border transition-all space-y-2 text-xs cursor-pointer ${
                    isSelected 
                        ? 'bg-blue-950/40 border-blue-500 shadow-md ring-1 ring-blue-500/50' 
                        : 'bg-slate-900/50 border-slate-700/60 hover:border-slate-600'
                }`;
                item.onclick = (evt) => {
                    if (evt.target.tagName !== 'SELECT' && evt.target.tagName !== 'INPUT' && evt.target.tagName !== 'BUTTON' && !evt.target.closest('button')) {
                        selectEdge(idx);
                    }
                };

                let nodeOptionsFrom = '<optgroup label="節點">';
                let nodeOptionsTo = '<optgroup label="節點">';
                state.nodes.forEach(n => {
                    nodeOptionsFrom += `<option value="${n.id}" ${e.from === n.id ? 'selected' : ''}>${n.label}</option>`;
                    nodeOptionsTo += `<option value="${n.id}" ${e.to === n.id ? 'selected' : ''}>${n.label}</option>`;
                });
                nodeOptionsFrom += '</optgroup>';
                nodeOptionsTo += '</optgroup>';

                if (state.subgraphs.length > 0) {
                    nodeOptionsFrom += '<optgroup label="群組 (Group)">';
                    nodeOptionsTo += '<optgroup label="群組 (Group)">';
                    state.subgraphs.forEach(g => {
                        nodeOptionsFrom += `<option value="${g.id}" ${e.from === g.id ? 'selected' : ''}>[群組] ${g.label}${g.collapsed ? ' (已收折)' : ''}</option>`;
                        nodeOptionsTo += `<option value="${g.id}" ${e.to === g.id ? 'selected' : ''}>[群組] ${g.label}${g.collapsed ? ' (已收折)' : ''}</option>`;
                    });
                    nodeOptionsFrom += '</optgroup>';
                    nodeOptionsTo += '</optgroup>';
                }

                const curPos = Math.round((e.labelPos !== undefined ? e.labelPos : 0.5) * 100);
                const curType = e.type || 'bezier';
                const curArrow = e.arrow || 'end';
                const curWidth = e.width || '';

                const fromPort = e.fromPort || 'auto';
                const toPort = e.toPort || 'auto';
                const fromOffset = e.fromOffset || 0;
                const toOffset = e.toOffset || 0;

                item.innerHTML = `
                    <!-- Essential Row 1: From -> Swap(X) -> To + Delete -->
                    <div class="grid grid-cols-[1fr_auto_auto_1fr_auto] items-center gap-1 min-w-0">
                        <select onchange="updateEdge(${idx}, 'from', this.value); saveHistory();" class="min-w-0 w-full bg-slate-950 px-1.5 py-1 rounded border border-slate-700 text-slate-200 focus:outline-none truncate text-[11px]">
                            ${nodeOptionsFrom}
                        </select>
                        <button onclick="swapConnectedNodes(${idx}); event.stopPropagation();" title="交換相連兩端順序與位置 (快速鍵: X)" class="text-blue-400 hover:text-blue-300 p-1 rounded hover:bg-slate-800 shrink-0 transition">
                            <i class="fa-solid fa-arrow-right-arrow-left text-[10px]"></i>
                        </button>
                        <i class="fa-solid fa-arrow-right text-slate-500 text-[10px] shrink-0"></i>
                        <select onchange="updateEdge(${idx}, 'to', this.value); saveHistory();" class="min-w-0 w-full bg-slate-950 px-1.5 py-1 rounded border border-slate-700 text-slate-200 focus:outline-none truncate text-[11px]">
                            ${nodeOptionsTo}
                        </select>
                        <button onclick="removeEdge(${idx}); event.stopPropagation();" title="刪除連線" class="text-slate-500 hover:text-red-400 p-1 rounded hover:bg-slate-800 shrink-0"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>

                    <!-- Essential Row 2: Tag (Label) Input + Advanced Toggle Button -->
                    <div class="flex items-center space-x-1.5">
                        <div class="flex-1 flex items-center bg-slate-950 px-2 py-0.5 rounded border border-slate-700 focus-within:border-blue-500">
                            <span class="text-[10px] text-slate-500 mr-1.5 shrink-0"><i class="fa-solid fa-tag mr-0.5"></i>Tag:</span>
                            <input type="text" value="${e.label || ''}" placeholder="連線標籤 (選填)" onchange="updateEdge(${idx}, 'label', this.value); saveHistory();" class="w-full bg-transparent text-slate-200 text-[11px] focus:outline-none min-w-0">
                        </div>
                        <button onclick="toggleEdgeDetails(${idx}); event.stopPropagation();" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-${isDetailsOpen ? 'blue-400' : 'slate-400'} shrink-0 transition flex items-center" title="切換進階樣式設定">
                            <i class="fa-solid fa-sliders mr-1 text-[9px]"></i>進階
                            <i class="fa-solid fa-chevron-${isDetailsOpen ? 'up' : 'down'} ml-1 text-[8px]"></i>
                        </button>
                    </div>

                    <!-- Collapsible Advanced Properties Section -->
                    ${isDetailsOpen ? `
                    <div class="pt-2 border-t border-slate-800/80 space-y-2">
                        <div class="grid grid-cols-2 gap-1.5">
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-0.5">線條種類</label>
                                <select onchange="updateEdge(${idx}, 'type', this.value); saveHistory();" class="w-full bg-slate-950 px-1.5 py-1 rounded border border-slate-700 text-slate-300 text-[11px] focus:border-blue-500 focus:outline-none">

        function addEdge() {

        function updateGroup(idx, key, val) {
            state.subgraphs[idx][key] = val;
            renderDiagram();

        }
        function removeGroup(idx) {
            const id = state.subgraphs[idx].id;
            const parentId = state.subgraphs[idx].parent || '';
            state.subgraphs.splice(idx, 1);
            state.nodes.forEach(n => { if (n.group === id) n.group = ''; });
            state.subgraphs.forEach(g => { if (g.parent === id) g.parent = parentId; });
            saveHistory();
            updateRelationsPanel();
            if(selectedNodeId) refreshPropertiesPanel();
            renderDiagram();
        }

        // --- Typography System ---
        const FONT_FAMILIES = {
            'sans': "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif",
            'mono': "'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Monaco, monospace",

        function toggleTypographyAccordion() {

        function updateTypography(key, val) {
