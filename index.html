<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Figure Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .grid-bg {
            background-size: 20px 20px;
            background-image: radial-gradient(circle, #334155 1px, transparent 1px);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .node-selected rect { stroke: #3b82f6 !important; stroke-width: 3px !important; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5)); }
        
        #selectionBox {
            position: absolute; border: 2px dashed #3b82f6; background-color: rgba(59, 130, 246, 0.2);
            pointer-events: none; display: none; z-index: 50;
        }

        .toast-enter { animation: toastIn 0.3s ease-out forwards; }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 h-screen flex flex-col">

    <!-- Top Toolbar -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0 z-10 relative">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-project-diagram text-white text-sm"></i>
            </div>
            <h1 class="font-bold text-slate-100 tracking-wide text-sm hidden sm:block">Workflow<span class="text-blue-400 font-normal">Gen</span></h1>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Undo / Redo -->
            <div class="flex items-center bg-slate-950 rounded-lg border border-slate-700 p-0.5">
                <button id="btnUndo" onclick="undo()" class="p-1.5 px-2 text-slate-400 hover:text-white disabled:opacity-30 transition" title="復原 (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
                <div class="w-[1px] h-4 bg-slate-700 mx-1"></div>
                <button id="btnRedo" onclick="redo()" class="p-1.5 px-2 text-slate-400 hover:text-white disabled:opacity-30 transition" title="重做 (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>
            </div>

            <!-- Mode Switch -->
            <div class="flex items-center bg-slate-950 rounded-lg border border-slate-700 p-0.5">
                <button id="modeDrag" onclick="setMode('drag')" class="px-3 py-1 rounded-md bg-blue-600 text-white text-xs font-bold transition">拖曳編輯</button>
                <button id="modeSelect" onclick="setMode('select')" class="px-3 py-1 rounded-md text-slate-400 hover:text-white text-xs font-bold transition">框選匯出</button>
            </div>

            <button onclick="toggleIcons()" id="btnToggleIcons" class="bg-slate-950 text-blue-400 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-800 transition flex items-center">
                <i class="fa-solid fa-icons mr-1.5"></i>圖示
            </button>

            <!-- Themes -->
            <select id="themeSelect" onchange="changeTheme(this.value)" class="bg-slate-950 text-xs text-slate-200 rounded-lg px-3 py-1.5 border border-slate-700 focus:outline-none focus:border-blue-500 cursor-pointer hidden md:block">
                <option value="academic">Academic Clean (學術)</option>
                <option value="tech">Tech Dark (科技)</option>
                <option value="pastel">Pastel (粉彩)</option>
            </select>
            
            <!-- Export -->
            <button onclick="openExportModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition shadow-lg flex items-center">
                <i class="fa-solid fa-download mr-1.5"></i> 匯出
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Sidebar (Tools & Properties) -->
        <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 z-10">
            <!-- Tabs -->
            <div class="flex border-b border-slate-800">
                <button onclick="switchTab('library')" id="tab-library" class="flex-1 py-3 text-xs font-bold text-blue-400 border-b-2 border-blue-500">組件庫</button>
                <button onclick="switchTab('properties')" id="tab-properties" class="flex-1 py-3 text-xs font-bold text-slate-400 hover:text-slate-200 border-b-2 border-transparent">屬性</button>
                <button onclick="switchTab('relations')" id="tab-relations" class="flex-1 py-3 text-xs font-bold text-slate-400 hover:text-slate-200 border-b-2 border-transparent">關聯</button>
            </div>

            <!-- Tab Contents -->
            <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
                
                <!-- Library Tab -->
                <div id="panel-library" class="space-y-6 block">
                    <div>
                        <h3 class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-3">流程節點 (點擊新增)</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="addNode('rect')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded p-2 flex flex-col items-center justify-center transition">
                                <div class="w-10 h-6 border-2 border-blue-400 rounded-sm mb-1"></div>
                                <span class="text-[10px] text-slate-300">矩形</span>
                            </button>
                            <button onclick="addNode('capsule')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded p-2 flex flex-col items-center justify-center transition">
                                <div class="w-10 h-6 border-2 border-emerald-400 rounded-full mb-1"></div>
                                <span class="text-[10px] text-slate-300">膠囊</span>
                            </button>
                            <button onclick="addNode('diamond')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded p-2 flex flex-col items-center justify-center transition">
                                <div class="w-8 h-8 border-2 border-amber-400 rotate-45 mb-1 mt-1"></div>
                                <span class="text-[10px] text-slate-300">菱形 (判斷)</span>
                            </button>
                            <button onclick="addNode('database')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded p-2 flex flex-col items-center justify-center transition">
                                <div class="w-10 h-8 border-2 border-purple-400 rounded-[50%/15%] mb-1 relative before:absolute before:top-[15%] before:left-[-2px] before:right-[-2px] before:border-t-2 before:border-purple-400"></div>
                                <span class="text-[10px] text-slate-300">資料庫</span>
                            </button>
                        </div>
                    </div>
                    
                    <div>
                        <h3 class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-3">結構與群組</h3>
                        <button onclick="addGroup()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 border-dashed rounded p-3 flex items-center justify-center transition group">
                            <i class="fa-solid fa-object-group text-slate-400 group-hover:text-white mr-2"></i>
                            <span class="text-xs text-slate-300 group-hover:text-white">新增群組包圍盒</span>
                        </button>
                    </div>

                    <div>
                        <h3 class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-3">預設範本</h3>
                        <div class="space-y-2">
                            <button onclick="loadTemplate('ml')" class="w-full text-left px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded border border-slate-700 text-xs text-slate-300 transition">🚀 AI/ML 訓練管線</button>
                            <button onclick="loadTemplate('microservice')" class="w-full text-left px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded border border-slate-700 text-xs text-slate-300 transition">🌐 微服務架構</button>
                            <button onclick="loadTemplate('empty')" class="w-full text-left px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded border border-slate-700 text-xs text-slate-300 transition text-rose-400">🗑️ 清空畫布</button>
                        </div>
                    </div>
                </div>

                <!-- Properties Tab -->
                <div id="panel-properties" class="hidden">
                    <div id="emptyProperties" class="text-center py-10">
                        <i class="fa-solid fa-hand-pointer text-slate-600 text-3xl mb-3"></i>
                        <p class="text-xs text-slate-400">請在畫布上點選一個節點<br>以編輯其屬性</p>
                    </div>
                    
                    <div id="nodeProperties" class="hidden space-y-4">
                        <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                            <span class="text-xs font-bold text-slate-300"><i class="fa-solid fa-sliders mr-1.5"></i>節點設定</span>
                            <button onclick="deleteSelectedNode()" class="text-[10px] text-rose-400 hover:text-rose-300 bg-rose-400/10 px-2 py-1 rounded">刪除節點</button>
                        </div>
                        
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">主標題 (Label)</label>
                            <input type="text" id="propLabel" oninput="updateSelectedNode('label', this.value)" onchange="saveHistory()" class="w-full bg-slate-950 px-2.5 py-1.5 rounded border border-slate-700 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">副標題 (Sub)</label>
                            <input type="text" id="propSub" oninput="updateSelectedNode('sub', this.value)" onchange="saveHistory()" class="w-full bg-slate-950 px-2.5 py-1.5 rounded border border-slate-700 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[11px] text-slate-400 block mb-1">圖示 (Icon)</label>
                                <input type="text" id="propIcon" placeholder="fa-brain" oninput="updateSelectedNode('icon', this.value)" onchange="saveHistory()" class="w-full bg-slate-950 px-2.5 py-1.5 rounded border border-slate-700 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-400 block mb-1">主題色 (Color)</label>
                                <div class="flex items-center space-x-2">
                                    <input type="color" id="propColor" oninput="updateSelectedNode('color', this.value)" onchange="saveHistory()" class="w-8 h-8 rounded cursor-pointer border border-slate-700 bg-transparent p-0">
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">所屬群組 (Group)</label>
                            <select id="propGroup" onchange="updateSelectedNode('group', this.value); saveHistory();" class="w-full bg-slate-950 px-2.5 py-1.5 rounded border border-slate-700 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
                                <!-- Dynamically filled -->
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Relations Tab -->
                <div id="panel-relations" class="hidden space-y-6">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">連線管理</h3>
                            <button onclick="addEdge()" class="text-[10px] bg-blue-600 hover:bg-blue-500 text-white px-2 py-0.5 rounded shadow-sm">+ 新增</button>
                        </div>
                        <div id="edgeList" class="space-y-2"></div>
                    </div>
                    
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">群組管理</h3>
                        </div>
                        <div id="groupList" class="space-y-2"></div>
                    </div>
                </div>

            </div>
        </aside>

        <!-- Right Canvas Area -->
        <main class="flex-1 relative overflow-hidden bg-slate-950 grid-bg" id="canvasContainer">
            
            <!-- Canvas Actions (Floating) -->
            <div class="absolute top-4 right-4 z-20 flex space-x-2">
                <div class="bg-slate-900/80 backdrop-blur border border-slate-700 rounded-lg p-1 flex shadow-lg">
                    <button onclick="zoomCanvas(-0.2)" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white rounded hover:bg-slate-800 transition"><i class="fa-solid fa-minus text-xs"></i></button>
                    <div class="w-12 flex items-center justify-center text-xs font-bold text-slate-300" id="zoomLevel">100%</div>
                    <button onclick="zoomCanvas(0.2)" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white rounded hover:bg-slate-800 transition"><i class="fa-solid fa-plus text-xs"></i></button>
                </div>
                <button onclick="centerView()" class="bg-slate-900/80 backdrop-blur border border-slate-700 text-slate-400 hover:text-white w-10 h-10 rounded-lg shadow-lg flex items-center justify-center transition" title="置中畫面">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>

            <!-- Viewport -->
            <div id="canvasViewport" class="w-full h-full cursor-grab origin-top-left absolute top-0 left-0">
                <!-- SVG Engine -->
                <div id="svgContainer" class="w-full h-full pointer-events-none"></div>
            </div>
            
            <!-- Selection Box -->
            <div id="selectionBox"></div>

        </main>
    </div>

    <!-- Export Modal -->
    <div id="exportModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-[400px] overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                <h2 class="text-sm font-bold text-slate-100"><i class="fa-solid fa-download text-blue-400 mr-2"></i>匯出圖表</h2>
                <button onclick="closeExportModal()" class="text-slate-500 hover:text-slate-300"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="text-xs text-slate-400 block mb-2">匯出格式</label>
                    <div class="flex space-x-2">
                        <button onclick="setExportFormat('svg')" id="btnFmtSvg" class="flex-1 py-2 rounded border border-blue-500 bg-blue-500/10 text-blue-400 text-sm font-bold transition">SVG (向量)</button>
                        <button onclick="setExportFormat('png')" id="btnFmtPng" class="flex-1 py-2 rounded border border-slate-700 bg-slate-800 text-slate-400 hover:text-slate-200 text-sm font-bold transition">PNG (圖片)</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-2">匯出範圍</label>
                    <select id="exportArea" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none">
                        <option value="auto">自動裁切 (包含所有節點)</option>
                        <option value="viewport">目前可視範圍</option>
                        <option value="custom" id="optCustomArea" disabled>自訂框選區域 (需先使用框選工具)</option>
                    </select>
                </div>
            </div>
            <div class="px-5 py-4 border-t border-slate-800 bg-slate-950 flex justify-end space-x-3">
                <button onclick="closeExportModal()" class="px-4 py-2 text-sm text-slate-400 hover:text-slate-200">取消</button>
                <button onclick="executeExport()" class="px-5 py-2 text-sm font-bold bg-blue-600 hover:bg-blue-500 text-white rounded shadow-md">確認下載</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-slate-200 px-4 py-2 rounded shadow-xl border border-slate-700 text-sm font-medium z-50 hidden"></div>

    <script>
        // --- Core State ---
        let state = {
            theme: 'academic',
            nodes: [],
            edges: [],
            subgraphs: []
        };

        // UI & History State
        let activeTab = 'library';
        let isShowIcons = true;
        let undoStack = [], redoStack = [];
        const MAX_HISTORY = 50;

        // Interaction State
        let panX = 0, panY = 0, canvasZoom = 1;
        let isDraggingCanvas = false, dragStartX = 0, dragStartY = 0;
        let isDraggingNode = false, selectedNodeId = null;
        let nodeDragOffsetX = 0, nodeDragOffsetY = 0;
        
        let appMode = 'drag'; // 'drag' | 'select'
        let isSelectingArea = false, selectStartX = 0, selectStartY = 0;
        let customExportBox = null;

        const NODE_W = 160;
        const NODE_H = 60;

        // --- Theme Configurations ---
        const THEMES = {
            academic: { bg: '#ffffff', grid: '#f0f0f0', nodeBg: '#ffffff', nodeBorder: '#334155', text: '#0f172a', textSub: '#64748b', line: '#475569', groupBg: '#f8fafc', groupBorder: '#cbd5e1' },
            tech: { bg: '#0f172a', grid: '#1e293b', nodeBg: '#1e293b', nodeBorder: '#3b82f6', text: '#f1f5f9', textSub: '#94a3b8', line: '#60a5fa', groupBg: '#0f172a', groupBorder: '#334155' },
            pastel: { bg: '#fdfbfb', grid: '#f3f4f6', nodeBg: '#ffffff', nodeBorder: '#e2e8f0', text: '#374151', textSub: '#9ca3af', line: '#94a3b8', groupBg: '#fff', groupBorder: '#e5e7eb' }
        };

        // Fallback SVG Paths for Icons (No HTML/ForeignObject needed)
        const SVG_ICONS = {
            'fa-database': 'M12 2C6.48 2 2 4.24 2 7v10c0 2.76 4.48 5 10 5s10-2.24 10-5V7c0-2.76-4.48-5-10-5zm0 18c-4.42 0-8-1.79-8-4v-2.26c2.08 1.4 5.25 2.26 8 2.26s5.92-.86 8-2.26V16c0 2.21-3.58 4-8 4zm0-6c-4.42 0-8-1.79-8-4V7.74c2.08 1.4 5.25 2.26 8 2.26s5.92-.86 8-2.26V10c0 2.21-3.58 4-8 4zm0-6c-4.42 0-8-1.79-8-4s3.58-4 8-4 8 1.79 8 4-3.58 4-8 4z',
            'fa-brain': 'M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z',
            'fa-server': 'M2 4c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V4zm2 14c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v4z',
            'default': 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z'
        };

        // --- Initialization & History ---
        window.onload = () => {
            loadTemplate('ml'); // Auto load template, this pushes initial history
            setupInteractions();
            document.addEventListener('keydown', handleKeyboard);
        };

        function saveHistory() {
            const stateStr = JSON.stringify(state);
            if (undoStack.length > 0 && undoStack[undoStack.length - 1] === stateStr) return; // Prevent dupes
            undoStack.push(stateStr);
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
            updateToolbarUI();
        }

        function undo() {
            if (undoStack.length <= 1) return;
            redoStack.push(undoStack.pop());
            state = JSON.parse(undoStack[undoStack.length - 1]);
            updateAllUI();
        }

        function redo() {
            if (redoStack.length === 0) return;
            const next = redoStack.pop();
            undoStack.push(next);
            state = JSON.parse(next);
            updateAllUI();
        }

        function handleKeyboard(e) {
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedNodeId) { e.preventDefault(); deleteSelectedNode(); }
            }
        }

        function updateAllUI() {
            renderDiagram();
            if (activeTab === 'properties') refreshPropertiesPanel();
            if (activeTab === 'relations') updateRelationsPanel();
            updateToolbarUI();
        }

        function updateToolbarUI() {
            document.getElementById('btnUndo').disabled = undoStack.length <= 1;
            document.getElementById('btnRedo').disabled = redoStack.length === 0;
            document.getElementById('themeSelect').value = state.theme;
        }

        // --- Canvas Navigation & Dragging ---
        function getMousePositionInSVG(e) {
            const vp = document.getElementById('canvasViewport');
            const rect = vp.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left - panX) / canvasZoom,
                y: (e.clientY - rect.top - panY) / canvasZoom
            };
        }

        function setupInteractions() {
            const vp = document.getElementById('canvasViewport');

            vp.addEventListener('mousedown', (e) => {
                if (appMode === 'select') {
                    // Export Area Selection
                    isSelectingArea = true;
                    selectStartX = e.clientX;
                    selectStartY = e.clientY;
                    const sb = document.getElementById('selectionBox');
                    sb.style.display = 'block';
                    sb.style.left = selectStartX + 'px';
                    sb.style.top = selectStartY + 'px';
                    sb.style.width = '0px';
                    sb.style.height = '0px';
                    return;
                }

                const nodeElem = e.target.closest('.node-group');
                if (nodeElem) {
                    isDraggingNode = true;
                    selectedNodeId = nodeElem.getAttribute('data-id');
                    
                    const pt = getMousePositionInSVG(e);
                    const node = state.nodes.find(n => n.id === selectedNodeId);
                    nodeDragOffsetX = pt.x - node.x;
                    nodeDragOffsetY = pt.y - node.y;
                    
                    switchTab('properties');
                    refreshPropertiesPanel();
                    renderDiagram(); // Highlight
                } else {
                    isDraggingCanvas = true;
                    dragStartX = e.clientX - panX;
                    dragStartY = e.clientY - panY;
                    vp.classList.remove('cursor-grab');
                    vp.classList.add('cursor-grabbing');
                    selectNode(null);
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isSelectingArea) {
                    const sb = document.getElementById('selectionBox');
                    sb.style.left = Math.min(selectStartX, e.clientX) + 'px';
                    sb.style.top = Math.min(selectStartY, e.clientY) + 'px';
                    sb.style.width = Math.abs(e.clientX - selectStartX) + 'px';
                    sb.style.height = Math.abs(e.clientY - selectStartY) + 'px';
                    return;
                }

                if (isDraggingCanvas) {
                    panX = e.clientX - dragStartX;
                    panY = e.clientY - dragStartY;
                    updateCanvasTransform();
                }

                if (isDraggingNode && selectedNodeId) {
                    const pt = getMousePositionInSVG(e);
                    const node = state.nodes.find(n => n.id === selectedNodeId);
                    if (node) {
                        node.x = Math.round((pt.x - nodeDragOffsetX) / 10) * 10;
                        node.y = Math.round((pt.y - nodeDragOffsetY) / 10) * 10;
                        renderDiagram();
                    }
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (isSelectingArea) {
                    isSelectingArea = false;
                    const sb = document.getElementById('selectionBox');
                    sb.style.display = 'none';
                    
                    // Calculate relative coords
                    const vpRect = document.getElementById('canvasViewport').getBoundingClientRect();
                    const rx1 = (Math.min(selectStartX, e.clientX) - vpRect.left - panX) / canvasZoom;
                    const ry1 = (Math.min(selectStartY, e.clientY) - vpRect.top - panY) / canvasZoom;
                    const rx2 = (Math.max(selectStartX, e.clientX) - vpRect.left - panX) / canvasZoom;
                    const ry2 = (Math.max(selectStartY, e.clientY) - vpRect.top - panY) / canvasZoom;
                    
                    if (rx2 - rx1 > 50 && ry2 - ry1 > 50) {
                        customExportBox = { x: rx1, y: ry1, w: rx2 - rx1, h: ry2 - ry1 };
                        setMode('drag'); // Auto revert mode
                        openExportModal();
                    }
                    return;
                }

                if (isDraggingNode && selectedNodeId) {
                    const node = state.nodes.find(n => n.id === selectedNodeId);
                    if (node) {
                        // Check if dropped inside a NEW group
                        const nodeCX = node.x + (NODE_W / 2);
                        const nodeCY = node.y + (NODE_H / 2);
                        let droppedInGroup = null;

                        state.subgraphs.forEach(g => {
                            const gb = getGroupBoundingBox(g.id);
                            if (nodeCX >= gb.x && nodeCX <= gb.x + gb.w && nodeCY >= gb.y && nodeCY <= gb.y + gb.h) {
                                droppedInGroup = g.id;
                            }
                        });

                        // ONLY bind to group if it's a valid new group. Do not unbind if dropped in blank space.
                        if (droppedInGroup && node.group !== droppedInGroup) {
                            node.group = droppedInGroup;
                            showToast('已自動吸附至群組');
                            refreshPropertiesPanel();
                        }
                        saveHistory();
                    }
                }

                isDraggingNode = false;
                if (isDraggingCanvas) {
                    isDraggingCanvas = false;
                    vp.classList.add('cursor-grab');
                    vp.classList.remove('cursor-grabbing');
                }
            });

            vp.addEventListener('wheel', (e) => {
                e.preventDefault();
                zoomCanvas(e.deltaY > 0 ? -0.1 : 0.1, e.clientX, e.clientY);
            });
        }

        function zoomCanvas(delta, mx = null, my = null) {
            const oldZoom = canvasZoom;
            canvasZoom = Math.max(0.2, Math.min(3, canvasZoom + delta));
            
            const vpRect = document.getElementById('canvasViewport').getBoundingClientRect();
            const cx = mx !== null ? (mx - vpRect.left) : (vpRect.width / 2);
            const cy = my !== null ? (my - vpRect.top) : (vpRect.height / 2);
            
            panX = cx - (cx - panX) * (canvasZoom / oldZoom);
            panY = cy - (cy - panY) * (canvasZoom / oldZoom);
            
            updateCanvasTransform();
            document.getElementById('zoomLevel').innerText = Math.round(canvasZoom * 100) + '%';
        }

        function updateCanvasTransform() {
            const svg = document.getElementById('svgContainer');
            svg.style.transform = `translate(${panX}px, ${panY}px) scale(${canvasZoom})`;
            svg.style.transformOrigin = '0 0';
            
            // Sync background grid
            const container = document.getElementById('canvasContainer');
            container.style.backgroundPosition = `${panX}px ${panY}px`;
            container.style.backgroundSize = `${20 * canvasZoom}px ${20 * canvasZoom}px`;
        }

        function centerView() {
            if (state.nodes.length === 0) {
                panX = 0; panY = 0; canvasZoom = 1;
                updateCanvasTransform();
                return;
            }
            
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            state.nodes.forEach(n => {
                minX = Math.min(minX, n.x);
                minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x + NODE_W);
                maxY = Math.max(maxY, n.y + NODE_H);
            });
            
            // Consider empty groups
            state.subgraphs.forEach(g => {
                const gNodes = state.nodes.filter(n => n.group === g.id);
                if (gNodes.length === 0) {
                    minX = Math.min(minX, g.x); minY = Math.min(minY, g.y);
                    maxX = Math.max(maxX, g.x + 300); maxY = Math.max(maxY, g.y + 200);
                }
            });

            const vp = document.getElementById('canvasViewport').getBoundingClientRect();
            const contentW = maxX - minX + 100; // padding
            const contentH = maxY - minY + 100;
            
            canvasZoom = Math.min(1, Math.min(vp.width / contentW, vp.height / contentH));
            panX = (vp.width - (maxX - minX) * canvasZoom) / 2 - (minX * canvasZoom);
            panY = (vp.height - (maxY - minY) * canvasZoom) / 2 - (minY * canvasZoom);
            
            updateCanvasTransform();
            document.getElementById('zoomLevel').innerText = Math.round(canvasZoom * 100) + '%';
        }

        // Add Nodes & Groups
        function addNode(shape) {
            const vpRect = document.getElementById('canvasViewport').getBoundingClientRect();

            const cx = (vpRect.width / 2 - panX) / canvasZoom;

            };

        function deleteSelectedNode() {
            if(!selectedNodeId) return;
            state.nodes = state.nodes.filter(n => n.id !== selectedNodeId);
            state.edges = state.edges.filter(e => e.from !== selectedNodeId && e.to !== selectedNodeId);

        function addGroup() {

        // --- SVG Rendering Engine ---
        function getGroupBoundingBox(gid) {
            const gNodes = state.nodes.filter(n => n.group === gid);
            const gData = state.subgraphs.find(g => g.id === gid);
            
            if (gNodes.length === 0) {
                return { x: gData.x || 0, y: gData.y || 0, w: 300, h: 200, isEmpty: true };
            }
            
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            gNodes.forEach(n => {
                minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x + NODE_W); maxY = Math.max(maxY, n.y + NODE_H);
            });
            return { x: minX - 30, y: minY - 45, w: (maxX - minX) + 60, h: (maxY - minY) + 75, isEmpty: false };
        }

        function renderNodeShape(shape, w, h, bg, border) {
            const bWidth = 2;
            switch(shape) {
                case 'capsule':
                    return `<rect x="0" y="0" width="${w}" height="${h}" rx="${h/2}" fill="${bg}" stroke="${border}" stroke-width="${bWidth}"/>`;
                case 'diamond':
                    return `<polygon points="${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}" fill="${bg}" stroke="${border}" stroke-width="${bWidth}"/>`;
                case 'database':
                    return `
                        <path d="M0,12 C0,4 ${w},4 ${w},12 L${w},${h-12} C${w},${h-4} 0,${h-4} 0,${h-12} Z" fill="${bg}" stroke="${border}" stroke-width="${bWidth}"/>
                        <path d="M0,12 C0,20 ${w},20 ${w},12" fill="none" stroke="${border}" stroke-width="${bWidth}"/>
                    `;
                case 'hexagon':
                    return `<polygon points="15,0 ${w-15},0 ${w},${h/2} ${w-15},${h} 15,${h} 0,${h/2}" fill="${bg}" stroke="${border}" stroke-width="${bWidth}"/>`;
                default: // rect
                    return `<rect x="0" y="0" width="${w}" height="${h}" rx="6" fill="${bg}" stroke="${border}" stroke-width="${bWidth}"/>`;
            }
        }

        function renderDiagram() {
            const t = THEMES[state.theme];
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="overflow:visible;">
                <defs>
                    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="${t.line}" />
                    </marker>
                    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
                        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
                    </filter>
                </defs>
                <style>
                    text { font-family: 'Inter', Arial, sans-serif; }
                    .node-group { cursor: move; }
                    .node-group.node-selected > * { filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.7)); stroke: #3b82f6 !important; stroke-width: 3px !important; }
                </style>
                <g id="diagramContent">`;

            // Draw Groups
            state.subgraphs.forEach(g => {
                const box = getGroupBoundingBox(g.id);
                const gColor = g.color || '#94a3b8';
                
                svg += `
                    <rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="12" fill="${gColor}" fill-opacity="0.05" stroke="${gColor}" stroke-width="2" stroke-dasharray="6,6"/>
                    <rect x="${box.x}" y="${box.y}" width="${box.w}" height="28" fill="${gColor}" fill-opacity="0.15" rx="12" clip-path="inset(0 0 14px 0)"/>
                    <text x="${box.x + 12}" y="${box.y + 19}" font-size="12" font-weight="bold" fill="${gColor}">${g.label}</text>
                `;

                if (box.isEmpty) {
                    svg += `<text x="${box.x + box.w/2}" y="${box.y + box.h/2}" font-size="12" fill="${gColor}" opacity="0.6" text-anchor="middle">空群組：請在節點「屬性」中指派</text>`;
                }
            });

            // Draw Edges
            state.edges.forEach(e => {
                const n1 = state.nodes.find(n => n.id === e.from);
                const n2 = state.nodes.find(n => n.id === e.to);
                if (!n1 || !n2) return;

                const c1 = {x: n1.x + NODE_W/2, y: n1.y + NODE_H/2};
                const c2 = {x: n2.x + NODE_W/2, y: n2.y + NODE_H/2};
                
                // Curve calculation
                const dist = Math.abs(c2.x - c1.x);
                let pathD = `M ${c1.x} ${c1.y}`;
                if (c2.x > c1.x + NODE_W && Math.abs(c2.y - c1.y) < 100) { // L to R curve
                    pathD += ` C ${c1.x + dist*0.4} ${c1.y}, ${c2.x - dist*0.4} ${c2.y}, ${c2.x} ${c2.y}`;
                } else if (c2.y > c1.y + NODE_H && Math.abs(c2.x - c1.x) < 100) { // T to B curve
                    const distY = Math.abs(c2.y - c1.y);
                    pathD += ` C ${c1.x} ${c1.y + distY*0.4}, ${c2.x} ${c2.y - distY*0.4}, ${c2.x} ${c2.y}`;
                } else {
                    pathD += ` L ${c2.x} ${c2.y}`; // Line
                }

                const sDash = e.style === 'dashed' ? 'stroke-dasharray="5,5"' : '';
                svg += `<path d="${pathD}" fill="none" stroke="${t.line}" stroke-width="2" ${sDash} marker-end="url(#arrowHead)"/>`;
                
                if (e.label) {
                    const midX = (c1.x + c2.x) / 2;
                    const midY = (c1.y + c2.y) / 2;
                    svg += `
                        <rect x="${midX - 30}" y="${midY - 10}" width="60" height="20" fill="${t.bg}" rx="4" stroke="${t.line}" stroke-width="1"/>
                        <text x="${midX}" y="${midY + 4}" font-size="10" fill="${t.text}" text-anchor="middle">${e.label}</text>
                    `;
                }
            });

            // Draw Nodes
            state.nodes.forEach(n => {
                const isSelected = selectedNodeId === n.id;
                const sClass = isSelected ? 'node-selected' : '';
                const iColor = n.color || '#3b82f6';
                
                let iconKey = (n.icon && n.icon.startsWith('fa-')) ? n.icon : ('fa-' + n.icon);
                let svgPath = SVG_ICONS[iconKey] || SVG_ICONS['default'];

                let content = '';
                if (isShowIcons) {
                    content = `
                        <rect x="14" y="14" width="32" height="32" rx="6" fill="${iColor}20" />
                        <svg x="18" y="18" width="24" height="24" viewBox="0 0 24 24" fill="${iColor}">
                            <path d="${svgPath}" />
                        </svg>
                        <text x="56" y="${n.sub ? 28 : 35}" font-size="13" font-weight="bold" fill="${t.text}">${n.label}</text>
                        ${n.sub ? `<text x="56" y="44" font-size="10" fill="${t.textSub}">${n.sub}</text>` : ''}
                    `;
                } else {
                    // Left align text when no icon
                    content = `
                        <text x="20" y="${n.sub ? 28 : 35}" font-size="14" font-weight="bold" fill="${t.text}">${n.label}</text>
                        ${n.sub ? `<text x="20" y="46" font-size="11" fill="${t.textSub}">${n.sub}</text>` : ''}
                    `;
                }

                svg += `
                    <g transform="translate(${n.x}, ${n.y})" class="node-group ${sClass}" data-id="${n.id}" filter="url(#dropShadow)">
                        ${renderNodeShape(n.shape, NODE_W, NODE_H, t.nodeBg, iColor)}
                        ${content}
                    </g>
                `;
            });

            svg += `</g></svg>`;
            document.getElementById('svgContainer').innerHTML = svg;
        }

        // --- Export Logic ---
        let currentExportFormat = 'svg';

        function openExportModal() {
            document.getElementById('exportModal').classList.remove('hidden');
            document.getElementById('exportModal').classList.add('flex');
            
            const areaSel = document.getElementById('exportArea');
            if (customExportBox) {
                document.getElementById('optCustomArea').disabled = false;
                areaSel.value = 'custom';
            } else {
                document.getElementById('optCustomArea').disabled = true;
                areaSel.value = 'auto';
            }
        }
        function closeExportModal() {
            document.getElementById('exportModal').classList.add('hidden');
            document.getElementById('exportModal').classList.remove('flex');
        }
        function setExportFormat(fmt) {
            currentExportFormat = fmt;
            document.getElementById('btnFmtSvg').className = fmt === 'svg' ? 'flex-1 py-2 rounded border border-blue-500 bg-blue-500/10 text-blue-400 text-sm font-bold transition' : 'flex-1 py-2 rounded border border-slate-700 bg-slate-800 text-slate-400 hover:text-slate-200 text-sm font-bold transition';
            document.getElementById('btnFmtPng').className = fmt === 'png' ? 'flex-1 py-2 rounded border border-blue-500 bg-blue-500/10 text-blue-400 text-sm font-bold transition' : 'flex-1 py-2 rounded border border-slate-700 bg-slate-800 text-slate-400 hover:text-slate-200 text-sm font-bold transition';
        }

        function executeExport() {
            const areaType = document.getElementById('exportArea').value;
            const svgElem = document.querySelector('#svgContainer svg');
            let exportBox = { x: 0, y: 0, w: 0, h: 0 };

            if (areaType === 'auto') {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                state.nodes.forEach(n => {
                    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
                    maxX = Math.max(maxX, n.x + NODE_W); maxY = Math.max(maxY, n.y + NODE_H);
                });
                state.subgraphs.forEach(g => {
                    const gb = getGroupBoundingBox(g.id);
                    minX = Math.min(minX, gb.x); minY = Math.min(minY, gb.y);
                    maxX = Math.max(maxX, gb.x + gb.w); maxY = Math.max(maxY, gb.y + gb.h);
                });
                if(minX === Infinity) { minX = 0; minY = 0; maxX = 500; maxY = 500; }
                exportBox = { x: minX - 50, y: minY - 50, w: (maxX - minX) + 100, h: (maxY - minY) + 100 };
            } else if (areaType === 'viewport') {
                const vp = document.getElementById('canvasViewport').getBoundingClientRect();
                exportBox = { x: -panX/canvasZoom, y: -panY/canvasZoom, w: vp.width/canvasZoom, h: vp.height/canvasZoom };
            } else if (areaType === 'custom' && customExportBox) {
                exportBox = customExportBox;
            }

            // Clone SVG for export manipulation
            const clone = svgElem.cloneNode(true);
            clone.setAttribute('viewBox', `${exportBox.x} ${exportBox.y} ${exportBox.w} ${exportBox.h}`);
            clone.setAttribute('width', exportBox.w);
            clone.setAttribute('height', exportBox.h);
            
            // Add Background
            const bgRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            bgRect.setAttribute('x', exportBox.x); bgRect.setAttribute('y', exportBox.y);
            bgRect.setAttribute('width', exportBox.w); bgRect.setAttribute('height', exportBox.h);
            bgRect.setAttribute('fill', THEMES[state.theme].bg);
            clone.insertBefore(bgRect, clone.firstChild);

            // Hide UI states
            clone.querySelectorAll('.node-selected').forEach(el => el.classList.remove('node-selected'));

            const svgData = new XMLSerializer().serializeToString(clone);

            if (currentExportFormat === 'svg') {
                const blob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'workflow.svg';
                link.click();
            } else {
                // PNG Export using standard canvas via Image
                const canvas = document.createElement('canvas');
                const scale = 2; // High Res
                canvas.width = exportBox.w * scale;
                canvas.height = exportBox.h * scale;
                const ctx = canvas.getContext('2d');
                
                const img = new Image();
                img.onload = () => {
                    ctx.fillStyle = THEMES[state.theme].bg;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const a = document.createElement('a');
                    a.download = 'workflow.png';
                    a.href = canvas.toDataURL('image/png');
                    a.click();
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            }

            closeExportModal();
            showToast('圖表匯出成功！');
        }

        function refreshPropertiesPanel() {
            if(!selectedNodeId) return;
            document.getElementById('emptyProperties').classList.add('hidden');
            document.getElementById('nodeProperties').classList.remove('hidden');
            
            const n = state.nodes.find(x => x.id === selectedNodeId);
            document.getElementById('propLabel').value = n.label;
            document.getElementById('propSub').value = n.sub;
            document.getElementById('propIcon').value = n.icon;
            document.getElementById('propColor').value = n.color;
            
            const gSelect = document.getElementById('propGroup');
            gSelect.innerHTML = `<option value="">(無群組)</option>` + 
                state.subgraphs.map(g => `<option value="${g.id}" ${n.group===g.id?'selected':''}>${g.label}</option>`).join('');
        }

        function updateSelectedNode(key, val) {
            if(!selectedNodeId) return;
            const n = state.nodes.find(x => x.id === selectedNodeId);
            n[key] = val;
            renderDiagram(); // History is saved via onchange attribute in HTML
        }

        function updateRelationsPanel() {
            // Update Edges
            const eHTML = state.edges.map((e, idx) => `
                <div class="bg-slate-950 p-2 rounded border border-slate-800 space-y-2">
                    <div class="flex items-center space-x-2">
                        <select onchange="state.edges[${idx}].from=this.value; renderDiagram(); saveHistory();" class="flex-1 bg-slate-900 text-xs text-slate-200 border border-slate-700 rounded p-1">
                            ${state.nodes.map(n => `<option value="${n.id}" ${e.from===n.id?'selected':''}>${n.label}</option>`).join('')}
                        </select>
                        <i class="fa-solid fa-arrow-right text-slate-500 text-[10px]"></i>
                        <select onchange="state.edges[${idx}].to=this.value; renderDiagram(); saveHistory();" class="flex-1 bg-slate-900 text-xs text-slate-200 border border-slate-700 rounded p-1">
                            ${state.nodes.map(n => `<option value="${n.id}" ${e.to===n.id?'selected':''}>${n.label}</option>`).join('')}
                        </select>
                        <button onclick="state.edges.splice(${idx},1); updateRelationsPanel(); renderDiagram(); saveHistory();" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('') || '<p class="text-xs text-slate-500">尚無連線</p>';
            document.getElementById('edgeList').innerHTML = eHTML;

            // Update Groups
            const gHTML = state.subgraphs.map((g, idx) => `
                <div class="bg-slate-950 p-2 rounded border border-slate-800 flex items-center space-x-2">
                    <input type="color" value="${g.color}" onchange="state.subgraphs[${idx}].color=this.value; renderDiagram(); saveHistory();" class="w-6 h-6 rounded p-0 border border-slate-700 bg-transparent">
                    <input type="text" value="${g.label}" onchange="state.subgraphs[${idx}].label=this.value; renderDiagram(); saveHistory();" class="flex-1 bg-slate-900 text-xs text-slate-200 border border-slate-700 rounded px-2 py-1">
                    <button onclick="deleteGroup(${idx})" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('') || '<p class="text-xs text-slate-500">尚無群組</p>';
            document.getElementById('groupList').innerHTML = gHTML;
        }

        function addEdge() {
            if (state.nodes.length < 2) return showToast('請先新增至少兩個節點');
            state.edges.push({ from: state.nodes[0].id, to: state.nodes[1].id, label: '' });
            saveHistory();
            updateRelationsPanel();
            renderDiagram();
        }

        function deleteGroup(idx) {
            const gid = state.subgraphs[idx].id;
            state.subgraphs.splice(idx, 1);
            state.nodes.forEach(n => { if (n.group === gid) n.group = ''; });
            saveHistory();
            updateRelationsPanel();
            refreshPropertiesPanel();
            renderDiagram();
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg;
            el.classList.remove('hidden');
            el.classList.add('toast-enter');
            setTimeout(() => { el.classList.add('hidden'); el.classList.remove('toast-enter'); }, 3000);
        }

    </script>
</body>
</html>
